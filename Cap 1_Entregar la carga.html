<style>

*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;width:100%}body{font-family:'Segoe UI',Tahoma,Verdana,sans-serif;min-height:100dvh;background:linear-gradient(145deg,var(--bg1),var(--bg2) 52%,var(--bg3));display:flex;align-items:center;justify-content:center;color:var(--ink);overflow:hidden;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}.wrap{width:100%;max-width:min(96vw,980px);height:min(96dvh,940px);display:flex}.app{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;background:rgba(255,250,243,.985);border-radius:30px;box-shadow:var(--shadow);border:1px solid rgba(215,189,138,.35)}.head{padding:15px 18px 12px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);background:rgba(255,250,243,.92);flex-shrink:0}.avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:radial-gradient(circle at 35% 25%,#fff4cc,#d7bd8a 50%,#7c5731);box-shadow:0 0 18px rgba(215,189,138,.65)}.info{flex:1;min-width:0}.info h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info p{font-size:11.5px;color:var(--muted)}.tools{display:flex;gap:6px}.tool{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#f3eadf;cursor:pointer;font-size:14px}.barwrap{height:4px;background:#eadfc9;flex-shrink:0}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .3s ease}.msgs{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:clamp(12px,2vw,22px) clamp(14px,2.4vw,30px) clamp(90px,11vh,140px);display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}.m{max-width:min(98%,860px);padding:clamp(11px,1.8vw,16px) clamp(14px,2vw,20px);border-radius:18px;font-size:clamp(14px,1.7vw,17px);line-height:1.85;overflow-wrap:anywhere}.ai{background:var(--paper2);align-self:flex-start;border-bottom-left-radius:5px}.user{background:var(--gold);align-self:flex-end;border-bottom-right-radius:5px}.sys{background:#fff3d4;border:1px solid var(--line);align-self:center;text-align:center;font-size:12.5px;color:#765c35}.panel{background:#fff8e9;border:1px solid var(--line);align-self:stretch;max-width:100%}.typing{background:var(--paper2);color:#7a6a58;align-self:flex-start;font-size:20px;letter-spacing:2px;min-width:58px;text-align:center}.opts{padding:8px 18px 10px;flex-shrink:0}.grid{display:none;flex-wrap:wrap;gap:7px;justify-content:center}.grid.show{display:flex}.opt{border:1.4px solid var(--line);border-radius:999px;padding:8px 13px;background:#f3eadf;color:#2a2118;font-weight:650;cursor:pointer}.input{padding:0 18px 12px;flex-shrink:0}.row{display:none;gap:8px;background:#f3eadf;border-radius:25px;padding:4px;border:1px solid transparent}.row.show{display:flex}.row:focus-within{border-color:var(--gold)}input{flex:1;background:transparent;border:0;outline:0;padding:11px 12px;font-size:14px}.send{border:0;border-radius:21px;background:var(--gold);font-weight:750;padding:10px 16px;cursor:pointer}.safe{font-size:11.3px;color:#7a6a58;text-align:center;padding:0 18px 9px;flex-shrink:0}.foot{padding:0 18px 12px;display:flex;gap:8px;justify-content:center;flex-shrink:0}.mini{border:0;background:transparent;color:#7a6a58;font-size:12px;cursor:pointer}.modal{position:fixed;inset:0;background:rgba(0,0,0,.52);display:none;align-items:center;justify-content:center;z-index:9;padding:18px}.modal.show{display:flex}.card{background:var(--paper);border-radius:24px;padding:22px;width:min(540px,100%);box-shadow:var(--shadow)}.card h2{font-size:20px;margin-bottom:10px}.card p{font-size:14px;line-height:1.65;color:#4d3920}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}.primary,.secondary{border:0;border-radius:14px;padding:10px 14px;cursor:pointer}.primary{background:var(--gold);font-weight:750}.secondary{background:#f3eadf}@media(max-width:540px){body{padding:0}.wrap{height:100dvh;max-width:100%}.app{border-radius:0}.head{padding:calc(12px + env(safe-area-inset-top)) 14px 10px}.msgs{padding:12px 14px calc(100px + env(safe-area-inset-bottom))}.m{font-size:14.6px}.tool{width:31px;height:31px}.opt{font-size:12px;padding:7px 11px}.foot{padding-bottom:calc(10px + env(safe-area-inset-bottom))}}

<body>
<div class="wrap"><main class="app"><header class="head"><div class="avatar">😊</div><div class="info"><h1>Mi Yo Interior</h1><p>Capítulo 1 · Entregar la carga</p></div><div class="tools"><button class="tool" id="voice">🔈</button><button class="tool" id="amb">🎵</button><button class="tool" id="theme">🌙</button><button class="tool" id="speed">🐢</button></div></header><div class="barwrap"><div class="bar" id="bar"></div></div><section class="msgs" id="msgs"></section><section class="opts"><div class="grid" id="grid"></div></section><section class="input"><div class="row" id="row"><input id="txt"><button class="send" id="send">Enviar</button></div></section><p class="safe">Experiencia reflexiva y educativa. No reemplaza atención psicológica, médica, legal o financiera profesional.</p><footer class="foot"><button class="mini" id="reset">↺ Reiniciar</button><button class="mini" id="save">💾 Guardar</button><button class="mini" id="clear">🧹 Borrar</button></footer></main></div><div class="modal" id="modal"><div class="card"><h2 id="mt"></h2><p id="mb"></p><div class="actions" id="ma"></div></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id); const msgs=$('msgs'),grid=$('grid'),row=$('row'),txt=$('txt'),bar=$('bar');
let st={step:'welcome',name:'',carga:'',necesita:'',accion:'',noControl:'',frase:'',history:[],voice:false,ambient:false,dark:false,slow:true};
const STEPS=['welcome','name','carga','pausaIntro','pausa','necesita','necesitaCustom','accion','noControl','espejo','frase','final'];
const NECESITA=['Una acción concreta','Una conversación','Una decisión','Más información','Tiempo para avanzar','Un límite','Aceptar algo que no puedo cambiar','Todavía no lo sé','✍️ Escribir mi propia respuesta'];
const FRASE_OPTS=['Sí, quiero conservarla','Quiero cambiar una parte','Prefiero escribirla con mis palabras'];
const RISK=['suicidio','suicidarme','matarme','hacerme daño','no quiero vivir','autolesión','autolesion','abuso','violencia','emergencia','amenaza','peligro inmediato'];
function clean(t){return String(t||'').replace(/<strong[^>]*data-lexical-text="true"[^>]*>/g,'<strong>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/\n/g,'<br>')}
function progress(){let i=STEPS.indexOf(st.step);bar.style.width=Math.max(0,Math.round((i/(STEPS.length-1))*100))+'%'}
function scrollEnd(){requestAnimationFrame(()=>setTimeout(()=>msgs.scrollTo({top:msgs.scrollHeight,behavior:'smooth'}),80))}
function add(text,who='ai',extra=''){let d=document.createElement('div');d.className='m '+who+(extra?' '+extra:'');d.innerHTML=clean(text);msgs.appendChild(d);if(who!=='typing')st.history.push({who,text,extra});scrollEnd();return d}
function typing(){let d=document.createElement('div');d.className='m typing';d.textContent='...';msgs.appendChild(d);scrollEnd();return d}
function opts(arr=[]){grid.innerHTML='';if(!arr.length){grid.classList.remove('show');return}grid.classList.add('show');arr.forEach(o=>{let b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>handle(o);grid.appendChild(b)})}
function inputShow(show,ph='Escribe aquí...'){row.classList.toggle('show',!!show);txt.placeholder=ph;if(show)setTimeout(()=>txt.focus(),60)}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function readPause(text){let w=String(text||'').split(/\s+/).filter(Boolean).length;return st.slow?Math.min(10000,Math.max(2200,w*170)):Math.min(5000,Math.max(900,w*80))}
function splitText(text){return String(text||'').split(/\n\n+/).map(x=>x.trim()).filter(Boolean)}
function emptyBubble(extra=''){let d=document.createElement('div');d.className='m ai'+(extra?' '+extra:'');msgs.appendChild(d);scrollEnd();return d}
async function typeInto(el,text){let out='';for(let i=0;i<text.length;i++){let ch=text.charAt(i);out+=ch;el.innerHTML=clean(out);if(i%3===0)scrollEnd();let ms=st.slow?(ch==='.'?340:(ch==='?'?460:(ch==='!'?420:(ch===','?150:(ch===';'?170:(ch===':'?170:28)))))):(ch==='.'?180:(ch==='?'?260:(ch==='!'?240:(ch===','?85:12))));await wait(ms)}el.innerHTML=clean(text);scrollEnd()}
async function ai(text,buttons=[],input=false,ph='Escribe aquí...',extra=''){opts([]);inputShow(false);progress();let parts=splitText(text);for(let part of parts){let t=typing();await wait(st.slow?900:450);t.remove();let b=emptyBubble(extra);await typeInto(b,part);st.history.push({who:'ai',text:part,extra});speak(part);await wait(readPause(part))}opts(buttons);inputShow(input,ph);save(false)}
function speak(text){if(!st.voice||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text.replace(/[\*#•]/g,''));u.lang='es-CL';u.rate=.86;speechSynthesis.speak(u)}
function risk(text){let x=String(text).toLowerCase();if(RISK.some(r=>x.includes(r))){st.step='risk';ai('Lo que estás expresando requiere apoyo humano inmediato. Este acompañamiento digital no puede resolver emergencias ni reemplazar ayuda profesional. Busca ahora una persona adulta de confianza, un profesional o el servicio de emergencia de tu ubicación.',['🌿 Volver al inicio']);return true}return false}
function handle(text){if(text.includes('Volver al inicio')||text.includes('Reiniciar'))return resetAll();add(text,'user');if(risk(text))return;process(String(text).trim())}
function process(text){switch(st.step){
case 'welcome':st.step='name';ai('😊 Hola. Soy **Mi Yo Interior**, el acompañante digital de este libro.\n\nNo conozco tus respuestas de antemano. Mi función será ayudarte a reconocerlas y ordenarlas.\n\n¿Cómo te gustaría que te llame?',[],true,'Escribe tu nombre o un apodo.');break;
case 'name':st.name=text;st.step='carga';ai('Gracias, **'+st.name+'**.\n\nNo necesitas contar todos los detalles. Comparte solamente lo necesario para comprender qué estás cargando.\n\n💭 ¿Qué situación ocupa hoy demasiado espacio en tus pensamientos y consideras que es una carga?',[],true,'Lo que estoy cargando es...');break;
case 'carga':st.carga=text;st.step='pausaIntro';ai('Entiendo, **'+st.name+'**.\n\nHas identificado que **'+st.carga+'** está ocupando tu atención.\n\nAntes de intentar resolverla, hagamos una pausa diferente.',['🌿 Iniciar pausa']);break;
case 'pausaIntro':st.step='pausa';ai('🌿 Busca un objeto pequeño que tengas cerca: una llave, un lápiz, una piedra o cualquier objeto seguro. Si no tienes uno, puedes imaginarlo.\n\nSostén el objeto durante unos segundos. Imagina que representa la situación que acabas de nombrar.\n\nNo necesitas rechazarla ni fingir que dejó de importarte.\n\nEspera un minuto.\n\nAhora deposita y deja lentamente el objeto frente a ti.\n\nObsérvalo y repite mentalmente:\n\n**“Esta situación existe, pero no necesito sostenerla a cada momento para ocuparme de ella.”**\n\nDeja las manos libres por unos segundos.\n\nLa situación continúa frente a ti, pero ya no está apretada entre tus manos.',['✅ He depositado mi carga']);break;
case 'pausa':st.step='necesita';ai('✨ Ahora que has tomado un poco de distancia, observa la situación nuevamente.\n\n¿Cuál de estas posibilidades describe mejor lo que necesita?',NECESITA);break;
case 'necesita':if(text.includes('Escribir mi propia respuesta')){st.step='necesitaCustom';ai('✍️ Puedes escribir con tus propias palabras qué necesita esta carga. No tiene que calzar con una opción predefinida.',[],true,'Esta carga necesita...')}else{st.necesita=text;st.step='accion';ai('Has reconocido que esta situación necesita **'+st.necesita+'**.\n\nEso ya nos entrega una primera orientación. Ahora distingamos qué parte realmente te corresponde.\n\n📝 ¿Qué acción pequeña y posible depende directamente de ti para soltar la carga?',[],true,'Lo que sí puedo hacer es...')}break;
case 'necesitaCustom':st.necesita=text;st.step='accion';ai('Has reconocido que esta situación necesita **'+st.necesita+'**.\n\nEso ya nos entrega una primera orientación. Ahora distingamos qué parte realmente te corresponde.\n\n📝 ¿Qué acción pequeña y posible depende directamente de ti para soltar la carga?',[],true,'Lo que sí puedo hacer es...');break;
case 'accion':st.accion=text;st.step='noControl';ai('Tu respuesta fue clara: puedes **'+st.accion+'**.\n\nNo tienes que resolver toda la situación ahora. Ese es el movimiento que reconociste como propio.\n\n🌤️ ¿Qué parte de esta carga no puedes controlar completamente?',[],true,'No puedo controlar...');break;
case 'noControl':st.noControl=text;st.step='espejo';ai('Has diferenciado dos partes importantes.\n\nPuedes **'+st.accion+'**, pero no puedes controlar completamente **'+st.noControl+'**.\n\nReconocerlo no significa que la situación deje de importarte. Significa que no convertirás todo el resultado en una responsabilidad exclusivamente tuya.',['🪞 Continuar a devolución espejo']);break;
case 'espejo':st.step='frase';st.frase='Puedo '+st.accion+' y comenzar a soltar la necesidad de controlar '+st.noControl+'.';ai('🪞 **Quiero devolverte lo que tú mismo has expresado:**\n\nEstás cargando **'+st.carga+'**.\n\nAl observarla con distancia, reconociste que necesita **'+st.necesita+'**.\n\nTambién encontraste una acción que sí está en tus manos: **'+st.accion+'**.\n\nY comprendiste que no puedes controlar completamente **'+st.noControl+'**.\n\nLa respuesta no apareció fuera de ti. Ya estaba presente en la manera en que separaste tu acción de aquello que no te corresponde dirigir.\n\n❤️ Con tus propias respuestas, tu frase podría ser:\n\n**“'+st.frase+'”**\n\n¿Esta frase representa lo que descubriste?',FRASE_OPTS,false,'','panel');break;
case 'frase':if(text.includes('conservar'))closing();else if(text.includes('cambiar')){st.step='fraseChange';ai('📝 ¿Qué parte quieres cambiar?',[],true,'Quiero cambiar...')}else{st.step='fraseCustom';ai('📝 Escribe tu frase con tus palabras. La mantendremos fiel a tu descubrimiento, sin prometer que todo se resolverá favorablemente.',[],true,'Mi frase personal es...')}break;
case 'fraseChange':st.frase=reform(text);closing();break;
case 'fraseCustom':st.frase=reform(text);closing();break;
case 'final':if(text.includes('Guardar'))downloadText();else if(text.includes('tarjeta'))downloadPNG();else if(text.includes('Volver al libro'))thanksNext();else if(text.includes('pausa')){st.step='pausaIntro';process('x')}else ai('Puedes elegir una de las opciones finales.',['📖 Volver al libro','💾 Guardar mi reflexión','🖼️ Descargar tarjeta visual PNG','🌿 Repetir la pausa']);break;
case 'thanks':resetAll();break;default:resetAll();}}
function reform(text){let x=String(text||'').trim();return x?(/[.!?]$/.test(x)?x:x+'.'):st.frase}
function closing(){st.step='final';ai('❤️ Has terminado esta experiencia, **'+st.name+'**.\n\nHoy no ignoraste tu carga.\n\nLa observaste, reconociste qué necesita y separaste aquello que te corresponde de lo que no puedes controlar.\n\nTu próximo paso será:\n\n**'+st.accion+'**\n\nY decides comenzar a soltar:\n\n**'+st.noControl+'**\n\nTu frase personal es:\n\n**“'+st.frase+'”**\n\nCuando vuelvas a sentir que debes sostener toda la situación al mismo tiempo, recuerda el objeto que depositaste.\n\nPuedes volver a tomarlo cuando necesites actuar. También puedes dejarlo frente a ti cuando el proceso necesite tiempo.',['📖 Volver al libro','💾 Guardar mi reflexión','🖼️ Descargar tarjeta visual PNG','🌿 Repetir la pausa'])}
function thanksNext(){st.step='thanks';ai('🙏 Gracias por completar la experiencia del **Capítulo 1: Entregar la carga**.\n\nHoy reconociste tu carga, la depositaste simbólicamente y separaste lo que sí depende de ti de aquello que no puedes controlar completamente.\n\nCuando regreses al libro, completa el cierre del capítulo con calma.\n\n📚 **Próximo capítulo:** Capítulo 2, **Las palabras que te construyen**. Ahí observarás cómo te hablas interiormente y cómo crear una frase puente más honesta y constructiva.',['🏠 Ir al inicio'])}
function record(){return 'MI CARGA Y MI RESPUESTA\n\nLa situación que estoy cargando:\n'+st.carga+'\n\nLo que esta situación necesita:\n'+st.necesita+'\n\nLo que sí depende de mí:\n'+st.accion+'\n\nLo que no puedo controlar completamente:\n'+st.noControl+'\n\nMi próximo paso:\n'+st.accion+'\n\nMi frase personal:\n'+st.frase}
function downloadText(){let blob=new Blob([record()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Mi_Carga_y_Mi_Respuesta_Capitulo_1.txt';a.click();URL.revokeObjectURL(url);ai('✅ Tu reflexión se descargó como archivo de texto. También puedes descargar la tarjeta visual PNG.',['🖼️ Descargar tarjeta visual PNG','📖 Volver al libro','🌿 Repetir la pausa'])}
function downloadPNG(){let c=document.createElement('canvas'),scale=2,w=1000,h=1200;c.width=w*scale;c.height=h*scale;let ctx=c.getContext('2d');ctx.scale(scale,scale);ctx.fillStyle='#fffaf3';round(ctx,0,0,w,h,34);ctx.fill();ctx.fillStyle='#f3eadf';round(ctx,36,36,w-72,h-72,28);ctx.fill();ctx.strokeStyle='#d7bd8a';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#2a2118';ctx.font='700 40px Segoe UI';ctx.fillText('Mi carga y mi respuesta',70,105);ctx.font='17px Segoe UI';ctx.fillStyle='#7f6d5a';ctx.fillText('Mi Yo Interior - Capitulo 1: Entregar la carga',70,138);let y=190;box(ctx,'La situación que estoy cargando',st.carga,70,y,w-140);y+=155;box(ctx,'Lo que esta situación necesita',st.necesita,70,y,w-140);y+=145;box(ctx,'Lo que sí depende de mí',st.accion,70,y,w-140,true);y+=155;box(ctx,'Lo que no puedo controlar completamente',st.noControl,70,y,w-140);y+=175;box(ctx,'Mi frase personal',st.frase,70,y,w-140,true);ctx.fillStyle='#7c5731';ctx.font='18px Segoe UI';wrap(ctx,'Entregar la carga no significa desentenderse. Significa actuar sobre lo que corresponde y dejar de sostener mentalmente aquello que no puede controlarse.',70,h-92,w-140,26);let a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='Mi_Carga_y_Mi_Respuesta_Capitulo_1.png';a.click();ai('✅ Tu tarjeta visual PNG se descargó correctamente.',['📖 Volver al libro','🌿 Repetir la pausa'])}
function box(ctx,title,text,x,y,w,featured){ctx.fillStyle=featured?'#ead7ae':'#fffaf3';round(ctx,x,y,w,118,20);ctx.fill();ctx.strokeStyle='#d7bd8a';ctx.stroke();ctx.fillStyle='#7c5731';ctx.font='700 19px Segoe UI';ctx.fillText(title,x+22,y+32);ctx.fillStyle='#2a2118';ctx.font=featured?'700 21px Segoe UI':'17px Segoe UI';wrap(ctx,String(text||'No especificado'),x+22,y+62,w-44,25)}
function wrap(ctx,text,x,y,max,line){let words=String(text).replace(/\n/g,' \n ').split(' '),l='';for(let wd of words){if(wd==='\n'){ctx.fillText(l,x,y);l='';y+=line;continue}let test=l+wd+' ';if(ctx.measureText(test).width>max&&l){ctx.fillText(l,x,y);l=wd+' ';y+=line}else l=test}if(l)ctx.fillText(l,x,y)}
function round(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function save(show){localStorage.setItem('miYoInteriorCap1V5GuionCorregido',JSON.stringify(st));if(show)modal('Progreso guardado','Tu avance quedó guardado en este dispositivo.',[['Aceptar',closeModal,'primary']])}
function load(){try{return JSON.parse(localStorage.getItem('miYoInteriorCap1V5GuionCorregido')||'null')}catch(e){return null}}
function resetAll(){let v=st.voice,a=st.ambient,d=st.dark,s=st.slow;st={step:'welcome',name:'',carga:'',necesita:'',accion:'',noControl:'',frase:'',history:[],voice:v,ambient:a,dark:d,slow:s};msgs.innerHTML='';opts([]);inputShow(false);start()}
function modal(t,b,acts){$('mt').textContent=t;$('mb').textContent=b;let ma=$('ma');ma.innerHTML='';acts.forEach(act=>{let bt=document.createElement('button');bt.textContent=act[0];bt.className=act[2]==='primary'?'primary':'secondary';bt.onclick=act[1];ma.appendChild(bt)});$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
let audioCtx=null;function ambient(){if(st.ambient){st.ambient=false;$('amb').textContent='🎵';if(audioCtx){audioCtx.close();audioCtx=null}return}st.ambient=true;$('amb').textContent='🎶';audioCtx=new (window.AudioContext||window.webkitAudioContext)();let osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.frequency.value=174;osc.type='sine';gain.gain.value=.018;osc.connect(gain);gain.connect(audioCtx.destination);osc.start()}
function voice(){st.voice=!st.voice;$('voice').textContent=st.voice?'🔊':'🔈';if(!st.voice&&'speechSynthesis'in window)speechSynthesis.cancel();save(false)}
function theme(){st.dark=!st.dark;document.body.style.filter=st.dark?'brightness(.82) contrast(1.05)':'none';save(false)}
function speed(){st.slow=!st.slow;$('speed').textContent=st.slow?'🐢':'🙂';save(false);modal('Velocidad de lectura',st.slow?'Modo pausado activado.':'Modo normal activado.',[['Aceptar',closeModal,'primary']])}
function start(){progress();add('Esta experiencia ofrece acompañamiento reflexivo y educativo. No reemplaza atención profesional.','sys');ai('🌿 **Bienvenido a Mi Yo Interior**\n\nHas llegado desde el capítulo **“Entregar la carga”**.\n\nHay pensamientos que necesitan una respuesta. Otros necesitan una acción. Y algunos permanecen porque intentamos controlar algo que no depende completamente de nosotros.\n\nEn esta breve experiencia descubrirás qué parte de tu carga necesita atención y qué parte puedes comenzar a soltar.',['✨ Comenzar','⏳ Volver más tarde'])}
$('send').onclick=()=>{let t=txt.value.trim();if(t){txt.value='';handle(t)}};txt.addEventListener('keydown',e=>{if(e.key==='Enter')$('send').click()});$('reset').onclick=resetAll;$('save').onclick=()=>save(true);$('clear').onclick=()=>{localStorage.removeItem('miYoInteriorCap1V5GuionCorregido');modal('Datos borrados','Se eliminó el progreso guardado en este dispositivo.',[['Aceptar',closeModal,'primary']])};$('amb').onclick=ambient;$('voice').onclick=voice;$('theme').onclick=theme;$('speed').onclick=speed;
window.onload=()=>{setTimeout(()=>{let s=load();if(s&&s.history&&s.history.length>2){modal('Encontré un progreso previo','Hay una experiencia guardada de este capítulo. Puedes continuar o iniciar nuevamente.',[['Iniciar de nuevo',()=>{closeModal();resetAll()},'secondary'],['Continuar',()=>{closeModal();st=s;msgs.innerHTML='';st.history.forEach(m=>add(m.text,m.who,m.extra||''));ai('Continuamos desde tu experiencia guardada. Puedes guardar tu reflexión, descargar tu tarjeta visual o repetir la pausa.',['💾 Guardar mi reflexión','🖼️ Descargar tarjeta visual PNG','🌿 Repetir la pausa'])},'primary']])}else start()},300)};
</script>
</body>
