<style>

*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;width:100%}body{font-family:'Segoe UI',Tahoma,Verdana,sans-serif;min-height:100dvh;background:linear-gradient(145deg,var(--bg1),var(--bg2) 52%,var(--bg3));display:flex;align-items:center;justify-content:center;color:var(--ink);overflow:hidden;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}.wrap{width:100%;max-width:min(96vw,980px);height:min(96dvh,940px);display:flex}.app{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;background:rgba(255,250,243,.985);border-radius:30px;box-shadow:var(--shadow);border:1px solid rgba(215,189,138,.38)}.head{padding:15px 18px 12px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);background:rgba(255,250,243,.92);flex-shrink:0}.avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:radial-gradient(circle at 35% 25%,#f7ffe9,#d7bd8a 50%,#2f6f73);box-shadow:0 0 18px rgba(215,189,138,.65)}.info{flex:1;min-width:0}.info h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info p{font-size:11.5px;color:var(--muted)}.tools{display:flex;gap:6px}.tool{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#eef4f2;cursor:pointer;font-size:14px}.barwrap{height:4px;background:#dcebd9;flex-shrink:0}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .3s ease}.msgs{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:clamp(12px,2vw,22px) clamp(14px,2.4vw,30px) clamp(90px,11vh,140px);display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}.m{max-width:min(98%,860px);padding:clamp(11px,1.8vw,16px) clamp(14px,2vw,20px);border-radius:18px;font-size:clamp(14px,1.7vw,17px);line-height:1.85;overflow-wrap:anywhere}.ai{background:var(--paper2);align-self:flex-start;border-bottom-left-radius:5px}.user{background:var(--gold);align-self:flex-end;border-bottom-right-radius:5px}.sys{background:#f4ffe8;border:1px solid var(--line);align-self:center;text-align:center;font-size:12.5px;color:#4d6349}.panel{background:#f7fff2;border:1px solid var(--line);align-self:stretch;max-width:100%}.typing{background:var(--paper2);color:#657274;align-self:flex-start;font-size:20px;letter-spacing:2px;min-width:58px;text-align:center}.opts{padding:8px 18px 10px;flex-shrink:0}.grid{display:none;flex-wrap:wrap;gap:7px;justify-content:center}.grid.show{display:flex}.opt{border:1.4px solid var(--line);border-radius:999px;padding:8px 13px;background:#eef4f2;color:#1f2b27;font-weight:650;cursor:pointer}.input{padding:0 18px 12px;flex-shrink:0}.row{display:none;gap:8px;background:#eef4f2;border-radius:25px;padding:4px;border:1px solid transparent}.row.show{display:flex}.row:focus-within{border-color:var(--gold)}input{flex:1;background:transparent;border:0;outline:0;padding:11px 12px;font-size:14px}.send{border:0;border-radius:21px;background:var(--gold);font-weight:750;padding:10px 16px;cursor:pointer}.safe{font-size:11.3px;color:#657274;text-align:center;padding:0 18px 9px;flex-shrink:0}.foot{padding:0 18px 12px;display:flex;gap:8px;justify-content:center;flex-shrink:0}.mini{border:0;background:transparent;color:#657274;font-size:12px;cursor:pointer}.modal{position:fixed;inset:0;background:rgba(0,0,0,.52);display:none;align-items:center;justify-content:center;z-index:9;padding:18px}.modal.show{display:flex}.card{background:var(--paper);border-radius:24px;padding:22px;width:min(540px,100%);box-shadow:var(--shadow)}.card h2{font-size:20px;margin-bottom:10px}.card p{font-size:14px;line-height:1.65;color:#34433d}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}.primary,.secondary{border:0;border-radius:14px;padding:10px 14px;cursor:pointer}.primary{background:var(--gold);font-weight:750}.secondary{background:#eef4f2}@media(max-width:540px){body{padding:0}.wrap{height:100dvh;max-width:100%}.app{border-radius:0}.head{padding:calc(12px + env(safe-area-inset-top)) 14px 10px}.msgs{padding:12px 14px calc(100px + env(safe-area-inset-bottom))}.m{font-size:14.6px}.tool{width:31px;height:31px}.opt{font-size:12px;padding:7px 11px}.foot{padding-bottom:calc(10px + env(safe-area-inset-bottom))}}

<body>
<div class="wrap"><main class="app"><header class="head"><div class="avatar">😊</div><div class="info"><h1>Mi Yo Interior</h1><p>Capítulo 10 · Convertir la intención en movimiento</p></div><div class="tools"><button class="tool" id="voice">🔈</button><button class="tool" id="amb">🎵</button><button class="tool" id="theme">🌙</button><button class="tool" id="speed">🐢</button></div></header><div class="barwrap"><div class="bar" id="bar"></div></div><section class="msgs" id="msgs"></section><section class="opts"><div class="grid" id="grid"></div></section><section class="input"><div class="row" id="row"><input id="txt"><button class="send" id="send">Enviar</button></div></section><p class="safe">Experiencia reflexiva y educativa. No reemplaza atención psicológica, médica, legal o financiera profesional.</p><footer class="foot"><button class="mini" id="reset">↺ Reiniciar</button><button class="mini" id="save">💾 Guardar</button><button class="mini" id="clear">🧹 Borrar</button></footer></main></div><div class="modal" id="modal"><div class="card"><h2 id="mt"></h2><p id="mb"></p><div class="actions" id="ma"></div></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id); const msgs=$('msgs'),grid=$('grid'),row=$('row'),txt=$('txt'),bar=$('bar');
let st={step:'welcome',name:'',intencion:'',importancia:'',obstaculo:'',necesidad:'',punto:'',primerPaso:'',versionPequena:'',diaHora:'',lugar:'',apoyo:'',respuestaImperfeccion:'',revision:'',frase:'',history:[],voice:false,ambient:false,dark:false,slow:true};
const STEPS=['welcome','name','intencion','importancia','obstaculo','necesidad','pausaIntro','pausa','punto','primerPaso','versionPequena','momento','apoyo','imperfeccion','revision','espejo','frase','fraseChange','fraseCustom','final'];
const CONFIRMAR=['Sí, quiero conservarla','Quiero cambiar una parte','Prefiero escribirla con mis palabras'];
const RISK=['suicidio','suicidarme','matarme','hacerme daño','no quiero vivir','autolesión','autolesion','emergencia','amenaza','peligro inmediato','presión grave','insegura','sobrepasado','sobrepasada','malestar intenso'];
function clean(t){return String(t||'').replace(/<strong[^>]*data-lexical-text="true"[^>]*>/g,'<strong>').replace(/<em[^>]*data-lexical-text="true"[^>]*>/g,'<em>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/\n/g,'<br>')}
function progress(){let i=STEPS.indexOf(st.step);bar.style.width=Math.max(0,Math.round((i/(STEPS.length-1))*100))+'%'}
function scrollEnd(){requestAnimationFrame(()=>setTimeout(()=>msgs.scrollTo({top:msgs.scrollHeight,behavior:'smooth'}),80))}
function add(text,who='ai',extra=''){let d=document.createElement('div');d.className='m '+who+(extra?' '+extra:'');d.innerHTML=clean(text);msgs.appendChild(d);if(who!=='typing')st.history.push({who,text,extra});scrollEnd();return d}
function typing(){let d=document.createElement('div');d.className='m typing';d.textContent='...';msgs.appendChild(d);scrollEnd();return d}
function opts(arr=[]){grid.innerHTML='';if(!arr.length){grid.classList.remove('show');return}grid.classList.add('show');arr.forEach(o=>{let b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>handle(o);grid.appendChild(b)})}
function inputShow(show,ph='Escribe aquí...'){row.classList.toggle('show',!!show);txt.placeholder=ph;if(show)setTimeout(()=>txt.focus(),60)}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function readPause(text){let w=String(text||'').split(/\s+/).filter(Boolean).length;return st.slow?Math.min(10000,Math.max(2200,w*170)):Math.min(5000,Math.max(900,w*80))}
function splitText(text){return String(text||'').split(/\n\n+/).map(x=>x.trim()).filter(Boolean)}
function emptyBubble(extra=''){let d=document.createElement('div');d.className='m ai'+(extra?' '+extra:'');msgs.appendChild(d);scrollEnd();return d}
async function typeInto(el,text){let out='';for(let i=0;i<text.length;i++){let ch=text.charAt(i);out+=ch;el.innerHTML=clean(out);if(i%3===0)scrollEnd();let ms=st.slow?(ch==='.'?340:(ch==='?'?460:(ch==='!'?420:(ch===','?150:(ch===';'?170:(ch===':'?170:28)))))):(ch==='.'?180:(ch==='?'?260:(ch==='!'?240:(ch===','?85:12))));await wait(ms)}el.innerHTML=clean(text);scrollEnd()}
async function ai(text,buttons=[],input=false,ph='Escribe aquí...',extra=''){opts([]);inputShow(false);progress();let parts=splitText(text);for(let part of parts){let t=typing();await wait(st.slow?900:450);t.remove();let b=emptyBubble(extra);await typeInto(b,part);st.history.push({who:'ai',text:part,extra});speak(part);await wait(readPause(part))}opts(buttons);inputShow(input,ph);save(false)}
function speak(text){if(!st.voice||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text.replace(/[\*#•]/g,''));u.lang='es-CL';u.rate=.86;speechSynthesis.speak(u)}
function risk(text){let x=String(text).toLowerCase();if(RISK.some(r=>x.includes(r))){st.step='risk';ai('Lo que describes puede requerir apoyo humano confiable antes de convertirlo en un compromiso. Esta experiencia no debe transformarse en una exigencia si hay presión, malestar intenso o una situación insegura. Detén el ejercicio y busca apoyo de una persona confiable o de un profesional adecuado.',['🌿 Volver al inicio']);return true}return false}
function handle(text){if(text.includes('Volver al inicio')||text.includes('Reiniciar'))return resetAll();add(text,'user');if(risk(text))return;process(String(text).trim())}
function construirFrase(){return 'Quiero avanzar hacia '+st.intencion+' porque '+st.importancia+'. Mi primer paso será '+(st.versionPequena||st.primerPaso)+' y lo realizaré '+st.diaHora+'. Cuando aparezca '+st.obstaculo+', recordaré que no necesito resolverlo todo hoy: solo comenzar de una manera posible.'}
function process(text){switch(st.step){
case 'welcome':st.step='name';ai('😊 Hola. Soy **Mi Yo Interior**, el acompañante digital de este libro.\n\nNo elegiré una meta por ti ni mediré tu avance. Te ayudaré a transformar una intención importante en un primer paso concreto, posible y revisable.\n\n¿Cómo te gustaría que te llame?',[],true,'Escribe tu nombre o un apodo.');break;
case 'name':st.name=text;st.step='intencion';ai('Gracias, **'+st.name+'**.\n\nNo necesitas transformar toda tu vida al mismo tiempo. Elegiremos una sola intención para comenzar.\n\n🌱 En este momento, ¿en qué quieres avanzar?',[],true,'En este momento quiero avanzar en...');break;
case 'intencion':st.intencion=text;st.step='importancia';ai('Has elegido avanzar en **'+st.intencion+'**.\n\nAhora observaremos por qué importa, para que el paso no nazca solo de la presión o la expectativa externa.\n\n💛 ¿Por qué esto es importante para ti?',[],true,'Esto es importante para mí porque...');break;
case 'importancia':st.importancia=text;st.step='obstaculo';ai('Reconociste que esto importa porque **'+st.importancia+'**.\n\nNombrar el sentido ayuda a distinguir una intención propia de una obligación impuesta.\n\n🧱 ¿Qué es lo que más te detiene ahora?',[],true,'Lo que más me detiene es...');break;
case 'obstaculo':st.obstaculo=text;st.step='necesidad';ai('Has identificado que te detiene **'+st.obstaculo+'**.\n\nNombrar un obstáculo no lo hace más grande. Lo vuelve visible, y lo visible puede comenzar a trabajarse.\n\n🔍 ¿Qué necesitarías para avanzar un poco?',[],true,'Lo que necesitaría para avanzar un poco es...');break;
case 'necesidad':st.necesidad=text;st.step='pausaIntro';ai('Has reconocido que necesitas **'+st.necesidad+'**.\n\nAntes de definir el paso, llevaremos la intención al cuerpo con una pausa breve.',['🌿 Hacer la pausa del primer paso']);break;
case 'pausaIntro':st.step='pausa';ai('🌿 En este capítulo no cerrarás los ojos. Mira hacia adelante y busca un punto concreto del lugar donde estás: una puerta, una ventana, una esquina o un objeto.\n\nEse punto representará tu próximo paso.\n\nAhora apoya firmemente los pies en el suelo. Inhala con calma. Exhala lentamente.\n\nMientras observas ese punto, repite:\n\n**“No necesito resolverlo todo hoy.”**\n\nDa un pequeño paso físico hacia adelante, o inclina suavemente tu cuerpo hacia ese punto. Luego di:\n\n**“Solo necesito comenzar de una manera posible.”**\n\nEsta pausa no busca detenerte. Busca recordarle a tu cuerpo que ya puedes moverte.',['✅ Ya hice la pausa']);break;
case 'pausa':st.step='punto';ai('📍 ¿Qué punto concreto elegiste para representar tu próximo paso?',[],true,'El punto que elegí fue...');break;
case 'punto':st.punto=text;st.step='primerPaso';ai('Elegiste **'+st.punto+'** como punto de referencia.\n\nNo es un amuleto ni una garantía: es un recordatorio práctico de que puedes volver al movimiento.\n\n🚶 ¿Qué acción pequeña puedes realizar para comenzar?',[],true,'Mi primer paso será...');break;
case 'primerPaso':st.primerPaso=text;st.step='versionPequena';ai('Tu primer paso será **'+st.primerPaso+'**.\n\nSi todavía parece grande, lo reduciremos hasta que siga representando avance, pero sea más fácil de cumplir.\n\n🔎 ¿Cuál es la versión más pequeña de esta acción que todavía representa un avance?',[],true,'La versión más pequeña sería...');break;
case 'versionPequena':st.versionPequena=text;st.step='momento';ai('Esa versión pequeña es **'+st.versionPequena+'**.\n\nUn paso pequeño no es insignificante cuando cambia tu dirección.\n\n🕰️ ¿Cuándo lo harás? Escribe día, hora aproximada y lugar.',[],true,'Lo haré el día... a las... en...');break;
case 'momento':st.diaHora=text;st.step='apoyo';ai('Has definido un momento concreto: **'+st.diaHora+'**.\n\nEvitar “después” o “cuando pueda” ayuda a que la intención comience a tomar forma.\n\n🧩 ¿Qué apoyo facilitará que lo cumplas?',[],true,'El apoyo que utilizaré será...');break;
case 'apoyo':st.apoyo=text;st.step='imperfeccion';ai('El apoyo que utilizarás será **'+st.apoyo+'**.\n\nAhora prepararemos una respuesta para cuando el comienzo no sea perfecto.\n\n🛠️ Si algo no resulta como esperas, ¿qué podrías hacer en lugar de abandonarlo?',[],true,'Si algo no resulta como espero, puedo...');break;
case 'imperfeccion':st.respuestaImperfeccion=text;st.step='revision';ai('Esa respuesta te permite corregir sin abandonar: **'+st.respuestaImperfeccion+'**.\n\nAvanzar no exige ausencia de miedo. Exige que el miedo no sea la única voz que decide.\n\n🔁 ¿Cuándo revisarás tu avance y qué revisarás sin castigarte?',[],true,'Revisaré mi avance... y observaré...');break;
case 'revision':st.revision=text;st.step='espejo';ai('Has definido tu revisión: **'+st.revision+'**.\n\nRevisar no es castigarte. Es aprender de lo que ocurrió y elegir el siguiente paso con más información.',['🪞 Continuar a devolución espejo']);break;
case 'espejo':st.step='frase';ai('🪞 Quiero devolverte lo que tú mismo reconociste, **'+st.name+'**.\n\nQuieres avanzar en **'+st.intencion+'** porque **'+st.importancia+'**. También reconociste que te detiene **'+st.obstaculo+'** y que necesitas **'+st.necesidad+'** para avanzar un poco.\n\nElegiste comenzar mediante **'+(st.versionPequena||st.primerPaso)+'**, hacerlo **'+st.diaHora+'** y apoyarte en **'+st.apoyo+'**.\n\nLa intención no quedó solo en pensamiento. Comenzó a convertirse en movimiento cuando definiste un paso pequeño, un momento concreto y una forma de revisar sin castigarte.',['❤️ Crear mi frase personal']);break;
case 'frase':st.frase=construirFrase();st.step='confirmar';ai('❤️ Con tus propias respuestas, tu frase podría ser:\n\n**“'+st.frase+'”**\n\n¿Esta frase representa lo que descubriste?',CONFIRMAR,false,'','panel');break;
case 'confirmar':if(text.includes('conservar'))closing();else if(text.includes('cambiar')){st.step='fraseChange';ai('📝 ¿Qué parte quieres cambiar?',[],true,'Quiero cambiar...')}else{st.step='fraseCustom';ai('📝 Escribe tu frase con tus palabras. Puedo mejorar claridad y brevedad, pero no debo convertirla en una promesa de éxito ni aumentar la meta que tú definiste.',[],true,'Mi frase personal es...')}break;
case 'fraseChange':st.frase=reform(text);closing();break;
case 'fraseCustom':st.frase=reform(text);closing();break;
case 'final':if(text.includes('Guardar'))downloadText();else if(text.includes('tarjeta'))downloadPNG();else if(text.includes('Volver al libro'))thanksNext();else if(text.includes('pausa')){st.step='pausaIntro';process('x')}else ai('Puedes elegir una de las opciones finales.',['📖 Volver al libro','💾 Guardar mi compromiso','🖼️ Descargar tarjeta visual PNG','🌿 Repetir la pausa']);break;
case 'thanks':resetAll();break;default:resetAll();}}
function reform(text){let x=String(text||'').trim();return x?(/[.!?]$/.test(x)?x:x+'.'):st.frase}
function closing(){st.step='final';ai('🙏 Has terminado esta experiencia, **'+st.name+'**.\n\nHoy elegiste una intención: **'+st.intencion+'**. Reconociste por qué importa, qué te detiene y qué necesitas para avanzar un poco.\n\nTu primer movimiento será **'+(st.versionPequena||st.primerPaso)+'** y lo realizarás **'+st.diaHora+'**.\n\nSi aparece una dificultad, recordarás que puedes **'+st.respuestaImperfeccion+'**. Después revisarás: **'+st.revision+'**.\n\nTu frase personal es:\n\n**“'+st.frase+'”**\n\nNo necesitas saber todo el camino. Solo necesitas permitir que lo descubierto comience a vivir en una decisión pequeña y real.\n\n🌟 **Has completado el ciclo completo de 10 capítulos.**\n\nLa conversación contigo puede continuar cada vez que vuelvas a escucharte. El libro termina aquí, pero el recorrido continúa en ti.',['📖 Volver al libro','💾 Guardar mi compromiso','🖼️ Descargar tarjeta visual PNG','🌿 Repetir la pausa'])}
function thanksNext(){st.step='thanks';ai('🙏 Gracias por completar la experiencia del **Capítulo 10: Convertir la intención en movimiento**.\n\nHoy transformaste una intención en un primer paso posible, con un momento concreto, apoyo y una forma de revisar sin castigarte.\n\n🌟 **Has completado el ciclo completo de 10 capítulos.**\n\nLa conversación contigo puede continuar cada vez que vuelvas a escucharte.\n\n📚 El libro termina aquí, pero el recorrido continúa en ti.',['🏠 Ir al inicio'])}
function record(){return 'MI COMPROMISO DE MOVIMIENTO\n\nQuiero avanzar hacia:\n'+st.intencion+'\n\nEsto importa para mí porque:\n'+st.importancia+'\n\nLo que más me detiene es:\n'+st.obstaculo+'\n\nLo que necesito para avanzar un poco es:\n'+st.necesidad+'\n\nEl punto que elegí para representar mi próximo paso:\n'+st.punto+'\n\nMi primer paso será:\n'+st.primerPaso+'\n\nLa versión más pequeña de mi acción será:\n'+st.versionPequena+'\n\nLo realizaré:\n'+st.diaHora+'\n\nEl apoyo que utilizaré será:\n'+st.apoyo+'\n\nSi algo no resulta como espero, puedo:\n'+st.respuestaImperfeccion+'\n\nDespués de intentarlo, revisaré:\n'+st.revision+'\n\nMi frase personal:\n'+st.frase}
function downloadText(){let blob=new Blob([record()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Mi_Compromiso_De_Movimiento_Capitulo_10.txt';a.click();URL.revokeObjectURL(url);ai('✅ Tu compromiso se descargó como archivo de texto. También puedes descargar la tarjeta visual PNG.',['🖼️ Descargar tarjeta visual PNG','📖 Volver al libro','🌿 Repetir la pausa'])}

// ---- NUEVA FUNCIÓN downloadPNG CON ALTURA DINÁMICA ----
function downloadPNG(){
    var c=document.createElement('canvas');
    var scale=2;
    var w=1000;

    function countLines(text,maxWidth,fontSize){
        var ctx=document.createElement('canvas').getContext('2d');
        ctx.font=fontSize+'px Segoe UI';
        var words=String(text).replace(/\n/g,' \n ').split(' ');
        var lines=0,current='';
        for(var i=0;i<words.length;i++){
            var wd=words[i];
            if(wd==='\n'){lines++;current='';continue;}
            var test=current+wd+' ';
            if(ctx.measureText(test).width>maxWidth&&current){lines++;current=wd+' ';}
            else current=test;
        }
        if(current)lines++;
        return Math.max(lines,1);
    }

    var lineHeight=25;
    var maxWidth=w-140-44;
    var fields=[
        {title:'Quiero avanzar hacia',text:st.intencion,featured:true},
        {title:'Esto importa para mí porque',text:st.importancia},
        {title:'Lo que más me detiene',text:st.obstaculo},
        {title:'Mi primer paso posible',text:st.versionPequena||st.primerPaso,featured:true},
        {title:'Cuándo y dónde lo realizaré',text:st.diaHora},
        {title:'El apoyo que utilizaré',text:st.apoyo},
        {title:'Cómo revisaré sin castigarme',text:st.revision},
        {title:'Mi frase personal',text:st.frase,featured:true}
    ];

    var h=190;
    fields.forEach(function(f){
        var isFeatured=f.featured||false;
        var fontSize=isFeatured?21:17;
        var lines=countLines(f.text,maxWidth,fontSize);
        h+=32+30+(lines*lineHeight)+10+12;
    });
    h+=120;
    h=Math.max(1320,h);

    c.width=w*scale;
    c.height=h*scale;
    var ctx=c.getContext('2d');
    ctx.scale(scale,scale);

    ctx.fillStyle='#fffaf3';
    round(ctx,0,0,w,h,34);
    ctx.fill();

    ctx.fillStyle='#eef4f2';
    round(ctx,36,36,w-72,h-72,28);
    ctx.fill();
    ctx.strokeStyle='#c9dfc7';
    ctx.lineWidth=2;
    ctx.stroke();

    ctx.fillStyle='#1f2b27';
    ctx.font='700 38px Segoe UI';
    ctx.fillText('Mi compromiso de movimiento',70,105);
    ctx.font='17px Segoe UI';
    ctx.fillStyle='#657274';
    ctx.fillText('Mi Yo Interior - Capítulo 10: Convertir la intención en movimiento',70,138);

    var y=190;
    var x=70;
    var fieldWidth=w-140;

    fields.forEach(function(f){
        var isFeatured=f.featured||false;
        var fontSize=isFeatured?21:17;
        var lines=countLines(f.text,maxWidth,fontSize);
        var boxHeight=32+30+(lines*lineHeight)+10;

        ctx.fillStyle=isFeatured?'#dcebd9':'#fffaf3';
        round(ctx,x,y,fieldWidth,boxHeight,20);
        ctx.fill();
        ctx.strokeStyle='#c9dfc7';
        ctx.lineWidth=1.5;
        ctx.stroke();

        ctx.fillStyle='#335c52';
        ctx.font='700 19px Segoe UI';
        ctx.fillText(f.title,x+22,y+32);

        ctx.fillStyle='#1f2b27';
        ctx.font=(isFeatured?'700 ':'')+fontSize+'px Segoe UI';
        wrap(ctx,String(f.text||'No especificado'),x+22,y+62,maxWidth,lineHeight);

        y+=boxHeight+12;
    });

    ctx.fillStyle='#335c52';
    ctx.font='18px Segoe UI';
    wrap(ctx,'No necesitas conocer todo el camino. Necesitas reconocer el siguiente paso y permitir que lo descubierto comience a vivir en tus decisiones.',70,h-82,w-140,26);

    var a=document.createElement('a');
    a.href=c.toDataURL('image/png');
    a.download='Mi_Compromiso_De_Movimiento_Capitulo_10.png';
    a.click();
    ai('✅ Tu tarjeta visual PNG se descargó correctamente.',['📖 Volver al libro','🌿 Repetir la pausa']);
}

// ---- FUNCIÓN wrap (se mantiene igual) ----
function wrap(ctx,text,x,y,max,line){
    var words=String(text).replace(/\n/g,' \n ').split(' ');
    var current='';
    for(var i=0;i<words.length;i++){
        var wd=words[i];
        if(wd==='\n'){ctx.fillText(current,x,y);current='';y+=line;continue;}
        var test=current+wd+' ';
        if(ctx.measureText(test).width>max&&current){ctx.fillText(current,x,y);current=wd+' ';y+=line;}
        else current=test;
    }
    if(current)ctx.fillText(current,x,y);
}

function round(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

$('send').onclick=()=>{let t=txt.value.trim();if(t){txt.value='';handle(t)}};txt.addEventListener('keydown',e=>{if(e.key==='Enter')$('send').click()});$('reset').onclick=resetAll;$('save').onclick=()=>save(true);$('clear').onclick=()=>{localStorage.removeItem('miYoInteriorCap10V6ConvertirIntencionEnMovimiento');modal('Datos borrados','Se eliminó el progreso guardado en este dispositivo.',[['Aceptar',closeModal,'primary']])};$('amb').onclick=ambient;$('voice').onclick=voice;$('theme').onclick=theme;$('speed').onclick=speed;
window.onload=()=>{setTimeout(()=>{let s=load();if(s&&s.history&&s.history.length>2){modal('Encontré un progreso previo','Hay una experiencia guardada de este capítulo. Puedes continuar o iniciar nuevamente.',[['Iniciar de nuevo',()=>{closeModal();resetAll()},'secondary'],['Continuar',()=>{closeModal();st=s;msgs.innerHTML='';st.history.forEach(m=>add(m.text,m.who,m.extra||''));ai('Continuamos desde tu experiencia guardada. Puedes guardar tu compromiso, descargar tu tarjeta visual o repetir la pausa.',['💾 Guardar mi compromiso','🖼️ Descargar tarjeta visual PNG','🌿 Repetir la pausa'])},'primary']])}else start()},300)};
