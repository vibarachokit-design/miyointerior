<style>
:root{--bg1:#101820;--bg2:#26343b;--bg3:#314238;--paper:#fffaf3;--paper2:#eef4ed;--ink:#1f2b27;--muted:#6f8179;--gold:#c9dfc7;--gold2:#7fa287;--line:#d6e3d1;--shadow:0 40px 90px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;width:100%}body{font-family:'Segoe UI',Tahoma,Verdana,sans-serif;min-height:100dvh;background:linear-gradient(145deg,var(--bg1),var(--bg2) 52%,var(--bg3));display:flex;align-items:center;justify-content:center;color:var(--ink);overflow:hidden;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}.wrap{width:100%;max-width:min(96vw,980px);height:min(96dvh,940px);display:flex}.app{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;background:rgba(255,250,243,.985);border-radius:30px;box-shadow:var(--shadow);border:1px solid rgba(201,223,199,.38)}.head{padding:15px 18px 12px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);background:rgba(255,250,243,.92);flex-shrink:0}.avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:radial-gradient(circle at 35% 25%,#f7ffe9,#c9dfc7 50%,#4f7b67);box-shadow:0 0 18px rgba(201,223,199,.65)}.info{flex:1;min-width:0}.info h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info p{font-size:11.5px;color:var(--muted)}.tools{display:flex;gap:6px}.tool{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#eef4ed;cursor:pointer;font-size:14px}.barwrap{height:4px;background:#dcebd9;flex-shrink:0}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .3s ease}.msgs{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:clamp(12px,2vw,22px) clamp(14px,2.4vw,30px) clamp(90px,11vh,140px);display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}.m{max-width:min(98%,860px);padding:clamp(11px,1.8vw,16px) clamp(14px,2vw,20px);border-radius:18px;font-size:clamp(14px,1.7vw,17px);line-height:1.85;overflow-wrap:anywhere}.ai{background:var(--paper2);align-self:flex-start;border-bottom-left-radius:5px}.user{background:var(--gold);align-self:flex-end;border-bottom-right-radius:5px}.sys{background:#f4ffe8;border:1px solid var(--line);align-self:center;text-align:center;font-size:12.5px;color:#4d6349}.panel{background:#f7fff2;border:1px solid var(--line);align-self:stretch;max-width:100%}.typing{background:var(--paper2);color:#6f8179;align-self:flex-start;font-size:20px;letter-spacing:2px;min-width:58px;text-align:center}.opts{padding:8px 18px 10px;flex-shrink:0}.grid{display:none;flex-wrap:wrap;gap:7px;justify-content:center}.grid.show{display:flex}.opt{border:1.4px solid var(--line);border-radius:999px;padding:8px 13px;background:#eef4ed;color:#1f2b27;font-weight:650;cursor:pointer}.input{padding:0 18px 12px;flex-shrink:0}.row{display:none;gap:8px;background:#eef4ed;border-radius:25px;padding:4px;border:1px solid transparent}.row.show{display:flex}.row:focus-within{border-color:var(--gold)}input{flex:1;background:transparent;border:0;outline:0;padding:11px 12px;font-size:14px}.send{border:0;border-radius:21px;background:var(--gold);font-weight:750;padding:10px 16px;cursor:pointer}.safe{font-size:11.3px;color:#6f8179;text-align:center;padding:0 18px 9px;flex-shrink:0}.foot{padding:0 18px 12px;display:flex;gap:8px;justify-content:center;flex-shrink:0}.mini{border:0;background:transparent;color:#6f8179;font-size:12px;cursor:pointer}.modal{position:fixed;inset:0;background:rgba(0,0,0,.52);display:none;align-items:center;justify-content:center;z-index:9;padding:18px}.modal.show{display:flex}.card{background:var(--paper);border-radius:24px;padding:22px;width:min(540px,100%);box-shadow:var(--shadow)}.card h2{font-size:20px;margin-bottom:10px}.card p{font-size:14px;line-height:1.65;color:#34433d}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}.primary,.secondary{border:0;border-radius:14px;padding:10px 14px;cursor:pointer}.primary{background:var(--gold);font-weight:750}.secondary{background:#eef4ed}@media(max-width:540px){body{padding:0}.wrap{height:100dvh;max-width:100%}.app{border-radius:0}.head{padding:calc(12px + env(safe-area-inset-top)) 14px 10px}.msgs{padding:12px 14px calc(100px + env(safe-area-inset-bottom))}.m{font-size:14.6px}.tool{width:31px;height:31px}.opt{font-size:12px;padding:7px 11px}.foot{padding-bottom:calc(10px + env(safe-area-inset-bottom))}}
</style>

<body>
<div class="wrap"><main class="app"><header class="head"><div class="avatar">😊</div><div class="info"><h1>Mi Yo Interior</h1><p>Capítulo 6 · Soltar la necesidad de controlar</p></div><div class="tools"><button class="tool" id="voice">🔈</button><button class="tool" id="amb">🎵</button><button class="tool" id="theme">🌙</button><button class="tool" id="speed">🐢</button></div></header><div class="barwrap"><div class="bar" id="bar"></div></div><section class="msgs" id="msgs"></section><section class="opts"><div class="grid" id="grid"></div></section><section class="input"><div class="row" id="row"><input id="txt"><button class="send" id="send">Enviar</button></div></section><p class="safe">Experiencia reflexiva y educativa. No reemplaza atención psicológica, médica, legal o financiera profesional.</p><footer class="foot"><button class="mini" id="reset">↺ Reiniciar</button><button class="mini" id="save">💾 Guardar</button><button class="mini" id="clear">🧹 Borrar</button></footer></main></div><div class="modal" id="modal"><div class="card"><h2 id="mt"></h2><p id="mb"></p><div class="actions" id="ma"></div></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id); const msgs=$('msgs'),grid=$('grid'),row=$('row'),txt=$('txt'),bar=$('bar');
let st={step:'welcome',name:'',situacion:'',necesidad:'',accion:'',externo:'',soltar:'',momento:'',frase:'',history:[],voice:false,ambient:false,dark:false,slow:true};
const STEPS=['welcome','name','situacion','necesidad','pausaIntro','pausa','accion','externo','soltar','soltarCustom','momento','espejo','frase','fraseChange','fraseCustom','final'];
const SOLTAR=['Dejar de comprobarlo a cada momento','Dejar de imaginar todos los desenlaces','No repetir una conversación que ya tuve','No asumir lo que otra persona piensa','Esperar hasta un momento definido antes de revisarlo','Escribir otra forma concreta'];
const CONFIRMAR=['Sí, quiero conservarla','Quiero cambiar una parte','Prefiero escribirla con mis palabras'];
const RISK=['suicidio','suicidarme','matarme','hacerme daño','no quiero vivir','autolesión','autolesion','abuso','violencia','emergencia','amenaza','peligro inmediato','presión grave','insegura','amenazado'];
function clean(t){return String(t||'').replace(/<strong[^>]*data-lexical-text="true"[^>]*>/g,'<strong>').replace(/<em[^>]*data-lexical-text="true"[^>]*>/g,'<em>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/\n/g,'<br>')}
function progress(){let i=STEPS.indexOf(st.step);bar.style.width=Math.max(0,Math.round((i/(STEPS.length-1))*100))+'%'}
function scrollEnd(){requestAnimationFrame(()=>setTimeout(()=>msgs.scrollTo({top:msgs.scrollHeight,behavior:'smooth'}),80))}
function add(text,who='ai',extra=''){let d=document.createElement('div');d.className='m '+who+(extra?' '+extra:'');d.innerHTML=clean(text);msgs.appendChild(d);if(who!=='typing')st.history.push({who,text,extra});scrollEnd();return d}
function typing(){let d=document.createElement('div');d.className='m typing';d.textContent='...';msgs.appendChild(d);scrollEnd();return d}
function opts(arr=[]){grid.innerHTML='';if(!arr.length){grid.classList.remove('show');return}grid.classList.add('show');arr.forEach(o=>{let b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>handle(o);grid.appendChild(b)})}
function inputShow(show,ph='Escribe aquí...'){row.classList.toggle('show',!!show);txt.placeholder=ph;if(show)setTimeout(()=>txt.focus(),60)}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function readPause(text){let w=String(text||'').split(/\s+/).filter(Boolean).length;return st.slow?Math.min(10000,Math.max(2200,w*170)):Math.min(5000,Math.max(900,w*80))}
function splitText(text){return String(text||'').split(/\n\n+/).map(x=>x.trim()).filter(Boolean)}
function emptyBubble(extra=''){let d=document.createElement('div');d.className='m ai'+(extra?' '+extra:'');msgs.appendChild(d);scrollEnd();return d}
async function typeInto(el,text){let out='';for(let i=0;i<text.length;i++){let ch=text.charAt(i);out+=ch;el.innerHTML=clean(out);if(i%3===0)scrollEnd();let ms=st.slow?(ch==='.'?340:(ch==='?'?460:(ch==='!'?420:(ch===','?150:(ch===';'?170:(ch===':'?170:28)))))):(ch==='.'?180:(ch==='?'?260:(ch==='!'?240:(ch===','?85:12))));await wait(ms)}el.innerHTML=clean(text);scrollEnd()}
async function ai(text,buttons=[],input=false,ph='Escribe aquí...',extra=''){opts([]);inputShow(false);progress();let parts=splitText(text);for(let part of parts){let t=typing();await wait(st.slow?900:450);t.remove();let b=emptyBubble(extra);await typeInto(b,part);st.history.push({who:'ai',text:part,extra});speak(part);await wait(readPause(part))}opts(buttons);inputShow(input,ph);save(false)}
function speak(text){if(!st.voice||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text.replace(/[\*#•]/g,''));u.lang='es-CL';u.rate=.86;speechSynthesis.speak(u)}
function risk(text){let x=String(text).toLowerCase();if(RISK.some(r=>x.includes(r))){st.step='risk';ai('Lo que describes puede requerir apoyo humano adecuado. Esta experiencia no debe impulsarte a permanecer en una situación insegura ni a abandonar una obligación importante. Si existe urgencia, inseguridad o presión grave, detén el ejercicio y busca apoyo de una persona adulta de confianza o de un profesional adecuado.',['🌿 Volver al inicio']);return true}return false}
function handle(text){if(text.includes('Volver al inicio')||text.includes('Reiniciar'))return resetAll();add(text,'user');if(risk(text))return;process(String(text).trim())}
function construirFrase(){return 'Puedo '+st.accion+' y volver a revisar '+st.momento+', sin intentar dirigir '+st.externo+' ni seguir '+st.soltar+'.'}
function process(text){switch(st.step){
case 'welcome':st.step='name';ai('😊 Hola. Soy **Mi Yo Interior**, el acompañante digital de este libro.\n\nNo te pediré que ignores lo que importa. Te ayudaré a reconocer qué parte puedes atender y qué parte necesita dejar de ser vigilada a cada momento.\n\n¿Cómo te gustaría que te llame?',[],true,'Escribe tu nombre o un apodo.');break;
case 'name':st.name=text;st.step='situacion';ai('Gracias, **'+st.name+'**.\n\nComparte solo lo necesario para observar la situación con claridad.\n\n👐 ¿Qué situación o resultado estás intentando mantener bajo control?',[],true,'Estoy intentando controlar...');break;
case 'situacion':st.situacion=text;st.step='necesidad';ai('Has reconocido que estás intentando controlar **'+st.situacion+'**.\n\nNo vamos a juzgar ese impulso; primero observaremos qué buscas proteger.\n\n🔍 Si pudieras controlar completamente esa situación, ¿qué quisieras evitar o asegurar?',[],true,'Quisiera evitar/asegurar...');break;
case 'necesidad':st.necesidad=text;st.step='pausaIntro';ai('Detrás del control aparece algo importante para ti: **'+st.necesidad+'**.\n\nComprenderlo no vuelve posible dirigir todo el resultado, pero sí muestra qué estás intentando cuidar.',['🌿 Abrir las manos']);break;
case 'pausaIntro':st.step='pausa';ai('🌿 Coloca las manos frente a ti y ciérralas suavemente, sin apretar. Imagina que sostienen todas las respuestas, tiempos y resultados que intentas dirigir.\n\nObserva durante unos segundos el gesto de sostener.\n\nLuego abre las manos lentamente, con las palmas hacia arriba.\n\nNo estás dejando caer tu responsabilidad. Estás haciendo espacio para distinguirla de lo que no te pertenece controlar.\n\nRepite mentalmente:\n\n**“Puedo cuidar mi parte sin sujetar todo el resultado.”**\n\nLas manos abiertas no representan rendirse. Representan dejar de confundir atención con control.',['✅ He abierto las manos']);break;
case 'pausa':st.step='accion';ai('📝 ¿Qué acción, conversación o límite depende directamente de ti en esta situación?',[],true,'Lo que sí me corresponde es...');break;
case 'accion':st.accion=text;if(text.toLowerCase().includes('no sé')||text.toLowerCase().includes('no se')){ai('No necesitas resolverlo completo ahora.\n\n¿Qué acción pequeña te permitiría obtener información, comunicarte con claridad o evitar que la situación empeore?',[],true,'Una acción pequeña sería...');st.step='accion';}else{st.step='externo';ai('Tú mismo identificaste una responsabilidad concreta: **'+st.accion+'**.\n\nEsa es la parte que puedes sostener con tus decisiones, sin asumir el control de todo lo demás.\n\n🌤️ Aunque hagas tu parte, ¿qué resultado, reacción o momento seguirá sin depender completamente de ti?',[],true,'No puedo dirigir completamente...')}break;
case 'externo':st.externo=text;st.step='soltar';ai('Has distinguido que puedes **'+st.accion+'**, pero no puedes dirigir completamente **'+st.externo+'**.\n\nNombrarlo no reduce tu compromiso; delimita con honestidad hasta dónde llega.\n\n👐 ¿Qué dejarás de hacer para no seguir intentando controlar esa parte?',SOLTAR);break;
case 'soltar':if(text.includes('Escribir')){st.step='soltarCustom';ai('✍️ Escribe una forma concreta de soltar que no signifique abandonar una obligación ni ignorar información importante.',[],true,'Comenzaré a soltar cuando deje de...')}else{st.soltar=text;st.step='momento';ai('Tu manera concreta de soltar será **'+st.soltar+'**.\n\nRevisaremos que esto no signifique abandonar una obligación, ignorar información importante ni permanecer en una situación insegura.\n\n⏳ ¿Cuándo realizarás tu parte o volverás a revisar la situación?',[],true,'Lo haré o lo revisaré...')}break;
case 'soltarCustom':st.soltar=text;st.step='momento';ai('Tu manera concreta de soltar será **'+st.soltar+'**.\n\nRevisaremos que esto no signifique abandonar una obligación, ignorar información importante ni permanecer en una situación insegura.\n\n⏳ ¿Cuándo realizarás tu parte o volverás a revisar la situación?',[],true,'Lo haré o lo revisaré...');break;
case 'momento':st.momento=text;st.step='espejo';ai('Has elegido **'+st.momento+'**.\n\nTener un momento definido permite dejar la situación en pausa sin vigilarla continuamente.',['🪞 Continuar a devolución espejo']);break;
case 'espejo':st.step='frase';ai('🪞 Quiero devolverte lo que tú mismo reconociste, **'+st.name+'**.\n\nIntentabas controlar **'+st.situacion+'** porque querías evitar o asegurar **'+st.necesidad+'**.\n\nAl abrir las manos, distinguiste que tu parte es **'+st.accion+'**, mientras que **'+st.externo+'** no depende completamente de ti.\n\nTambién elegiste dejar de **'+st.soltar+'** y volver a atender la situación **'+st.momento+'**.\n\nTu respuesta no apareció fuera de ti: surgió cuando separaste cuidado, responsabilidad y control.',['❤️ Crear mi frase personal']);break;
case 'frase':st.frase=construirFrase();st.step='confirmar';ai('❤️ Con tus propias respuestas, tu frase podría ser:\n\n**“'+st.frase+'”**\n\n¿Esta frase representa lo que descubriste?',CONFIRMAR,false,'','panel');break;
case 'confirmar':if(text.includes('conservar'))closing();else if(text.includes('cambiar')){st.step='fraseChange';ai('📝 ¿Qué parte quieres cambiar?',[],true,'Quiero cambiar...')}else{st.step='fraseCustom';ai('📝 Escribe tu frase con tus palabras. Puedo mejorar la claridad, pero sin prometer un desenlace favorable, quitarte responsabilidad ni inventar una conclusión que no aparezca en tus respuestas.',[],true,'Mi frase personal es...')}break;
case 'fraseChange':st.frase=reform(text);closing();break;
case 'fraseCustom':st.frase=reform(text);closing();break;
case 'final':if(text.includes('Guardar'))downloadText();else if(text.includes('tarjeta'))downloadPNG();else if(text.includes('Volver al libro'))thanksNext();else if(text.includes('pausa')){st.step='pausaIntro';process('x')}else ai('Puedes elegir una de las opciones finales.',['📖 Volver al libro','💾 Guardar mi reflexión','🖼️ Descargar tarjeta visual PNG','🌿 Repetir la pausa']);break;
case 'thanks':resetAll();break;default:resetAll();}}
function reform(text){let x=String(text||'').trim();return x?(/[.!?]$/.test(x)?x:x+'.'):st.frase}
function closing(){st.step='final';ai('🙏 Has terminado esta experiencia, **'+st.name+'**.\n\nHoy reconociste que el deseo de controlar **'+st.situacion+'** buscaba proteger **'+st.necesidad+'**. También identificaste tu parte: **'+st.accion+'**.\n\nAhora eliges dejar de **'+st.soltar+'** y permitir que **'+st.externo+'** siga su propio proceso.\n\nVolverás a ocuparte de la situación **'+st.momento+'**.\n\nTu frase personal es:\n\n**“'+st.frase+'”**\n\nCuando sientas que necesitas sostenerlo todo nuevamente, abre las manos y recuerda: tu responsabilidad puede permanecer contigo sin que todo el resultado quede encerrado en ellas.\n\n📚 **Próximo capítulo:** Capítulo 7, **Recibir sin culpa**. Ahí podrás abrirte al apoyo y al reconocimiento sin sentir que debes justificarlo todo.',['📖 Volver al libro','💾 Guardar mi reflexión','🖼️ Descargar tarjeta visual PNG','🌿 Repetir la pausa'])}
function thanksNext(){st.step='thanks';ai('🙏 Gracias por completar la experiencia del **Capítulo 6: Soltar la necesidad de controlar**.\n\nHoy separaste cuidado, responsabilidad y control. También definiste una forma concreta de soltar sin abandonar tu parte.\n\nCuando regreses al libro, completa el cierre del capítulo con calma.\n\n📚 **Próximo capítulo:** Capítulo 7, **Recibir sin culpa**. Ahí podrás abrirte al apoyo y al reconocimiento sin sentir que debes justificarlo todo.',['🏠 Ir al inicio'])}
function record(){return 'MI PRÁCTICA PARA SOLTAR\n\nLa situación que intento controlar:\n'+st.situacion+'\n\nLo que intento evitar o asegurar:\n'+st.necesidad+'\n\nLa parte que sí me corresponde:\n'+st.accion+'\n\nLo que no puedo dirigir completamente:\n'+st.externo+'\n\nLo que dejaré de hacer:\n'+st.soltar+'\n\nCuándo actuaré o revisaré:\n'+st.momento+'\n\nMi frase personal:\n'+st.frase}
function downloadText(){let blob=new Blob([record()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Mi_Practica_Para_Soltar_Capitulo_6.txt';a.click();URL.revokeObjectURL(url);ai('✅ Tu reflexión se descargó como archivo de texto. También puedes descargar la tarjeta visual PNG.',['🖼️ Descargar tarjeta visual PNG','📖 Volver al libro','🌿 Repetir la pausa'])}

// ---- NUEVA FUNCIÓN downloadPNG CON ALTURA DINÁMICA ----
function downloadPNG(){
    var c=document.createElement('canvas');
    var scale=2;
    var w=1000;

    function countLines(text,maxWidth,fontSize){
        var ctx=document.createElement('canvas').getContext('2d');
        ctx.font=fontSize+'px Segoe UI';
        var words=String(text).replace(/\n/g,' \n ').split(' ');
        var lines=0,current='';
        for(var i=0;i<words.length;i++){
            var wd=words[i];
            if(wd==='\n'){lines++;current='';continue;}
            var test=current+wd+' ';
            if(ctx.measureText(test).width>maxWidth&&current){lines++;current=wd+' ';}
            else current=test;
        }
        if(current)lines++;
        return Math.max(lines,1);
    }

    var lineHeight=25;
    var maxWidth=w-140-44;
    var fields=[
        {title:'La situación que intento controlar',text:st.situacion},
        {title:'Lo que intento evitar o asegurar',text:st.necesidad},
        {title:'La parte que sí me corresponde',text:st.accion,featured:true},
        {title:'Lo que no puedo dirigir completamente',text:st.externo},
        {title:'Lo que dejaré de hacer',text:st.soltar},
        {title:'Cuándo actuaré o revisaré',text:st.momento},
        {title:'Mi frase personal',text:st.frase,featured:true}
    ];

    var h=190;
    fields.forEach(function(f){
        var isFeatured=f.featured||false;
        var fontSize=isFeatured?21:17;
        var lines=countLines(f.text,maxWidth,fontSize);
        h+=32+30+(lines*lineHeight)+10+12;
    });
    h+=120;
    h=Math.max(1320,h);

    c.width=w*scale;
    c.height=h*scale;
    var ctx=c.getContext('2d');
    ctx.scale(scale,scale);

    ctx.fillStyle='#fffaf3';
    round(ctx,0,0,w,h,34);
    ctx.fill();

    ctx.fillStyle='#eef4ed';
    round(ctx,36,36,w-72,h-72,28);
    ctx.fill();
    ctx.strokeStyle='#c9dfc7';
    ctx.lineWidth=2;
    ctx.stroke();

    ctx.fillStyle='#1f2b27';
    ctx.font='700 40px Segoe UI';
    ctx.fillText('Mi práctica para soltar',70,105);
    ctx.font='17px Segoe UI';
    ctx.fillStyle='#6f8179';
    ctx.fillText('Mi Yo Interior - Capítulo 6: Soltar la necesidad de controlar',70,138);

    var y=190;
    var x=70;
    var fieldWidth=w-140;

    fields.forEach(function(f){
        var isFeatured=f.featured||false;
        var fontSize=isFeatured?21:17;
        var lines=countLines(f.text,maxWidth,fontSize);
        var boxHeight=32+30+(lines*lineHeight)+10;

        ctx.fillStyle=isFeatured?'#dcebd9':'#fffaf3';
        round(ctx,x,y,fieldWidth,boxHeight,20);
        ctx.fill();
        ctx.strokeStyle='#c9dfc7';
        ctx.lineWidth=1.5;
        ctx.stroke();

        ctx.fillStyle='#3f725b';
        ctx.font='700 19px Segoe UI';
        ctx.fillText(f.title,x+22,y+32);

        ctx.fillStyle='#1f2b27';
        ctx.font=(isFeatured?'700 ':'')+fontSize+'px Segoe UI';
        wrap(ctx,String(f.text||'No especificado'),x+22,y+62,maxWidth,lineHeight);

        y+=boxHeight+12;
    });

    ctx.fillStyle='#3f725b';
    ctx.font='18px Segoe UI';
    wrap(ctx,'Soltar la necesidad de controlar significa actuar con responsabilidad y permitir que el tiempo, las demás personas y los procesos conserven la parte que les corresponde.',70,h-82,w-140,26);

    var a=document.createElement('a');
    a.href=c.toDataURL('image/png');
    a.download='Mi_Practica_Para_Soltar_Capitulo_6.png';
    a.click();
    ai('✅ Tu tarjeta visual PNG se descargó correctamente.',['📖 Volver al libro','🌿 Repetir la pausa']);
}

// ---- FUNCIÓN wrap (se mantiene igual) ----
function wrap(ctx,text,x,y,max,line){
    var words=String(text).replace(/\n/g,' \n ').split(' ');
    var current='';
    for(var i=0;i<words.length;i++){
        var wd=words[i];
        if(wd==='\n'){ctx.fillText(current,x,y);current='';y+=line;continue;}
        var test=current+wd+' ';
        if(ctx.measureText(test).width>max&&current){ctx.fillText(current,x,y);current=wd+' ';y+=line;}
        else current=test;
    }
    if(current)ctx.fillText(current,x,y);
}

function round(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

$('send').onclick=()=>{let t=txt.value.trim();if(t){txt.value='';handle(t)}};txt.addEventListener('keydown',e=>{if(e.key==='Enter')$('send').click()});$('reset').onclick=resetAll;$('save').onclick=()=>save(true);$('clear').onclick=()=>{localStorage.removeItem('miYoInteriorCap6V6SoltarLaNecesidadDeControlar');modal('Datos borrados','Se eliminó el progreso guardado en este dispositivo.',[['Aceptar',closeModal,'primary']])};$('amb').onclick=ambient;$('voice').onclick=voice;$('theme').onclick=theme;$('speed').onclick=speed;
