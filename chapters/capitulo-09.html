<style>
:root{--bg1:#0f1720;--bg2:#20313d;--bg3:#283b46;--paper:#fffaf3;--paper2:#edf3f7;--ink:#1d2830;--muted:#687983;--gold:#bfd8e6;--gold2:#6e9bb4;--line:#cfe0e9;--shadow:0 40px 90px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;width:100%}body{font-family:'Segoe UI',Tahoma,Verdana,sans-serif;min-height:100dvh;background:linear-gradient(145deg,var(--bg1),var(--bg2) 52%,var(--bg3));display:flex;align-items:center;justify-content:center;color:var(--ink);overflow:hidden;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}.wrap{width:100%;max-width:min(96vw,980px);height:min(96dvh,940px);display:flex}.app{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;background:rgba(255,250,243,.985);border-radius:30px;box-shadow:var(--shadow);border:1px solid rgba(191,216,230,.38)}.head{padding:15px 18px 12px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);background:rgba(255,250,243,.92);flex-shrink:0}.avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:radial-gradient(circle at 35% 25%,#eefbff,#bfd8e6 50%,#547c90);box-shadow:0 0 18px rgba(191,216,230,.65)}.info{flex:1;min-width:0}.info h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info p{font-size:11.5px;color:var(--muted)}.tools{display:flex;gap:6px}.tool{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#edf3f7;cursor:pointer;font-size:14px}.barwrap{height:4px;background:#dbe9ef;flex-shrink:0}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .3s ease}.msgs{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:clamp(12px,2vw,22px) clamp(14px,2.4vw,30px) clamp(90px,11vh,140px);display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}.m{max-width:min(98%,860px);padding:clamp(11px,1.8vw,16px) clamp(14px,2vw,20px);border-radius:18px;font-size:clamp(14px,1.7vw,17px);line-height:1.85;overflow-wrap:anywhere}.ai{background:var(--paper2);align-self:flex-start;border-bottom-left-radius:5px}.user{background:var(--gold);align-self:flex-end;border-bottom-right-radius:5px}.sys{background:#edf8ff;border:1px solid var(--line);align-self:center;text-align:center;font-size:12.5px;color:#436779}.panel{background:#f3fbff;border:1px solid var(--line);align-self:stretch;max-width:100%}.typing{background:var(--paper2);color:#687983;align-self:flex-start;font-size:20px;letter-spacing:2px;min-width:58px;text-align:center}.opts{padding:8px 18px 10px;flex-shrink:0}.grid{display:none;flex-wrap:wrap;gap:7px;justify-content:center}.grid.show{display:flex}.opt{border:1.4px solid var(--line);border-radius:999px;padding:8px 13px;background:#edf3f7;color:#1d2830;font-weight:650;cursor:pointer}.input{padding:0 18px 12px;flex-shrink:0}.row{display:none;gap:8px;background:#edf3f7;border-radius:25px;padding:4px;border:1px solid transparent}.row.show{display:flex}.row:focus-within{border-color:var(--gold)}input{flex:1;background:transparent;border:0;outline:0;padding:11px 12px;font-size:14px}.send{border:0;border-radius:21px;background:var(--gold);font-weight:750;padding:10px 16px;cursor:pointer}.safe{font-size:11.3px;color:#687983;text-align:center;padding:0 18px 9px;flex-shrink:0}.foot{padding:0 18px 12px;display:flex;gap:8px;justify-content:center;flex-shrink:0}.mini{border:0;background:transparent;color:#687983;font-size:12px;cursor:pointer}.modal{position:fixed;inset:0;background:rgba(0,0,0,.52);display:none;align-items:center;justify-content:center;z-index:9;padding:18px}.modal.show{display:flex}.card{background:var(--paper);border-radius:24px;padding:22px;width:min(540px,100%);box-shadow:var(--shadow)}.card h2{font-size:20px;margin-bottom:10px}.card p{font-size:14px;line-height:1.65;color:#30404a}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}.primary,.secondary{border:0;border-radius:14px;padding:10px 14px;cursor:pointer}.primary{background:var(--gold);font-weight:750}.secondary{background:#edf3f7}@media(max-width:540px){body{padding:0}.wrap{height:100dvh;max-width:100%}.app{border-radius:0}.head{padding:calc(12px + env(safe-area-inset-top)) 14px 10px}.msgs{padding:12px 14px calc(100px + env(safe-area-inset-bottom))}.m{font-size:14.6px}.tool{width:31px;height:31px}.opt{font-size:12px;padding:7px 11px}.foot{padding-bottom:calc(10px + env(safe-area-inset-bottom))}}

<body>
<div class="wrap"><main class="app"><header class="head"><div class="avatar">😊</div><div class="info"><h1>Mi Yo Interior</h1><p>Capítulo 9 · Reconocer las señales con discernimiento</p></div><div class="tools"><button class="tool" id="voice">🔈</button><button class="tool" id="amb">🎵</button><button class="tool" id="theme">🌙</button><button class="tool" id="speed">🐢</button></div></header><div class="barwrap"><div class="bar" id="bar"></div></div><section class="msgs" id="msgs"></section><section class="opts"><div class="grid" id="grid"></div></section><section class="input"><div class="row" id="row"><input id="txt"><button class="send" id="send">Enviar</button></div></section><p class="safe">Experiencia reflexiva y educativa. No reemplaza atención psicológica, médica, legal o financiera profesional.</p><footer class="foot"><button class="mini" id="reset">↺ Reiniciar</button><button class="mini" id="save">💾 Guardar</button><button class="mini" id="clear">🧹 Borrar</button></footer></main></div><div class="modal" id="modal"><div class="card"><h2 id="mt"></h2><p id="mb"></p><div class="actions" id="ma"></div></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id); const msgs=$('msgs'),grid=$('grid'),row=$('row'),txt=$('txt'),bar=$('bar');
let st={step:'welcome',name:'',senal:'',interpretacion:'',hecho:'',dato:'',criterio:'',respuesta:'',frase:'',history:[],voice:false,ambient:false,dark:false,slow:true};
const STEPS=['welcome','name','senal','interpretacion','pausaIntro','pausa','hecho','dato','criterio','respuesta','respuestaCustom','espejo','frase','fraseChange','fraseCustom','final'];
const RESPUESTAS=['Dar un paso pequeño y reversible','Buscar un dato antes de decidir','Conversar con alguien confiable','Esperar hasta una fecha concreta y volver a evaluar','No actuar basándome solo en esta señal','✍️ Escribir mi propia respuesta'];
const CONFIRMAR=['Sí, quiero conservarla','Quiero cambiar una parte','Prefiero escribirla con mis palabras'];
const RISK=['suicidio','suicidarme','matarme','hacerme daño','no quiero vivir','autolesión','autolesion','emergencia','amenaza','peligro inmediato','presión grave','insegura','urgente','alto impacto','decisión importante'];
function clean(t){return String(t||'').replace(/<strong[^>]*data-lexical-text="true"[^>]*>/g,'<strong>').replace(/<em[^>]*data-lexical-text="true"[^>]*>/g,'<em>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/\n/g,'<br>')}
function progress(){let i=STEPS.indexOf(st.step);bar.style.width=Math.max(0,Math.round((i/(STEPS.length-1))*100))+'%'}
function scrollEnd(){requestAnimationFrame(()=>setTimeout(()=>msgs.scrollTo({top:msgs.scrollHeight,behavior:'smooth'}),80))}
function add(text,who='ai',extra=''){let d=document.createElement('div');d.className='m '+who+(extra?' '+extra:'');d.innerHTML=clean(text);msgs.appendChild(d);if(who!=='typing')st.history.push({who,text,extra});scrollEnd();return d}
function typing(){let d=document.createElement('div');d.className='m typing';d.textContent='...';msgs.appendChild(d);scrollEnd();return d}
function opts(arr=[]){grid.innerHTML='';if(!arr.length){grid.classList.remove('show');return}grid.classList.add('show');arr.forEach(o=>{let b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>handle(o);grid.appendChild(b)})}
function inputShow(show,ph='Escribe aquí...'){row.classList.toggle('show',!!show);txt.placeholder=ph;if(show)setTimeout(()=>txt.focus(),60)}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function readPause(text){let w=String(text||'').split(/\s+/).filter(Boolean).length;return st.slow?Math.min(10000,Math.max(2200,w*170)):Math.min(5000,Math.max(900,w*80))}
function splitText(text){return String(text||'').split(/\n\n+/).map(x=>x.trim()).filter(Boolean)}
function emptyBubble(extra=''){let d=document.createElement('div');d.className='m ai'+(extra?' '+extra:'');msgs.appendChild(d);scrollEnd();return d}
async function typeInto(el,text){let out='';for(let i=0;i<text.length;i++){let ch=text.charAt(i);out+=ch;el.innerHTML=clean(out);if(i%3===0)scrollEnd();let ms=st.slow?(ch==='.'?340:(ch==='?'?460:(ch==='!'?420:(ch===','?150:(ch===';'?170:(ch===':'?170:28)))))):(ch==='.'?180:(ch==='?'?260:(ch==='!'?240:(ch===','?85:12))));await wait(ms)}el.innerHTML=clean(text);scrollEnd()}
async function ai(text,buttons=[],input=false,ph='Escribe aquí...',extra=''){opts([]);inputShow(false);progress();let parts=splitText(text);for(let part of parts){let t=typing();await wait(st.slow?900:450);t.remove();let b=emptyBubble(extra);await typeInto(b,part);st.history.push({who:'ai',text:part,extra});speak(part);await wait(readPause(part))}opts(buttons);inputShow(input,ph);save(false)}
function speak(text){if(!st.voice||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text.replace(/[\*#•]/g,''));u.lang='es-CL';u.rate=.86;speechSynthesis.speak(u)}
function risk(text){let x=String(text).toLowerCase();if(RISK.some(r=>x.includes(r))){st.step='risk';ai('Lo que describes puede requerir apoyo humano confiable e información adecuada antes de cualquier decisión. Esta experiencia no debe convertir una señal en una orden ni impulsar una acción apresurada. Si la situación es insegura, urgente o de alto impacto, detén el ejercicio y busca apoyo de una persona confiable o de un profesional adecuado.',['🌿 Volver al inicio']);return true}return false}
function handle(text){if(text.includes('Volver al inicio')||text.includes('Reiniciar'))return resetAll();add(text,'user');if(risk(text))return;process(String(text).trim())}
function construirFrase(){let comparacion=st.hecho||st.dato||st.criterio;return 'Puedo escuchar lo que '+st.senal+' despierta en mí sin tomarlo como una certeza. Lo compararé con '+comparacion+' y elegiré '+st.respuesta+'.'}
function process(text){switch(st.step){
case 'welcome':st.step='name';ai('😊 Hola. Soy **Mi Yo Interior**, el acompañante digital de este libro.\n\nNo interpretaré señales como predicciones ni te diré qué debes hacer. Te ayudaré a distinguir entre lo que observaste, lo que significa para ti y lo que todavía necesitas comprobar.\n\n¿Cómo te gustaría que te llame?',[],true,'Escribe tu nombre o un apodo.');break;
case 'name':st.name=text;st.step='senal';ai('Gracias, **'+st.name+'**.\n\nNo necesitas convencerme de que la señal es verdadera o falsa. Solo vamos a mirarla con atención y sin prisa.\n\n🔎 ¿Qué coincidencia, frase, sensación o situación reciente te pareció una señal?',[],true,'Lo que ocurrió fue...');break;
case 'senal':st.senal=text;st.step='interpretacion';ai('Lo que llamó tu atención fue **'+st.senal+'**.\n\nAhora separaremos ese hecho del significado que comenzó a tomar para ti.\n\n💭 ¿Qué pensaste que esa señal podía estar indicándote?',[],true,'Pensé que podía significar...');break;
case 'interpretacion':st.interpretacion=text;st.step='pausaIntro';ai('Interpretaste que podía significar **'+st.interpretacion+'**.\n\nEsa interpretación puede aportar información sobre lo que esperas, temes o consideras importante, pero todavía no constituye una prueba ni una decisión.',['🌿 Volver a lo observable']);break;
case 'pausaIntro':st.step='pausa';ai('🌿 Antes de seguir interpretando, mira el lugar en el que estás y elige tres elementos reales que puedas observar directamente.\n\nNombra en silencio un color, una forma y un sonido. No les busques significado. Limítate a reconocerlos tal como son.\n\nAhora vuelve a la señal y completa mentalmente dos frases:\n\n**Lo que ocurrió fue:** '+st.senal+'\n\n**Lo que yo interpreté fue:** '+st.interpretacion+'\n\nAmbas cosas son importantes, pero no son lo mismo. Esta pequeña distancia te permite escuchar la señal sin entregarle toda tu decisión.',['✅ He vuelto a lo observable']);break;
case 'pausa':st.step='hecho';ai('📌 ¿Qué hecho o información verificable apoya, o pone en duda, la interpretación que hiciste?',[],true,'Lo que realmente sé es...');break;
case 'hecho':st.hecho=text;if(text.toLowerCase().includes('no tengo')||text.toLowerCase().includes('no sé')||text.toLowerCase().includes('no se')||text.toLowerCase().includes('falta')){st.step='dato';ai('Entonces tu descubrimiento de hoy puede ser precisamente ese: todavía falta información.\n\nNombra un dato concreto y una fuente humana o confiable para comprobarlo.',[],true,'Necesito comprobar... con...')}else{st.dato='No aplica';st.step='criterio';ai('Has reconocido este dato: **'+st.hecho+'**.\n\nAhora puedes compararlo con la interpretación sin tratar ninguno de los dos como si fueran lo mismo.\n\n🧭 Más allá de la señal, ¿qué valor, necesidad o criterio personal hace que este tema sea importante para ti?',[],true,'Para mí es importante...')}break;
case 'dato':st.dato=text;st.step='criterio';ai('Queda identificado el dato que necesitas comprobar: **'+st.dato+'**.\n\nBuscar información también puede ser una respuesta prudente.\n\n🧭 Más allá de la señal, ¿qué valor, necesidad o criterio personal hace que este tema sea importante para ti?',[],true,'Para mí es importante...');break;
case 'criterio':st.criterio=text;st.step='respuesta';ai('La señal llamó tu atención porque para ti es importante **'+st.criterio+'**.\n\nEse criterio nace de tus propias palabras y puede orientarte con más claridad que una interpretación aislada.\n\n🚶 Con lo que sabes ahora, ¿qué respuesta sería prudente y coherente contigo?',RESPUESTAS);break;
case 'respuesta':if(text.includes('Escribir')){st.step='respuestaCustom';ai('✍️ Escribe con tus palabras la respuesta prudente y coherente que eliges dar.',[],true,'Decido...')}else{st.respuesta=text;st.step='espejo';ai('Has elegido **'+st.respuesta+'**.\n\nNo estás ignorando lo que sentiste; estás decidiendo cuánto valor darle después de compararlo con los hechos y con tu propio criterio.',['🪞 Continuar a devolución espejo'])}break;
case 'respuestaCustom':st.respuesta=text;st.step='espejo';ai('Has elegido **'+st.respuesta+'**.\n\nNo estás ignorando lo que sentiste; estás decidiendo cuánto valor darle después de compararlo con los hechos y con tu propio criterio.',['🪞 Continuar a devolución espejo']);break;
case 'espejo':st.step='frase';ai('🪞 Quiero devolverte lo que tú mismo reconociste, **'+st.name+'**.\n\nObservaste **'+st.senal+'** y pensaste que podía significar **'+st.interpretacion+'**.\n\nAl volver a lo observable, distinguiste esa lectura de lo que realmente sabes: **'+st.hecho+'**.\n\nTambién reconociste que para ti es importante **'+st.criterio+'**. Por eso elegiste **'+st.respuesta+'**.\n\nLa respuesta no estaba escondida dentro de la señal. Apareció cuando reuniste lo que observaste, lo que sabes y aquello que tú consideras importante.',['❤️ Crear mi frase personal']);break;
case 'frase':st.frase=construirFrase();st.step='confirmar';ai('❤️ Con tus propias respuestas, tu frase podría ser:\n\n**“'+st.frase+'”**\n\n¿Esta frase representa lo que descubriste?',CONFIRMAR,false,'','panel');break;
case 'confirmar':if(text.includes('conservar'))closing();else if(text.includes('cambiar')){st.step='fraseChange';ai('📝 ¿Qué parte quieres cambiar?',[],true,'Quiero cambiar...')}else{st.step='fraseCustom';ai('📝 Escribe tu frase con tus palabras. Puedo mejorar la claridad, pero no debo confirmar predicciones, atribuir un origen sobrenatural a la señal ni cambiar la decisión que expresaste.',[],true,'Mi frase personal es...')}break;
case 'fraseChange':st.frase=reform(text);closing();break;
case 'fraseCustom':st.frase=reform(text);closing();break;
case 'final':if(text.includes('Guardar'))downloadText();else if(text.includes('tarjeta'))downloadPNG();else if(text.includes('Volver al libro'))thanksNext();else if(text.includes('pausa')){st.step='pausaIntro';process('x')}else ai('Puedes elegir una de las opciones finales.',['📖 Volver al libro','💾 Guardar mi reflexión','🖼️ Descargar tarjeta visual PNG','🌿 Repetir la pausa']);break;
case 'thanks':resetAll();break;default:resetAll();}}
function reform(text){let x=String(text||'').trim();return x?(/[.!?]$/.test(x)?x:x+'.'):st.frase}
function closing(){st.step='final';ai('🙏 Has terminado esta experiencia, **'+st.name+'**.\n\nHoy distinguiste **'+st.senal+'** de la interpretación **'+st.interpretacion+'**.\n\nReconociste que sabes **'+st.hecho+'** y recuperaste tu criterio: **'+st.criterio+'**.\n\nTu respuesta será: **'+st.respuesta+'**.\n\nTu frase personal es:\n\n**“'+st.frase+'”**\n\nCuando otra señal llame tu atención, puedes escucharla sin obedecerla automáticamente: vuelve a lo observable, comprueba lo que puedas y elige desde tus propios criterios.\n\n📚 **Próximo capítulo:** Capítulo 10, **Convertir la intención en movimiento**. Ahí podrás dar un primer paso consciente hacia la vida que deseas construir.',['📖 Volver al libro','💾 Guardar mi reflexión','🖼️ Descargar tarjeta visual PNG','🌿 Repetir la pausa'])}
function thanksNext(){st.step='thanks';ai('🙏 Gracias por completar la experiencia del **Capítulo 9: Reconocer las señales con discernimiento**.\n\nHoy distinguiste observación, interpretación, información y criterio propio antes de elegir una respuesta prudente.\n\nCuando regreses al libro, completa el cierre del capítulo con calma.\n\n📚 **Próximo capítulo:** Capítulo 10, **Convertir la intención en movimiento**. Ahí podrás dar un primer paso consciente hacia la vida que deseas construir.',['🏠 Ir al inicio'])}
function record(){return 'LA SEÑAL Y MI CRITERIO\n\nLa señal que observé:\n'+st.senal+'\n\nEl significado que le atribuí:\n'+st.interpretacion+'\n\nLo que realmente sé:\n'+st.hecho+'\n\nLa información que necesito comprobar:\n'+(st.dato||'No aplica')+'\n\nEl criterio que reconocí en mí:\n'+st.criterio+'\n\nMi respuesta prudente:\n'+st.respuesta+'\n\nMi frase personal:\n'+st.frase}
function downloadText(){let blob=new Blob([record()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='La_Senal_y_Mi_Criterio_Capitulo_9.txt';a.click();URL.revokeObjectURL(url);ai('✅ Tu reflexión se descargó como archivo de texto. También puedes descargar la tarjeta visual PNG.',['🖼️ Descargar tarjeta visual PNG','📖 Volver al libro','🌿 Repetir la pausa'])}

// ---- NUEVA FUNCIÓN downloadPNG CON ALTURA DINÁMICA ----
function downloadPNG(){
    var c=document.createElement('canvas');
    var scale=2;
    var w=1000;

    function countLines(text,maxWidth,fontSize){
        var ctx=document.createElement('canvas').getContext('2d');
        ctx.font=fontSize+'px Segoe UI';
        var words=String(text).replace(/\n/g,' \n ').split(' ');
        var lines=0,current='';
        for(var i=0;i<words.length;i++){
            var wd=words[i];
            if(wd==='\n'){lines++;current='';continue;}
            var test=current+wd+' ';
            if(ctx.measureText(test).width>maxWidth&&current){lines++;current=wd+' ';}
            else current=test;
        }
        if(current)lines++;
        return Math.max(lines,1);
    }

    var lineHeight=25;
    var maxWidth=w-140-44;
    var fields=[
        {title:'La señal que observé',text:st.senal},
        {title:'El significado que le atribuí',text:st.interpretacion},
        {title:'Lo que realmente sé',text:st.hecho,featured:true},
        {title:'La información que necesito comprobar',text:st.dato||'No aplica'},
        {title:'El criterio que reconocí en mí',text:st.criterio},
        {title:'Mi respuesta prudente',text:st.respuesta,featured:true},
        {title:'Mi frase personal',text:st.frase,featured:true}
    ];

    var h=190;
    fields.forEach(function(f){
        var isFeatured=f.featured||false;
        var fontSize=isFeatured?21:17;
        var lines=countLines(f.text,maxWidth,fontSize);
        h+=32+30+(lines*lineHeight)+10+12;
    });
    h+=120;
    h=Math.max(1320,h);

    c.width=w*scale;
    c.height=h*scale;
    var ctx=c.getContext('2d');
    ctx.scale(scale,scale);

    ctx.fillStyle='#fffaf3';
    round(ctx,0,0,w,h,34);
    ctx.fill();

    ctx.fillStyle='#edf3f7';
    round(ctx,36,36,w-72,h-72,28);
    ctx.fill();
    ctx.strokeStyle='#bfd8e6';
    ctx.lineWidth=2;
    ctx.stroke();

    ctx.fillStyle='#1d2830';
    ctx.font='700 40px Segoe UI';
    ctx.fillText('La señal y mi criterio',70,105);
    ctx.font='17px Segoe UI';
    ctx.fillStyle='#687983';
    ctx.fillText('Mi Yo Interior - Capítulo 9: Reconocer las señales con discernimiento',70,138);

    var y=190;
    var x=70;
    var fieldWidth=w-140;

    fields.forEach(function(f){
        var isFeatured=f.featured||false;
        var fontSize=isFeatured?21:17;
        var lines=countLines(f.text,maxWidth,fontSize);
        var boxHeight=32+30+(lines*lineHeight)+10;

        ctx.fillStyle=isFeatured?'#d9edf7':'#fffaf3';
        round(ctx,x,y,fieldWidth,boxHeight,20);
        ctx.fill();
        ctx.strokeStyle='#bfd8e6';
        ctx.lineWidth=1.5;
        ctx.stroke();

        ctx.fillStyle='#496c80';
        ctx.font='700 19px Segoe UI';
        ctx.fillText(f.title,x+22,y+32);

        ctx.fillStyle='#1d2830';
        ctx.font=(isFeatured?'700 ':'')+fontSize+'px Segoe UI';
        wrap(ctx,String(f.text||'No especificado'),x+22,y+62,maxWidth,lineHeight);

        y+=boxHeight+12;
    });

    ctx.fillStyle='#496c80';
    ctx.font='18px Segoe UI';
    wrap(ctx,'Una señal puede invitarte a mirar algo importante, pero el discernimiento aparece cuando distingues lo que observaste, lo que interpretaste y lo que eliges hacer con responsabilidad.',70,h-82,w-140,26);

    var a=document.createElement('a');
    a.href=c.toDataURL('image/png');

// ---- FUNCIÓN wrap (se mantiene igual) ----
function wrap(ctx,text,x,y,max,line){
    var words=String(text).replace(/\n/g,' \n ').split(' ');
    var current='';
    for(var i=0;i<words.length;i++){
        var wd=words[i];
        if(wd==='\n'){ctx.fillText(current,x,y);current='';y+=line;continue;}
        var test=current+wd+' ';
        if(ctx.measureText(test).width>max&&current){ctx.fillText(current,x,y);current=wd+' ';y+=line;}
        else current=test;
    }
    if(current)ctx.fillText(current,x,y);
}

function round(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
