*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;width:100%}body{font-family:'Segoe UI',Tahoma,Verdana,sans-serif;min-height:100dvh;background:linear-gradient(145deg,var(--bg1),var(--bg2) 52%,var(--bg3));display:flex;align-items:center;justify-content:center;color:var(--ink);overflow:hidden;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}.wrap{width:100%;max-width:min(96vw,980px);height:min(96dvh,940px);display:flex}.app{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;background:rgba(255,250,243,.985);border-radius:30px;box-shadow:var(--shadow);border:1px solid rgba(215,189,138,.38)}.head{padding:15px 18px 12px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);background:rgba(255,250,243,.92);flex-shrink:0}.avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:radial-gradient(circle at 35% 25%,#f7ffe9,#d7bd8a 50%,#2f6f73);box-shadow:0 0 18px rgba(215,189,138,.65)}.info{flex:1;min-width:0}.info h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info p{font-size:11.5px;color:var(--muted)}.tools{display:flex;gap:6px}.tool{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#eef4f2;cursor:pointer;font-size:14px}.barwrap{height:4px;background:#dcebd9;flex-shrink:0}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .3s ease}.msgs{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:clamp(12px,2vw,22px) clamp(14px,2.4vw,30px) clamp(90px,11vh,140px);display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}.m{max-width:min(98%,860px);padding:clamp(11px,1.8vw,16px) clamp(14px,2vw,20px);border-radius:18px;font-size:clamp(14px,1.7vw,17px);line-height:1.85;overflow-wrap:anywhere}.ai{background:var(--paper2);align-self:flex-start;border-bottom-left-radius:5px}.user{background:var(--gold);align-self:flex-end;border-bottom-right-radius:5px}.sys{background:#f4ffe8;border:1px solid var(--line);align-self:center;text-align:center;font-size:12.5px;color:#4d6349}.panel{background:#f7fff2;border:1px solid var(--line);align-self:stretch;max-width:100%}.typing{background:var(--paper2);color:#657274;align-self:flex-start;font-size:20px;letter-spacing:2px;min-width:58px;text-align:center}.opts{padding:8px 18px 10px;flex-shrink:0}.grid{display:none;flex-wrap:wrap;gap:7px;justify-content:center}.grid.show{display:flex}.opt{border:1.4px solid var(--line);border-radius:999px;padding:8px 13px;background:#eef4f2;color:#1f2b27;font-weight:650;cursor:pointer}.input{padding:0 18px 12px;flex-shrink:0}.row{display:none;gap:8px;background:#eef4f2;border-radius:25px;padding:4px;border:1px solid transparent}.row.show{display:flex}.row:focus-within{border-color:var(--gold)}input{flex:1;background:transparent;border:0;outline:0;padding:11px 12px;font-size:14px}.send{border:0;border-radius:21px;background:var(--gold);font-weight:750;padding:10px 16px;cursor:pointer}.safe{font-size:11.3px;color:#657274;text-align:center;padding:0 18px 9px;flex-shrink:0}.foot{padding:0 18px 12px;display:flex;gap:8px;justify-content:center;flex-shrink:0}.mini{border:0;background:transparent;color:#657274;font-size:12px;cursor:pointer}.modal{position:fixed;inset:0;background:rgba(0,0,0,.52);display:none;align-items:center;justify-content:center;z-index:9;padding:18px}.modal.show{display:flex}.card{background:var(--paper);border-radius:24px;padding:22px;width:min(540px,100%);box-shadow:var(--shadow)}.card h2{font-size:20px;margin-bottom:10px}.card p{font-size:14px;line-height:1.65;color:#34433d}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}.primary,.secondary{border:0;border-radius:14px;padding:10px 14px;cursor:pointer}.primary{background:var(--gold);font-weight:750}.secondary{background:#eef4f2}@media(max-width:540px){body{padding:0}.wrap{height:100dvh;max-width:100%}.app{border-radius:0}.head{padding:calc(12px + env(safe-area-inset-top)) 14px 10px}.msgs{padding:12px 14px calc(100px + env(safe-area-inset-bottom))}.m{font-size:14.6px}.tool{width:31px;height:31px}.opt{font-size:12px;padding:7px 11px}.foot{padding-bottom:calc(10px + env(safe-area-inset-bottom))}}

<body>
<div class="wrap"><main class="app"><header class="head"><div class="avatar">😊</div><div class="info"><h1>Mi Yo Interior</h1><p>Capítulo 1 · Entregar la carga</p></div><div class="tools"><button class="tool" id="voice" type="button">🔈</button><button class="tool" id="amb" type="button">🎵</button><button class="tool" id="theme" type="button">🌙</button><button class="tool" id="speed" type="button">🐢</button></div></header><div class="barwrap"><div class="bar" id="bar"></div></div><section class="msgs" id="msgs"></section><section class="opts"><div class="grid" id="grid"></div></section><section class="input"><div class="row" id="row"><input id="txt" autocomplete="off"><button class="send" id="send" type="button">Enviar</button></div></section><p class="safe">Experiencia reflexiva y educativa. No reemplaza atención psicológica, médica, legal o financiera profesional.</p><footer class="foot"><button class="mini" id="reset" type="button">↺ Reiniciar</button><button class="mini" id="save" type="button">💾 Guardar</button><button class="mini" id="clear" type="button">🧹 Borrar</button></footer></main></div><div class="modal" id="modal"><div class="card"><h2 id="mt"></h2><p id="mb"></p><div class="actions" id="ma"></div></div></div>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var msgs=$('msgs'),grid=$('grid'),row=$('row'),txt=$('txt'),bar=$('bar');
var st={step:'welcome',name:'',carga:'',emocion:'',entregar:'',manos:'',accion:'',momento:'',afirmacion:'',history:[],voice:false,ambient:false,dark:false,slow:true};
var STEPS=['welcome','name','carga','emocion','pausaIntro','pausa','entregar','manos','accion','momento','afirmacion','afirmacionChange','afirmacionCustom','final'];
var EMOCIONES=['Miedo','Enojo','Tristeza','Culpa','Cansancio','Confusión','Frustración','Otra emoción','No sé cómo nombrarla'];
var MOMENTOS=['Hoy','Mañana','En una fecha específica'];
var CONFIRMAR=['Sí, quiero conservarla','Quiero modificarla','Prefiero escribir la mía'];
var RISK=['suicidio','suicidarme','matarme','hacerme daño','no quiero vivir','autolesión','autolesion','abuso','violencia','emergencia','amenaza','peligro inmediato','presión grave','presion grave','insegura','inseguro','sobrepasado','sobrepasada','malestar intenso'];
function clean(t){return String(t||'').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/\n/g,'<br>');}
function progress(){var i=STEPS.indexOf(st.step);bar.style.width=Math.max(0,Math.round((i/(STEPS.length-1))*100))+'%';}
function scrollEnd(){requestAnimationFrame(function(){setTimeout(function(){msgs.scrollTo({top:msgs.scrollHeight,behavior:'smooth'});},80);});}
function add(text,who,extra){who=who||'ai';extra=extra||'';var d=document.createElement('div');d.className='m '+who+(extra?' '+extra:'');d.innerHTML=clean(text);msgs.appendChild(d);if(who!=='typing'){st.history.push({who:who,text:text,extra:extra});}scrollEnd();return d;}
function typing(){var d=document.createElement('div');d.className='m typing';d.textContent='...';msgs.appendChild(d);scrollEnd();return d;}
function opts(arr){grid.innerHTML='';if(!arr||!arr.length){grid.classList.remove('show');return;}grid.classList.add('show');arr.forEach(function(o){var b=document.createElement('button');b.className='opt';b.textContent=o;b.type='button';b.addEventListener('click',function(){handle(o);});grid.appendChild(b);});}
function inputShow(show,ph){row.classList.toggle('show',!!show);txt.placeholder=ph||'Escribe aquí...';if(show){setTimeout(function(){txt.focus();},60);}}
function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
function readPause(text){var w=String(text||'').split(/\s+/).filter(Boolean).length;return st.slow?Math.min(7000,Math.max(1300,w*95)):Math.min(3500,Math.max(600,w*45));}
function splitText(text){return String(text||'').split(/\n\n+/).map(function(x){return x.trim();}).filter(Boolean);}
function emptyBubble(extra){var d=document.createElement('div');d.className='m ai'+(extra?' '+extra:'');msgs.appendChild(d);scrollEnd();return d;}
async function typeInto(el,text){var out='';for(var i=0;i<text.length;i++){var ch=text.charAt(i);out+=ch;el.innerHTML=clean(out);if(i%3===0){scrollEnd();}var ms=st.slow?(ch==='.'?180:(ch==='?'?230:(ch===','?90:18))):(ch==='.'?90:(ch==='?'?130:(ch===','?45:8)));await wait(ms);}el.innerHTML=clean(text);scrollEnd();}
async function ai(text,buttons,input,ph,extra){buttons=buttons||[];input=!!input;ph=ph||'Escribe aquí...';extra=extra||'';opts([]);inputShow(false);progress();var parts=splitText(text);for(var i=0;i<parts.length;i++){var t=typing();await wait(st.slow?550:250);t.remove();var b=emptyBubble(extra);await typeInto(b,parts[i]);st.history.push({who:'ai',text:parts[i],extra:extra});speak(parts[i]);await wait(readPause(parts[i]));}opts(buttons);inputShow(input,ph);save(false);}
function speak(text){if(!st.voice||!('speechSynthesis' in window)){return;}speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text.replace(/[\*#]/g,''));u.lang='es-CL';u.rate=.88;speechSynthesis.speak(u);}
function risk(text){var x=String(text).toLowerCase();if(RISK.some(function(r){return x.indexOf(r)>=0;})){st.step='risk';ai('Lo que describes puede requerir apoyo humano adecuado. Esta experiencia no debe reemplazar ayuda profesional ni acompañamiento cercano si hay riesgo, emergencia, violencia, presión grave o malestar intenso. Detén el ejercicio y busca apoyo de una persona de confianza o de un profesional adecuado.',['🌿 Volver al inicio']);return true;}return false;}
function handle(text){if(text==='🌿 Volver al inicio'||text==='Volver al inicio'||text==='↺ Reiniciar'){return resetAll();}add(text,'user');if(risk(text)){return;}process(String(text).trim());}
function construirAfirmacion(){return 'Entrego '+st.entregar+' y elijo '+(st.accion||st.manos)+', paso a paso.';}
function process(text){switch(st.step){
case 'welcome':st.step='name';ai('😊 Hola. Soy **Mi Yo Interior**, el acompañante digital de este libro.\n\nNo decidiré por ti ni te diré qué debes sentir. Solo organizaré lo que compartas para ayudarte a escuchar tus propias respuestas.\n\n¿Cómo quieres que te llame durante esta experiencia?',[],true,'Mi nombre es...');break;
case 'name':st.name=text||'lector';st.step='carga';ai('Gracias, **'+st.name+'**.\n\nPiensa en la situación que hoy está ocupando demasiado espacio dentro de ti. Puedes escribirla en una sola frase, sin entregar detalles que prefieras mantener en privado.\n\n¿Qué carga estás sosteniendo?',[],true,'Hoy estoy cargando con...');break;
case 'carga':st.carga=text;st.step='emocion';ai('Hoy reconoces que estás sosteniendo **'+st.carga+'**.\n\nPonerlo en palabras ya permite observarlo con un poco más de claridad.\n\nCuando piensas en esta carga, ¿qué emoción aparece con más fuerza?',EMOCIONES);break;
case 'emocion':if(text==='Otra emoción'){ai('✍️ Escribe con tus palabras qué emoción aparece con más fuerza.',[],true,'La emoción que aparece es...');st.step='emocionCustom';}else if(text==='No sé cómo nombrarla'){st.emocion='una emoción que todavía no puedes nombrar';st.step='pausaIntro';ai('No necesitas nombrarla perfectamente. Por ahora basta con reconocer que algo está presente y que puede entregarte información.',['🌿 Hacer el gesto de soltar']);}else{st.emocion=text;st.step='pausaIntro';ai('Al pensar en esta situación aparece **'+st.emocion+'**.\n\nNo necesitas hacerla desaparecer. Por ahora, basta con reconocer que está presente y que puede entregarte información.',['🌿 Hacer el gesto de soltar']);}break;
case 'emocionCustom':st.emocion=text;st.step='pausaIntro';ai('Al pensar en esta situación aparece **'+st.emocion+'**.\n\nNo necesitas hacerla desaparecer. Por ahora, basta con reconocer que está presente y que puede entregarte información.',['🌿 Hacer el gesto de soltar']);break;
case 'pausaIntro':st.step='pausa';ai('🌿 Si te resulta cómodo, coloca las manos frente a ti como si sostuvieras esa carga.\n\nInhala lentamente. Mientras exhalas, abre las manos con suavidad.\n\nNo estás abandonando tu responsabilidad. Estás soltando, por un momento, la necesidad de controlar todo al mismo tiempo.\n\nRepite interiormente:\n\n**Reconozco esta carga.\nEntrego lo que no depende de mí.\nConservo lo que sí puedo elegir.**\n\nHaz una respiración más y continúa cuando estés preparado.',['Continuar']);break;
case 'pausa':st.step='entregar';ai('Ahora observemos la carga desde dos lugares distintos.\n\n¿Qué parte de esta situación no depende completamente de ti?',[],true,'No depende de mí...');break;
case 'entregar':st.entregar=text;st.step='manos';ai('Gracias. Has reconocido que no puedes dirigir completamente **'+st.entregar+'**.\n\nAhora miremos la otra parte.\n\n¿Qué respuesta, decisión o acción sí se encuentra en tus manos?',[],true,'Sí depende de mí...');break;
case 'manos':st.manos=text;st.step='accion';ai('También descubriste que todavía puedes elegir **'+st.manos+'**.\n\nLa carga no desaparece necesariamente, pero ya no tienes que sostenerla toda de la misma manera.\n\nNo necesitas resolver toda la situación. ¿Qué acción pequeña y posible puedes realizar durante las próximas 24 horas?',[],true,'Mi próximo paso será...');break;
case 'accion':st.accion=text;st.step='momento';ai('Tu próximo paso será **'+st.accion+'**.\n\n¿Cuándo lo realizarás?',MOMENTOS);break;
case 'momento':if(text==='En una fecha específica'){ai('Escribe la fecha o momento específico en que realizarás tu próximo paso.',[],true,'Lo realizaré...');st.step='momentoCustom';}else{st.momento=text;st.step='afirmacion';st.afirmacion=construirAfirmacion();ai('Con tus respuestas, esta podría ser tu afirmación:\n\n**“'+st.afirmacion+'”**\n\nEsta frase conserva tus palabras y tu intención. ¿Te representa?',CONFIRMAR,false,'','panel');}break;
case 'momentoCustom':st.momento=text;st.step='afirmacion';st.afirmacion=construirAfirmacion();ai('Con tus respuestas, esta podría ser tu afirmación:\n\n**“'+st.afirmacion+'”**\n\nEsta frase conserva tus palabras y tu intención. ¿Te representa?',CONFIRMAR,false,'','panel');break;
case 'afirmacion':if(text.indexOf('conservar')>=0){closing();}else if(text.indexOf('modificar')>=0){st.step='afirmacionChange';ai('📝 ¿Qué parte quieres modificar?',[],true,'Quiero modificar...');}else{st.step='afirmacionCustom';ai('📝 Escribe tu afirmación con tus palabras. La conservaremos como tu frase final.',[],true,'Mi afirmación es...');}break;
case 'afirmacionChange':st.afirmacion=reform(text);closing();break;
case 'afirmacionCustom':st.afirmacion=reform(text);closing();break;
case 'final':if(text.indexOf('Guardar')>=0){downloadText();}else if(text.indexOf('tarjeta')>=0){downloadPNG();}else if(text.indexOf('Volver al libro')>=0){completeChapterAndReturn(1);}else if(text.indexOf('Repetir')>=0){resetAll();}else{ai('Puedes elegir una de las opciones finales.',['📖 Volver al libro','💾 Guardar mi resumen','🖼️ Descargar tarjeta visual PNG','🔄 Repetir la experiencia']);}break;
default:resetAll();}}
function reform(text){var x=String(text||'').trim();return x?(/[.!?]$/.test(x)?x:x+'.'):st.afirmacion;}
function closing(){st.step='final';ai('🪞 Hoy reconociste **'+st.carga+'** y la emoción que aparecía junto a ella: **'+st.emocion+'**.\n\nDecidiste entregar **'+st.entregar+'** y conservar tu capacidad de **'+st.manos+'**.\n\nTu próximo paso será: **'+st.accion+' — '+st.momento+'**.\n\nTu afirmación es:\n\n**“'+st.afirmacion+'”**\n\nLa respuesta no vino de afuera. Ya estaba tomando forma en aquello que observaste, distinguiste y elegiste. Respira una vez más y, cuando estés preparado, regresa al libro.\n\n📚 **Próximo capítulo:** Capítulo 2, **Las palabras que te construyen**. Ahí podrás observar cómo las palabras que usas para describirte pueden abrir o cerrar caminos.',['📖 Volver al libro','💾 Guardar mi resumen','🖼️ Descargar tarjeta visual PNG','🔄 Repetir la experiencia']);}
function record(){return 'MI RECORDATORIO DE HOY\n\nLa carga que reconozco:\n'+st.carga+'\n\nLa emoción que aparece:\n'+st.emocion+'\n\nLo que decido entregar:\n'+st.entregar+'\n\nLo que sí está en mis manos:\n'+st.manos+'\n\nMi próximo paso:\n'+st.accion+' — '+st.momento+'\n\nMi afirmación:\n'+st.afirmacion+'\n\nNo necesito resolverlo todo hoy. Solo necesito reconocer qué puedo entregar y cuál es mi siguiente paso posible.';}
function downloadText(){var blob=new Blob([record()],{type:'text/plain;charset=utf-8'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='Mi_Recordatorio_De_Hoy_Capitulo_1.txt';a.click();URL.revokeObjectURL(url);ai('✅ Tu resumen se descargó como archivo de texto. También puedes descargar una tarjeta visual PNG.',['🖼️ Descargar tarjeta visual PNG','📖 Volver al libro','🔄 Repetir la experiencia']);}

// ---- NUEVA FUNCIÓN downloadPNG CON ALTURA DINÁMICA ----
function downloadPNG(){
    var c=document.createElement('canvas');
    var scale=2;
    var w=1000;

    function countLines(text,maxWidth,fontSize){
        var ctx=document.createElement('canvas').getContext('2d');
        ctx.font=fontSize+'px Segoe UI';
        var words=String(text).replace(/\n/g,' \n ').split(' ');
        var lines=0,current='';
        for(var i=0;i<words.length;i++){
            var wd=words[i];
            if(wd==='\n'){lines++;current='';continue;}
            var test=current+wd+' ';
            if(ctx.measureText(test).width>maxWidth&&current){lines++;current=wd+' ';}
            else current=test;
        }
        if(current)lines++;
        return Math.max(lines,1);
    }

    var lineHeight=25;
    var maxWidth=w-140-44;
    var fields=[
        {title:'La carga que reconozco',text:st.carga},
        {title:'La emoción que aparece',text:st.emocion},
        {title:'Lo que decido entregar',text:st.entregar,featured:true},
        {title:'Lo que sí está en mis manos',text:st.manos},
        {title:'Mi próximo paso',text:st.accion+' — '+st.momento,featured:true},
        {title:'Mi afirmación',text:st.afirmacion,featured:true}
    ];

    var h=190;
    fields.forEach(function(f){
        var isFeatured=f.featured||false;
        var fontSize=isFeatured?21:17;
        var lines=countLines(f.text,maxWidth,fontSize);
        h+=32+30+(lines*lineHeight)+10+12;
    });
    h+=120;
    h=Math.max(1320,h);

    c.width=w*scale;
    c.height=h*scale;
    var ctx=c.getContext('2d');
    ctx.scale(scale,scale);

    ctx.fillStyle='#fffaf3';
    round(ctx,0,0,w,h,34);
    ctx.fill();

    ctx.fillStyle='#eef4f2';
    round(ctx,36,36,w-72,h-72,28);
    ctx.fill();
    ctx.strokeStyle='#d7bd8a';
    ctx.lineWidth=2;
    ctx.stroke();

    ctx.fillStyle='#1f2b27';
    ctx.font='700 40px Segoe UI';
    ctx.fillText('Mi recordatorio de hoy',70,105);
    ctx.font='17px Segoe UI';
    ctx.fillStyle='#657274';
    ctx.fillText('Mi Yo Interior - Capítulo 1: Entregar la carga',70,138);

    var y=190;
    var x=70;
    var fieldWidth=w-140;

    fields.forEach(function(f){
        var isFeatured=f.featured||false;
        var fontSize=isFeatured?21:17;
        var lines=countLines(f.text,maxWidth,fontSize);
        var boxHeight=32+30+(lines*lineHeight)+10;

        ctx.fillStyle=isFeatured?'#dcebd9':'#fffaf3';
        round(ctx,x,y,fieldWidth,boxHeight,20);
        ctx.fill();
        ctx.strokeStyle='#d7bd8a';
        ctx.lineWidth=1.5;
        ctx.stroke();

        ctx.fillStyle='#335c52';
        ctx.font='700 19px Segoe UI';
        ctx.fillText(f.title,x+22,y+32);

        ctx.fillStyle='#1f2b27';
        ctx.font=(isFeatured?'700 ':'')+fontSize+'px Segoe UI';
        wrap(ctx,String(f.text||'No especificado'),x+22,y+62,maxWidth,lineHeight);

        y+=boxHeight+12;
    });

    ctx.fillStyle='#335c52';
    ctx.font='18px Segoe UI';
    wrap(ctx,'Entregar la carga no significa ignorar lo que ocurre. Significa distinguir lo que no puedes controlar de la respuesta que todavía puedes elegir.',70,h-82,w-140,26);

    var a=document.createElement('a');
    a.href=c.toDataURL('image/png');
    a.download='Mi_Recordatorio_De_Hoy_Capitulo_1.png';
    a.click();
    ai('✅ Tu tarjeta visual PNG se descargó correctamente.',['📖 Volver al libro','🔄 Repetir la experiencia']);
}

// ---- FUNCIÓN wrap (se mantiene igual) ----
function wrap(ctx,text,x,y,max,line){
    var words=String(text).replace(/\n/g,' \n ').split(' ');
    var current='';
    for(var i=0;i<words.length;i++){
        var wd=words[i];
        if(wd==='\n'){ctx.fillText(current,x,y);current='';y+=line;continue;}
        var test=current+wd+' ';
        if(ctx.measureText(test).width>max&&current){ctx.fillText(current,x,y);current=wd+' ';y+=line;}
        else current=test;
    }
    if(current)ctx.fillText(current,x,y);
}

function round(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
