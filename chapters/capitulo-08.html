<style>
:root{--bg1:#101820;--bg2:#26343b;--bg3:#3a2f2c;--paper:#fffaf3;--paper2:#f4eee8;--ink:#2a211e;--muted:#7b6b64;--gold:#ddc2a3;--gold2:#a97959;--line:#e5d0bd;--shadow:0 40px 90px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;width:100%}body{font-family:'Segoe UI',Tahoma,Verdana,sans-serif;min-height:100dvh;background:linear-gradient(145deg,var(--bg1),var(--bg2) 52%,var(--bg3));display:flex;align-items:center;justify-content:center;color:var(--ink);overflow:hidden;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}.wrap{width:100%;max-width:min(96vw,980px);height:min(96dvh,940px);display:flex}.app{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;background:rgba(255,250,243,.985);border-radius:30px;box-shadow:var(--shadow);border:1px solid rgba(221,194,163,.38)}.head{padding:15px 18px 12px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);background:rgba(255,250,243,.92);flex-shrink:0}.avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:radial-gradient(circle at 35% 25%,#fff0de,#ddc2a3 50%,#8d6047);box-shadow:0 0 18px rgba(221,194,163,.65)}.info{flex:1;min-width:0}.info h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info p{font-size:11.5px;color:var(--muted)}.tools{display:flex;gap:6px}.tool{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#f4eee8;cursor:pointer;font-size:14px}.barwrap{height:4px;background:#eadbd0;flex-shrink:0}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .3s ease}.msgs{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:clamp(12px,2vw,22px) clamp(14px,2.4vw,30px) clamp(90px,11vh,140px);display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}.m{max-width:min(98%,860px);padding:clamp(11px,1.8vw,16px) clamp(14px,2vw,20px);border-radius:18px;font-size:clamp(14px,1.7vw,17px);line-height:1.85;overflow-wrap:anywhere}.ai{background:var(--paper2);align-self:flex-start;border-bottom-left-radius:5px}.user{background:var(--gold);align-self:flex-end;border-bottom-right-radius:5px}.sys{background:#fff0df;border:1px solid var(--line);align-self:center;text-align:center;font-size:12.5px;color:#74513d}.panel{background:#fff6ee;border:1px solid var(--line);align-self:stretch;max-width:100%}.typing{background:var(--paper2);color:#7b6b64;align-self:flex-start;font-size:20px;letter-spacing:2px;min-width:58px;text-align:center}.opts{padding:8px 18px 10px;flex-shrink:0}.grid{display:none;flex-wrap:wrap;gap:7px;justify-content:center}.grid.show{display:flex}.opt{border:1.4px solid var(--line);border-radius:999px;padding:8px 13px;background:#f4eee8;color:#2a211e;font-weight:650;cursor:pointer}.input{padding:0 18px 12px;flex-shrink:0}.row{display:none;gap:8px;background:#f4eee8;border-radius:25px;padding:4px;border:1px solid transparent}.row.show{display:flex}.row:focus-within{border-color:var(--gold)}input{flex:1;background:transparent;border:0;outline:0;padding:11px 12px;font-size:14px}.send{border:0;border-radius:21px;background:var(--gold);font-weight:750;padding:10px 16px;cursor:pointer}.safe{font-size:11.3px;color:#7b6b64;text-align:center;padding:0 18px 9px;flex-shrink:0}.foot{padding:0 18px 12px;display:flex;gap:8px;justify-content:center;flex-shrink:0}.mini{border:0;background:transparent;color:#7b6b64;font-size:12px;cursor:pointer}.modal{position:fixed;inset:0;background:rgba(0,0,0,.52);display:none;align-items:center;justify-content:center;z-index:9;padding:18px}.modal.show{display:flex}.card{background:var(--paper);border-radius:24px;padding:22px;width:min(540px,100%);box-shadow:var(--shadow)}.card h2{font-size:20px;margin-bottom:10px}.card p{font-size:14px;line-height:1.65;color:#4a3730}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}.primary,.secondary{border:0;border-radius:14px;padding:10px 14px;cursor:pointer}.primary{background:var(--gold);font-weight:750}.secondary{background:#f4eee8}@media(max-width:540px){body{padding:0}.wrap{height:100dvh;max-width:100%}.app{border-radius:0}.head{padding:calc(12px + env(safe-area-inset-top)) 14px 10px}.msgs{padding:12px 14px calc(100px + env(safe-area-inset-bottom))}.m{font-size:14.6px}.tool{width:31px;height:31px}.opt{font-size:12px;padding:7px 11px}.foot{padding-bottom:calc(10px + env(safe-area-inset-bottom))}}

<body>
<div class="wrap"><main class="app"><header class="head"><div class="avatar">😊</div><div class="info"><h1>Mi Yo Interior</h1><p>Capítulo 8 · Perdonarte y comenzar nuevamente</p></div><div class="tools"><button class="tool" id="voice">🔈</button><button class="tool" id="amb">🎵</button><button class="tool" id="theme">🌙</button><button class="tool" id="speed">🐢</button></div></header><div class="barwrap"><div class="bar" id="bar"></div></div><section class="msgs" id="msgs"></section><section class="opts"><div class="grid" id="grid"></div></section><section class="input"><div class="row" id="row"><input id="txt"><button class="send" id="send">Enviar</button></div></section><p class="safe">Experiencia reflexiva y educativa. No reemplaza atención psicológica, médica, legal o financiera profesional.</p><footer class="foot"><button class="mini" id="reset">↺ Reiniciar</button><button class="mini" id="save">💾 Guardar</button><button class="mini" id="clear">🧹 Borrar</button></footer></main></div><div class="modal" id="modal"><div class="card"><h2 id="mt"></h2><p id="mb"></p><div class="actions" id="ma"></div></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id); const msgs=$('msgs'),grid=$('grid'),row=$('row'),txt=$('txt'),bar=$('bar');
let st={step:'welcome',name:'',hecho:'',condena:'',reescritura:'',reparacion:'',aprendizaje:'',paso:'',frase:'',history:[],voice:false,ambient:false,dark:false,slow:true};
const STEPS=['welcome','name','hecho','condena','pausaIntro','pausa','reescritura','reparacion','aprendizaje','paso','espejo','frase','fraseChange','fraseCustom','final'];
const CONFIRMAR=['Sí, quiero conservarla','Quiero cambiar una parte','Prefiero escribirla con mis palabras'];
const RISK=['suicidio','suicidarme','matarme','hacerme daño','no quiero vivir','autolesión','autolesion','abuso','violencia','emergencia','amenaza','peligro inmediato','daño','peligro','malestar intenso','presión grave','insegura','abuso'];
function clean(t){return String(t||'').replace(/<strong[^>]*data-lexical-text="true"[^>]*>/g,'<strong>').replace(/<em[^>]*data-lexical-text="true"[^>]*>/g,'<em>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/\n/g,'<br>')}
function progress(){let i=STEPS.indexOf(st.step);bar.style.width=Math.max(0,Math.round((i/(STEPS.length-1))*100))+'%'}
function scrollEnd(){requestAnimationFrame(()=>setTimeout(()=>msgs.scrollTo({top:msgs.scrollHeight,behavior:'smooth'}),80))}
function add(text,who='ai',extra=''){let d=document.createElement('div');d.className='m '+who+(extra?' '+extra:'');d.innerHTML=clean(text);msgs.appendChild(d);if(who!=='typing')st.history.push({who,text,extra});scrollEnd();return d}
function typing(){let d=document.createElement('div');d.className='m typing';d.textContent='...';msgs.appendChild(d);scrollEnd();return d}
function opts(arr=[]){grid.innerHTML='';if(!arr.length){grid.classList.remove('show');return}grid.classList.add('show');arr.forEach(o=>{let b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>handle(o);grid.appendChild(b)})}
function inputShow(show,ph='Escribe aquí...'){row.classList.toggle('show',!!show);txt.placeholder=ph;if(show)setTimeout(()=>txt.focus(),60)}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function readPause(text){let w=String(text||'').split(/\s+/).filter(Boolean).length;return st.slow?Math.min(10000,Math.max(2200,w*170)):Math.min(5000,Math.max(900,w*80))}
function splitText(text){return String(text||'').split(/\n\n+/).map(x=>x.trim()).filter(Boolean)}
function emptyBubble(extra=''){let d=document.createElement('div');d.className='m ai'+(extra?' '+extra:'');msgs.appendChild(d);scrollEnd();return d}
async function typeInto(el,text){let out='';for(let i=0;i<text.length;i++){let ch=text.charAt(i);out+=ch;el.innerHTML=clean(out);if(i%3===0)scrollEnd();let ms=st.slow?(ch==='.'?340:(ch==='?'?460:(ch==='!'?420:(ch===','?150:(ch===';'?170:(ch===':'?170:28)))))):(ch==='.'?180:(ch==='?'?260:(ch==='!'?240:(ch===','?85:12))));await wait(ms)}el.innerHTML=clean(text);scrollEnd()}
async function ai(text,buttons=[],input=false,ph='Escribe aquí...',extra=''){opts([]);inputShow(false);progress();let parts=splitText(text);for(let part of parts){let t=typing();await wait(st.slow?900:450);t.remove();let b=emptyBubble(extra);await typeInto(b,part);st.history.push({who:'ai',text:part,extra});speak(part);await wait(readPause(part))}opts(buttons);inputShow(input,ph);save(false)}
function speak(text){if(!st.voice||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text.replace(/[\*#•]/g,''));u.lang='es-CL';u.rate=.86;speechSynthesis.speak(u)}
function risk(text){let x=String(text).toLowerCase();if(RISK.some(r=>x.includes(r))){st.step='risk';ai('Lo que describes puede requerir apoyo humano confiable y apropiado. Esta experiencia no reemplaza apoyo profesional ni debe empujarte a exponerte a una situación insegura. Si hay peligro, abuso, presión grave o malestar intenso, detén el ejercicio y busca apoyo de una persona adulta de confianza o de un profesional adecuado.',['🌿 Volver al inicio']);return true}return false}
function handle(text){if(text.includes('Volver al inicio')||text.includes('Reiniciar'))return resetAll();add(text,'user');if(risk(text))return;process(String(text).trim())}
function construirFrase(){return 'Reconozco que '+st.hecho+'. Puedo '+st.reparacion+', conservar el aprendizaje '+st.aprendizaje+' y comenzar nuevamente mediante '+st.paso+', sin seguir definiéndome por un solo momento.'}
function process(text){switch(st.step){
case 'welcome':st.step='name';ai('😊 Hola. Soy **Mi Yo Interior**, el acompañante digital de este libro.\n\nNo justificaré lo ocurrido ni decidiré por ti cuándo debes perdonarte. Te ayudaré a reconocer qué responsabilidad permanece y qué condena ya no te ayuda a reparar.\n\n¿Cómo te gustaría que te llame?',[],true,'Escribe tu nombre o un apodo.');break;
case 'name':st.name=text;st.step='hecho';ai('Gracias, **'+st.name+'**.\n\nNo necesitas contar detalles que prefieras reservar. Describe solo lo necesario para comprender qué continúa pesando.\n\n📝 ¿Qué error, decisión o momento del pasado todavía utilizas para juzgarte?',[],true,'Todavía me juzgo por...');break;
case 'hecho':st.hecho=text;st.step='condena';ai('Has reconocido que todavía te juzgas por **'+st.hecho+'**.\n\nNo intentaremos borrarlo. Primero distinguiremos lo que ocurrió de lo que comenzaste a decir sobre ti a partir de aquello.\n\n💭 Cuando recuerdas ese momento, ¿qué frase te dices sobre ti?',[],true,'Me digo...');break;
case 'condena':st.condena=text;st.step='pausaIntro';ai('El hecho fue **'+st.hecho+'**, pero la frase que quedó fue: **“'+st.condena+'”**.\n\nObservaremos si esa frase describe una conducta concreta o si convirtió un momento en una definición completa de quién eres.',['🌿 Escribir, tachar y volver a escribir']);break;
case 'pausaIntro':st.step='pausa';ai('🌿 Toma una hoja y escribe la frase que acabas de reconocer. Si no tienes papel, escríbela en el campo de la pantalla.\n\nLéela una vez. Luego traza una sola línea sobre la palabra que te condena o te define para siempre. No borres toda la frase: deja visible que existió.\n\nDebajo, vuelve a escribirla describiendo el hecho sin convertirlo en tu identidad.\n\nEjemplo:\n\n**“Soy un fracaso”** puede convertirse en **“Tomé una decisión que tuvo consecuencias y necesito reconocer qué aprendí y qué aún puedo reparar.”**\n\nMira ambas frases. La primera castiga; la segunda conserva la responsabilidad y abre una respuesta.',['✅ He vuelto a escribir mi frase']);break;
case 'pausa':st.step='reescritura';ai('📝 Escribe ahora la nueva frase, describiendo el hecho sin convertirlo en tu identidad.',[],true,'La frase reescrita sería...');break;
case 'reescritura':st.reescritura=text;st.step='reparacion';ai('Has escrito una frase que conserva el hecho sin convertirlo en una condena permanente:\n\n**“'+st.reescritura+'”**\n\nAhora miremos qué responsabilidad útil permanece.\n\n🔍 Mirando el hecho con honestidad, ¿hay algo que todavía puedas reconocer, reparar o comunicar?',[],true,'Lo que todavía puedo hacer es...');break;
case 'reparacion':st.reparacion=text;if(text.toLowerCase().includes('no sé')||text.toLowerCase().includes('no se')){ai('No necesitas inventar una reparación inmediata.\n\nSi no puede repararse directamente, puedes identificar una forma presente de actuar de acuerdo con lo aprendido, sin prometer que eso borrará el daño o las consecuencias.',[],true,'Lo que todavía puedo hacer es...');st.step='reparacion';}else{st.step='aprendizaje';ai('Has reconocido que todavía puedes **'+st.reparacion+'**.\n\nPerdonarte no sustituye esa acción; puede ayudarte a realizarla sin seguir escondiéndote detrás del castigo.\n\n🌱 ¿Qué aprendiste de ese momento que deseas aplicar de una manera diferente desde ahora?',[],true,'Aprendí que...')}break;
case 'aprendizaje':st.aprendizaje=text;st.step='paso';ai('Tú mismo reconociste este aprendizaje: **'+st.aprendizaje+'**.\n\nLa experiencia no necesita seguir condenándote para que puedas conservar esa enseñanza.\n\n🚶 ¿Qué acción pequeña mostraría que estás comenzando nuevamente desde lo aprendido?',[],true,'Mi primer paso será...');break;
case 'paso':st.paso=text;st.step='espejo';ai('Tu primer paso será **'+st.paso+'**.\n\nNo cambia lo que ocurrió, pero muestra cómo has elegido responder hoy con lo que ahora comprendes.',['🪞 Continuar a devolución espejo']);break;
case 'espejo':st.step='frase';ai('🪞 Quiero devolverte lo que tú mismo reconociste, **'+st.name+'**.\n\nTodavía te juzgabas por **'+st.hecho+'** y te decías **“'+st.condena+'”**. Al escribirla nuevamente, separaste lo sucedido de una definición permanente sobre ti.\n\nReconociste que aún puedes **'+st.reparacion+'**, que deseas conservar el aprendizaje **'+st.aprendizaje+'** y que comenzarás mediante **'+st.paso+'**.\n\nLa respuesta no apareció fuera de ti. Surgió cuando decidiste conservar la responsabilidad y dejar de usar el castigo como única forma de recordar.',['❤️ Crear mi frase personal']);break;
case 'frase':st.frase=construirFrase();st.step='confirmar';ai('❤️ Con tus propias respuestas, tu frase podría ser:\n\n**“'+st.frase+'”**\n\n¿Esta frase representa lo que descubriste?',CONFIRMAR,false,'','panel');break;
case 'confirmar':if(text.includes('conservar'))closing();else if(text.includes('cambiar')){st.step='fraseChange';ai('📝 ¿Qué parte quieres cambiar?',[],true,'Quiero cambiar...')}else{st.step='fraseCustom';ai('📝 Escribe tu frase con tus palabras. Puedo mejorar la claridad, pero no debo minimizar el hecho, imponer el perdón, asegurar que otras personas perdonarán ni inventar una reparación que no expresaste.',[],true,'Mi frase personal es...')}break;
case 'fraseChange':st.frase=reform(text);closing();break;
case 'fraseCustom':st.frase=reform(text);closing();break;
case 'final':if(text.includes('Guardar'))downloadText();else if(text.includes('tarjeta'))downloadPNG();else if(text.includes('Volver al libro'))thanksNext();else if(text.includes('pausa')){st.step='pausaIntro';process('x')}else ai('Puedes elegir una de las opciones finales.',['📖 Volver al libro','💾 Guardar mi reflexión','🖼️ Descargar tarjeta visual PNG','🌿 Repetir la pausa']);break;
case 'thanks':resetAll();break;default:resetAll();}}
function reform(text){let x=String(text||'').trim();return x?(/[.!?]$/.test(x)?x:x+'.'):st.frase}
function closing(){st.step='final';ai('🙏 Has terminado esta experiencia, **'+st.name+'**.\n\nHoy no borraste **'+st.hecho+'**. Reconociste **'+st.reparacion+'** y elegiste conservar **'+st.aprendizaje+'**.\n\nTu nuevo comienzo será: **'+st.paso+'**.\n\nTu frase personal es:\n\n**“'+st.frase+'”**\n\nCuando vuelva la frase que te condenaba, recuerda la línea que trazaste sobre ella. El hecho puede seguir siendo parte de tu historia sin convertirse en toda tu identidad.\n\n📚 **Próximo capítulo:** Capítulo 9, **Reconocer las señales con discernimiento**. Ahí podrás escuchar tu intuición sin renunciar a la realidad y la evidencia.',['📖 Volver al libro','💾 Guardar mi reflexión','🖼️ Descargar tarjeta visual PNG','🌿 Repetir la pausa'])}
function thanksNext(){st.step='thanks';ai('🙏 Gracias por completar la experiencia del **Capítulo 8: Perdonarte y comenzar nuevamente**.\n\nHoy separaste un hecho de una condena permanente, reconociste una responsabilidad útil y definiste un primer paso desde lo aprendido.\n\nCuando regreses al libro, completa el cierre del capítulo con calma.\n\n📚 **Próximo capítulo:** Capítulo 9, **Reconocer las señales con discernimiento**. Ahí podrás escuchar tu intuición sin renunciar a la realidad y la evidencia.',['🏠 Ir al inicio'])}
function record(){return 'MI NUEVO COMIENZO\n\nEl hecho por el que todavía me juzgaba:\n'+st.hecho+'\n\nLa frase con la que me condenaba:\n'+st.condena+'\n\nLa frase reescrita:\n'+st.reescritura+'\n\nLo que aún puedo reconocer o reparar:\n'+st.reparacion+'\n\nEl aprendizaje que deseo conservar:\n'+st.aprendizaje+'\n\nMi primer paso:\n'+st.paso+'\n\nMi frase personal:\n'+st.frase}
function downloadText(){let blob=new Blob([record()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Mi_Nuevo_Comienzo_Capitulo_8.txt';a.click();URL.revokeObjectURL(url);ai('✅ Tu reflexión se descargó como archivo de texto. También puedes descargar la tarjeta visual PNG.',['🖼️ Descargar tarjeta visual PNG','📖 Volver al libro','🌿 Repetir la pausa'])}

// ---- NUEVA FUNCIÓN downloadPNG CON ALTURA DINÁMICA ----
function downloadPNG(){
    var c=document.createElement('canvas');
    var scale=2;
    var w=1000;

    function countLines(text,maxWidth,fontSize){
        var ctx=document.createElement('canvas').getContext('2d');
        ctx.font=fontSize+'px Segoe UI';
        var words=String(text).replace(/\n/g,' \n ').split(' ');
        var lines=0,current='';
        for(var i=0;i<words.length;i++){
            var wd=words[i];
            if(wd==='\n'){lines++;current='';continue;}
            var test=current+wd+' ';
            if(ctx.measureText(test).width>maxWidth&&current){lines++;current=wd+' ';}
            else current=test;
        }
        if(current)lines++;
        return Math.max(lines,1);
    }

    var lineHeight=25;
    var maxWidth=w-140-44;
    var fields=[
        {title:'El hecho por el que todavía me juzgaba',text:st.hecho},
        {title:'La frase con la que me condenaba',text:st.condena},
        {title:'La frase reescrita',text:st.reescritura,featured:true},
        {title:'Lo que aún puedo reconocer o reparar',text:st.reparacion},
        {title:'El aprendizaje que deseo conservar',text:st.aprendizaje},
        {title:'Mi primer paso',text:st.paso,featured:true},
        {title:'Mi frase personal',text:st.frase,featured:true}
    ];

    var h=190;
    fields.forEach(function(f){
        var isFeatured=f.featured||false;
        var fontSize=isFeatured?21:17;
        var lines=countLines(f.text,maxWidth,fontSize);
        h+=32+30+(lines*lineHeight)+10+12;
    });
    h+=120;
    h=Math.max(1320,h);

    c.width=w*scale;
    c.height=h*scale;
    var ctx=c.getContext('2d');
    ctx.scale(scale,scale);

    ctx.fillStyle='#fffaf3';
    round(ctx,0,0,w,h,34);
    ctx.fill();

    ctx.fillStyle='#f4eee8';
    round(ctx,36,36,w-72,h-72,28);
    ctx.fill();
    ctx.strokeStyle='#ddc2a3';
    ctx.lineWidth=2;
    ctx.stroke();

    ctx.fillStyle='#2a211e';
    ctx.font='700 40px Segoe UI';
    ctx.fillText('Mi nuevo comienzo',70,105);
    ctx.font='17px Segoe UI';
    ctx.fillStyle='#7b6b64';
    ctx.fillText('Mi Yo Interior - Capítulo 8: Perdonarte y comenzar nuevamente',70,138);

    var y=190;
    var x=70;
    var fieldWidth=w-140;

    fields.forEach(function(f){
        var isFeatured=f.featured||false;
        var fontSize=isFeatured?21:17;
        var lines=countLines(f.text,maxWidth,fontSize);
        var boxHeight=32+30+(lines*lineHeight)+10;

        ctx.fillStyle=isFeatured?'#ead0bd':'#fffaf3';
        round(ctx,x,y,fieldWidth,boxHeight,20);
        ctx.fill();
        ctx.strokeStyle='#ddc2a3';
        ctx.lineWidth=1.5;
        ctx.stroke();

        ctx.fillStyle='#7a4f3a';
        ctx.font='700 19px Segoe UI';
        ctx.fillText(f.title,x+22,y+32);

        ctx.fillStyle='#2a211e';
        ctx.font=(isFeatured?'700 ':'')+fontSize+'px Segoe UI';
        wrap(ctx,String(f.text||'No especificado'),x+22,y+62,maxWidth,lineHeight);

        y+=boxHeight+12;
    });

    ctx.fillStyle='#7a4f3a';
    ctx.font='18px Segoe UI';
    wrap(ctx,'Perdonarte no significa negar lo ocurrido. Significa asumir lo que corresponde, aprender y permitirte responder de una manera nueva sin convertir un error en una condena permanente.',70,h-82,w-140,26);

    var a=document.createElement('a');
    a.href=c.toDataURL('image/png');
    a.download='Mi_Nuevo_Comienzo_Capitulo_8.png';
    a.click();
    ai('✅ Tu tarjeta visual PNG se descargó correctamente.',['📖 Volver al libro','🌿 Repetir la pausa']);
}

// ---- FUNCIÓN wrap (se mantiene igual) ----
function wrap(ctx,text,x,y,max,line){
    var words=String(text).replace(/\n/g,' \n ').split(' ');
    var current='';
    for(var i=0;i<words.length;i++){
        var wd=words[i];
        if(wd==='\n'){ctx.fillText(current,x,y);current='';y+=line;continue;}
        var test=current+wd+' ';
        if(ctx.measureText(test).width>max&&current){ctx.fillText(current,x,y);current=wd+' ';y+=line;}
        else current=test;
    }
    if(current)ctx.fillText(current,x,y);
}

function round(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
