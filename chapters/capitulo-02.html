*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;width:100%}body{font-family:'Segoe UI',Tahoma,Verdana,sans-serif;min-height:100dvh;background:linear-gradient(145deg,var(--bg1),var(--bg2) 52%,var(--bg3));display:flex;align-items:center;justify-content:center;color:var(--ink);overflow:hidden;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}.wrap{width:100%;max-width:min(96vw,980px);height:min(96dvh,940px);display:flex}.app{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;background:rgba(255,250,243,.985);border-radius:30px;box-shadow:var(--shadow);border:1px solid rgba(215,189,138,.35)}.head{padding:15px 18px 12px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);background:rgba(255,250,243,.92);flex-shrink:0}.avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:radial-gradient(circle at 35% 25%,#fff4cc,#d7bd8a 50%,#7c5731);box-shadow:0 0 18px rgba(215,189,138,.65)}.info{flex:1;min-width:0}.info h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info p{font-size:11.5px;color:var(--muted)}.tools{display:flex;gap:6px}.tool{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#f3eadf;cursor:pointer;font-size:14px}.barwrap{height:4px;background:#eadfc9;flex-shrink:0}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .3s ease}.msgs{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:clamp(12px,2vw,22px) clamp(14px,2.4vw,30px) clamp(90px,11vh,140px);display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}.m{max-width:min(98%,860px);padding:clamp(11px,1.8vw,16px) clamp(14px,2vw,20px);border-radius:18px;font-size:clamp(14px,1.7vw,17px);line-height:1.85;overflow-wrap:anywhere}.ai{background:var(--pa ry{background:#f3eadf}@media(max-width:540px){body{padding:0}.wrap{height:100dvh;max-width:100%}.app{border-radius:0}.head{padding:calc(12px + env(safe-area-inset-top)) 14px 10px}.msgs{padding:12px 14px calc(100px + env(safe-area-inset-bottom))}.m{font-size:14.6px}.tool{width:31px;height:31px}.opt{font-size:12px;padding:7px 11px}.foot{padding-bottom:calc(10px + env(safe-area-inset-bottom))}}

<body>
<div class="wrap"><main class="app"><header class="head"><div class="avatar">😊</div><div class="info"><h1>Mi Yo Interior</h1><p>Capítulo 2 · Las palabras que te construyen</p></div><div class="tools"><button class="tool" id="voice">🔈</button><button class="tool" id="amb">🎵</button><button class="tool" id="theme">🌙</button><button class="tool" id="speed">🐢</button></div></header><div class="barwrap"><div class="bar" id="bar"></div></div><section class="msgs" id="msgs"></section><section class="opts"><div class="grid" id="grid"></div></section><section class="input"><div class="row" id="row"><input id="txt"><button class="send" id="send">Enviar</button></div></section><p class="safe">Experiencia reflexiva y educativa. No reemplaza atención psicológica, médica, legal o financiera profesional.</p><footer class="foot"><button class="mini" id="reset">↺ Reiniciar</button><button class="mini" id="save">💾 Guardar</button><button class="mini" id="clear">🧹 Borrar</button></footer></main></div><div class="modal" id="modal"><div class="card"><h2 id="mt"></h2><p id="mb"></p><div class="actions" id="ma"></div></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id); const msgs=$('msgs'),grid=$('grid'),row=$('row'),txt=$('txt'),bar=$('bar');
let st={step:'welcome',name:'',fraseOriginal:'',efecto:'',palabraLimite:'',palabraPuente:'',hecho:'',evidencia:'',fraseNueva:'',history:[],voice:false,ambient:false,dark:false,slow:true};
const STEPS=['welcome','name','fraseOriginal','efecto','efectoCustom','pausaIntro','palabraLimite','palabraPuente','palabraPuenteCustom','transformar','hecho','evidencia','crear','confirmar','fraseChange','fraseCustom','final'];
const EFECTOS=['Me hace dudar','Me quita las ganas de intentarlo','Me exige demasiado','Me hace sentir que nunca es suficiente','Me lleva a compararme','Me ayuda a reconocer algo que necesito mejorar','Produce otro efecto','Escribir otra'];
const PUENTES=['todavía','a veces','en esta situación','estoy aprendiendo','Yo puedo, sé que puedo','necesito ayuda para','Escribir otra'];
const CONFIRMAR=['Sí, quiero conservarla','Quiero cambiar una palabra','Prefiero escribirla a mi manera'];
const RISK=['suicidio','suicidarme','matarme','hacerme daño','no quiero vivir','autolesión','autolesion','abuso','violencia','emergencia','amenaza','peligro inmediato'];
function clean(t){return String(t||'').replace(/<strong[^>]*data-lexical-text="true"[^>]*>/g,'<strong>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/\n/g,'<br>')}
function progress(){let i=STEPS.indexOf(st.step);bar.style.width=Math.max(0,Math.round((i/(STEPS.length-1))*100))+'%'}
function scrollEnd(){requestAnimationFrame(()=>setTimeout(()=>msgs.scrollTo({top:msgs.scrollHeight,behavior:'smooth'}),80))}
function add(text,who='ai',extra=''){let d=document.createElement('div');d.className='m '+who+(extra?' '+extra:'');d.innerHTML=clean(text);msgs.appendChild(d);if(who!=='typing')st.history.push({who,text,extra});scrollEnd();return d}
function typing(){let d=document.createElement('div');d.className='m typing';d.textContent='...';msgs.appendChild(d);scrollEnd();return d}
function opts(arr=[]){grid.innerHTML='';if(!arr.length){grid.classList.remove('show');return}grid.classList.add('show');arr.forEach(o=>{let b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>handle(o);grid.appendChild(b)})}
function inputShow(show,ph='Escribe aquí...'){row.classList.toggle('show',!!show);txt.placeholder=ph;if(show)setTimeout(()=>txt.focus(),60)}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function readPause(text){let w=String(text||'').split(/\s+/).filter(Boolean).length;return st.slow?Math.min(10000,Math.max(2200,w*170)):Math.min(5000,Math.max(900,w*80))}
function splitText(text){return String(text||'').split(/\n\n+/).map(x=>x.trim()).filter(Boolean)}
function emptyBubble(extra=''){let d=document.createElement('div');d.className='m ai'+(extra?' '+extra:'');msgs.appendChild(d);scrollEnd();return d}
async function typeInto(el,text){let out='';for(let i=0;i<text.length;i++){let ch=text.charAt(i);out+=ch;el.innerHTML=clean(out);if(i%3===0)scrollEnd();let ms=st.slow?(ch==='.'?340:(ch==='?'?460:(ch==='!'?420:(ch===','?150:(ch===';'?170:(ch===':'?170:28)))))):(ch==='.'?180:(ch==='?'?260:(ch==='!'?240:(ch===','?85:12))));await wait(ms)}el.innerHTML=clean(text);scrollEnd()}
async function ai(text,buttons=[],input=false,ph='Escribe aquí...',extra=''){opts([]);inputShow(false);progress();let parts=splitText(text);for(let part of parts){let t=typing();await wait(st.slow?900:450);t.remove();let b=emptyBubble(extra);await typeInto(b,part);st.history.push({who:'ai',text:part,extra});speak(part);await wait(readPause(part))}opts(buttons);inputShow(input,ph);save(false)}
function speak(text){if(!st.voice||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text.replace(/[\*#•]/g,''));u.lang='es-CL';u.rate=.86;speechSynthesis.speak(u)}
function risk(text){let x=String(text).toLowerCase();if(RISK.some(r=>x.includes(r))){st.step='risk';ai('Lo que estás expresando requiere apoyo humano inmediato. Este acompañamiento digital no puede resolver emergencias ni reemplazar ayuda profesional. Busca ahora una persona adulta de confianza, un profesional o el servicio de emergencia de tu ubicación.',['🌿 Volver al inicio']);return true}return false}
function handle(text){if(text.includes('Volver al inicio')||text.includes('Reiniciar'))return resetAll();add(text,'user');if(risk(text))return;process(String(text).trim())}
function construirFrase(){let hecho=st.hecho||'esta dificultad';let evidencia=st.evidencia||'puedo observarla con más claridad';let base='Aunque '+hecho+', también '+evidencia+', y ahora puedo hablarme de una manera más justa y seguir aprendiendo.';if(st.palabraPuente&&st.palabraPuente!=='Escribir otra'){base='Aunque '+hecho+', también '+evidencia+', y ahora puedo recordarme: '+st.palabraPuente+'.'}return base}
function process(text){switch(st.step){
case 'welcome':st.step='name';ai('😊 Hola. Soy **Mi Yo Interior**, el acompañante digital de este libro.\n\nNo te diré quién eres. Te ayudaré a escuchar cómo te estás describiendo para que tú decidas qué palabras deseas conservar y cuáles necesitas transformar.\n\n¿Cómo te gustaría que te llame?',[],true,'Escribe tu nombre o un apodo.');break;
case 'name':st.name=text;st.step='fraseOriginal';ai('Gracias, **'+st.name+'**.\n\nComencemos con una frase que quizás aparece con frecuencia en tus pensamientos.\n\n💭 Cuando algo no resulta como esperabas, ¿qué frase sueles decirte?',[],true,'Cuando algo no resulta, me digo...');break;
case 'fraseOriginal':st.fraseOriginal=text;st.step='efecto';ai('La frase que reconociste fue:\n\n**“'+st.fraseOriginal+'”**\n\nNo vamos a discutirla ni a reemplazarla de inmediato. Primero observaremos qué efecto produce en ti.\n\n🔍 Cuando te dices **“'+st.fraseOriginal+'”**, ¿qué provoca generalmente en ti?',EFECTOS);break;
case 'efecto':if(text==='Escribir otra'||text==='Produce otro efecto'){st.step='efectoCustom';ai('✍️ Puedes escribir con tus propias palabras qué efecto produce esa frase en ti.',[],true,'Esa frase provoca...')}else{st.efecto=text;st.step='pausaIntro';ai('Has notado que esa frase **'+st.efecto+'**.\n\nEso no significa que debas ignorar tus errores o dificultades. Significa que puedes buscar palabras que te ayuden a comprenderlos sin convertirlos en una definición permanente de ti.',['🌿 Iniciar pausa'])}break;
case 'efectoCustom':st.efecto=text;st.step='pausaIntro';ai('Has notado que esa frase **'+st.efecto+'**.\n\nEso no significa que debas ignorar tus errores o dificultades. Significa que puedes buscar palabras que te ayuden a comprenderlos sin convertirlos en una definición permanente de ti.',['🌿 Iniciar pausa']);break;
case 'pausaIntro':st.step='palabraLimite';ai('🌿 Lee lentamente la frase que escribiste:\n\n**“'+st.fraseOriginal+'”**\n\nAhora escúchala como si alguien te la dijera cada vez que intentas avanzar.\n\n¿Cuál es la palabra que más te limita, te juzga o presenta la dificultad para hacer algo?',[],true,'La palabra es...');break;
case 'palabraLimite':st.palabraLimite=text;st.step='palabraPuente';ai('La palabra que seleccionaste fue: **'+st.palabraLimite+'**.\n\nRepite la frase una vez más. Esta vez, detente antes de pronunciar **“'+st.palabraLimite+'”**.\n\nDeja un pequeño silencio en su lugar.\n\nDate un minuto...\n\nLuego prueba cambiarla por una palabra que abra una posibilidad más realista.\n\nNo busques una frase perfecta ni exageradamente positiva. Busca una frase que puedas creer.',PUENTES);break;
case 'palabraPuente':if(text==='Escribir otra'){st.step='palabraPuenteCustom';ai('✍️ Escribe la palabra o expresión que abre una posibilidad más realista para ti.',[],true,'Mi palabra o expresión es...')}else{st.palabraPuente=text;st.step='transformar';ai('Elegiste **'+st.palabraPuente+'** como una posibilidad más realista.\n\nCuando estés listo, avanzaremos a transformar la frase desde un hecho concreto.',['✨ Quiero transformar mi frase'])}break;
case 'palabraPuenteCustom':st.palabraPuente=text;st.step='transformar';ai('Elegiste **'+st.palabraPuente+'** como una posibilidad más realista.\n\nCuando estés listo, avanzaremos a transformar la frase desde un hecho concreto.',['✨ Quiero transformar mi frase']);break;
case 'transformar':st.step='hecho';ai('📝 ¿Qué hecho concreto hizo aparecer esa frase, con la que comenzamos?',[],true,'La frase apareció porque...');break;
case 'hecho':st.hecho=text;st.step='evidencia';ai('Ocurrió **'+st.hecho+'** y a partir de eso te dijiste **“'+st.fraseOriginal+'”**.\n\nPero el hecho describe una experiencia. No necesariamente describe todo lo que eres.\n\n🔍 ¿Recuerdas alguna ocasión en la que actuaste de una manera diferente a lo que afirma tu frase?',[],true,'Una ocasión fue...');break;
case 'evidencia':st.evidencia=text;st.step='crear';if(text.toLowerCase().includes('no sé')||text.toLowerCase().includes('no se')){ai('No necesitas recordar un gran logro.\n\nPiensa en una ocasión pequeña en la que lo intentaste, aprendiste algo, pediste ayuda o continuaste a pesar de la dificultad.\n\nSi ahora no aparece una experiencia, trabajaremos con el hecho de que una dificultad presente no permite predecir todo lo que serás capaz de hacer después.',['➡️ Continuar'])}else{ai('Tú mismo encontraste una evidencia importante: **'+st.evidencia+'**.\n\nEso muestra que **“'+st.fraseOriginal+'”** no cuenta la historia completa.\n\n✨ Ahora construiremos una frase más justa con lo que has expresado.',['➡️ Continuar'])}break;
case 'crear':st.fraseNueva=construirFrase();st.step='confirmar';ai('✨ Con lo que tú mismo expresaste, podemos transformar:\n\n**“'+st.fraseOriginal+'”**\n\nen una frase más justa:\n\n**“'+st.fraseNueva+'”**\n\n¿Esta nueva frase representa mejor lo que descubriste?',CONFIRMAR,false,'','panel');break;
case 'confirmar':if(text.includes('conservar')){mirror()}else if(text.includes('cambiar')){st.step='fraseChange';ai('📝 Escribe solo la palabra que quieres cambiar y la nueva palabra que quieres usar.',[],true,'Cambiar... por...')}else{st.step='fraseCustom';ai('📝 Escribe tu frase a tu manera. La mantendremos clara, creíble y sin convertir la dificultad en una etiqueta personal.',[],true,'Mi nueva frase es...')}break;
case 'fraseChange':st.fraseNueva=reform(text);mirror();break;
case 'fraseCustom':st.fraseNueva=reform(text);mirror();break;
case 'final':if(text.includes('Guardar'))downloadText();else if(text.includes('tarjeta'))downloadPNG();else if(text.includes('Volver al libro'))thanksNext();else if(text.includes('pausa')){st.step='pausaIntro';process('x')}else if(text.includes('otra frase'))resetAll();else ai('Puedes elegir una de las opciones finales.',['📖 Volver al libro','💾 Guardar mi nueva frase','🖼️ Descargar tarjeta visual PNG','🌿 Repetir la pausa','🔄 Transformar otra frase']);break;
case 'thanks':resetAll();break;default:resetAll();}}
function mirror(){st.step='final';ai('🪞 Quiero devolverte lo que tú mismo reconociste, **'+st.name+'**.\n\nCuando ocurrió **'+st.hecho+'**, te dijiste **“'+st.fraseOriginal+'”**, y esas palabras hicieron que **'+st.efecto+'**.\n\nSin embargo, también recordaste **'+st.evidencia+'**.\n\nPor eso descubriste que aquella frase no explicaba toda tu historia. Tu experiencia puede expresarse de una manera más completa y justa:\n\n**“'+st.fraseNueva+'”**\n\nLa nueva respuesta no vino de mí. Se construyó con el hecho, la evidencia y las palabras que tú mismo elegiste.\n\n❤️ Has terminado esta experiencia.\n\nHoy no intentaste esconder una dificultad ni convencerte de algo que no sientes.\n\nEscuchaste una frase que repetías, reconociste su efecto y cambiaste una palabra absoluta por una posibilidad más real.\n\nCuando vuelva a aparecer **“'+st.fraseOriginal+'”**, puedes detenerte y preguntarte:\n\n**¿Esto describe un momento o define todo lo que soy?**\n\nTu frase personal es:\n\n**“'+st.fraseNueva+'”**',['📖 Volver al libro','💾 Guardar mi nueva frase','🖼️ Descargar tarjeta visual PNG','🌿 Repetir la pausa','🔄 Transformar otra frase'])}
function reform(text){let x=String(text||'').trim();return x?(/[.!?]$/.test(x)?x:x+'.'):st.fraseNueva}
function thanksNext(){st.step='thanks';ai('🙏 Gracias por completar la experiencia del **Capítulo 2: Las palabras que te construyen**.\n\nHoy escuchaste una frase que repetías, reconociste su efecto y cambiaste una palabra absoluta por una posibilidad más real.\n\nCuando regreses al libro, completa el cierre del capítulo con calma.\n\n📚 **Próximo capítulo:** Capítulo 3, **Escuchar el miedo sin obedecerlo**. Ahí podrás observar un miedo concreto sin negarlo ni entregarle la dirección de tus decisiones.',['🏠 Ir al inicio'])}
function record(){return 'LAS PALABRAS QUE ELIJO\n\nLa frase que solía repetirme:\n'+st.fraseOriginal+'\n\nEl hecho que la hizo aparecer:\n'+st.hecho+'\n\nEl efecto que producía en mí:\n'+st.efecto+'\n\nLa palabra que decidí cambiar:\n'+st.palabraLimite+'\n\nLa palabra o posibilidad elegida:\n'+st.palabraPuente+'\n\nLa evidencia que yo mismo encontré:\n'+st.evidencia+'\n\nMi nueva manera de hablarme:\n'+st.fraseNueva}
function downloadText(){let blob=new Blob([record()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Las_Palabras_Que_Elijo_Capitulo_2.txt';a.click();URL.revokeObjectURL(url);ai('✅ Tu nueva frase se descargó como archivo de texto. También puedes descargar la tarjeta visual PNG.',['🖼️ Descargar tarjeta visual PNG','📖 Volver al libro','🔄 Transformar otra frase'])}
function downloadPNG(){let c=document.createElement('canvas'),scale=2,w=1000,h=1320;c.width=w*scale;c.height=h*scale;let ctx=c.getContext('2d');ctx.scale(scale,scale);ctx.fillStyle='#fffaf3';round(ctx,0,0,w,h,34);ctx.fill();ctx.fillStyle='#f3eadf';round(ctx,36,36,w-72,h-72,28);ctx.fill();ctx.strokeStyle='#d7bd8a';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#2a2118';ctx.font='700 40px Segoe UI';ctx.fillText('Las palabras que elijo',70,105);ctx.font='17px Segoe UI';ctx.fillStyle='#7f6d5a';ctx.fillText('Mi Yo Interior - Capitulo 2: Las palabras que te construyen',70,138);let y=190;box(ctx,'La frase que solía repetirme',st.fraseOriginal,70,y,w-140);y+=155;box(ctx,'El hecho que la hizo aparecer',st.hecho,70,y,w-140);y+=155;box(ctx,'El efecto que producía en mí',st.efecto,70,y,w-140);y+=155;box(ctx,'La palabra que decidí cambiar',st.palabraLimite,70,y,w-140);y+=145;box(ctx,'La palabra o posibilidad elegida',st.palabraPuente,70,y,w-140);y+=145;box(ctx,'La evidencia que yo mismo encontré',st.evidencia,70,y,w-140);y+=170;box(ctx,'Mi nueva manera de hablarme',st.fraseNueva,70,y,w-140,true);ctx.fillStyle='#7c5731';ctx.font='18px Segoe UI';wrap(ctx,'Una experiencia puede mostrar algo que necesito aprender, pero no tiene que convertirse en una sentencia sobre quién soy.',70,h-92,w-140,26);let a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='Las_Palabras_Que_Elijo_Capitulo_2.png';a.click();ai('✅ Tu tarjeta visual PNG se descargó correctamente.',['📖 Volver al libro','🔄 Transformar otra frase'])}
function box(ctx,title,text,x,y,w,featured){ctx.fillStyle=featured?'#ead7ae':'#fffaf3';round(ctx,x,y,w,118,20);ctx.fill();ctx.strokeStyle='#d7bd8a';ctx.stroke();ctx.fillStyle='#7c5731';ctx.font='700 19px Segoe UI';ctx.fillText(title,x+22,y+32);ctx.fillStyle='#2a2118';ctx.font=featured?'700 21px Segoe UI':'17px Segoe UI';wrap(ctx,String(text||'No especificado'),x+22,y+62,w-44,25)}
function wrap(ctx,text,x,y,max,line){let words=String(text).replace(/\n/g,' \n ').split(' '),l='';for(let wd of words){if(wd==='\n'){ctx.fillText(l,x,y);l='';y+=line;continue}let test=l+wd+' ';if(ctx.measureText(test).width>max&&l){ctx.fillText(l,x,y);l=wd+' ';y+=line}else l=test}if(l)ctx.fillText(l,x,y)}
function round(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function save(show){localStorage.setItem('miYoInteriorCap2V5GuionCorregido',JSON.stringify(st));if(show)modal('Progreso guardado','Tu avance quedó guardado en este dispositivo.',[['Aceptar',closeModal,'primary']])}
function load(){try{return JSON.parse(localStorage.getItem('miYoInteriorCap2V5GuionCorregido')||'null')}catch(e){return null}}
function resetAll(){let v=st.voice,a=st.ambient,d=st.dark,s=st.slow;st={step:'welcome',name:'',fraseOriginal:'',efecto:'',palabraLimite:'',palabraPuente:'',hecho:'',evidencia:'',fraseNueva:'',history:[],voice:v,ambient:a,dark:d,slow:s};msgs.innerHTML='';opts([]);inputShow(false);start()}
function modal(t,b,acts){$('mt').textContent=t;$('mb').textContent=b;let ma=$('ma');ma.innerHTML='';acts.forEach(act=>{let bt=document.createElement('button');bt.textContent=act[0];bt.className=act[2]==='primary'?'primary':'secondary';bt.onclick=act[1];ma.appendChild(bt)});$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
let audioCtx=null;function ambient(){if(st.ambient){st.ambient=false;$('amb').textContent='🎵';if(audioCtx){audioCtx.close();audioCtx=null}return}st.ambient=true;$('amb').textContent='🎶';audioCtx=new (window.AudioContext||window.webkitAudioContext)();let osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.frequency.value=174;osc.type='sine';gain.gain.value=.018;osc.connect(gain);gain.connect(audioCtx.destination);osc.start()}
function voice(){st.voice=!st.voice;$('voice').textContent=st.voice?'🔊':'🔈';if(!st.voice&&'speechSynthesis'in window)speechSynthesis.cancel();save(false)}
function theme(){st.dark=!st.dark;document.body.style.filter=st.dark?'brightness(.82) contrast(1.05)':'none';save(false)}
function speed(){st.slow=!st.slow;$('speed').textContent=st.slow?'🐢':'🙂';save(false);modal('Velocidad de lectura',st.slow?'Modo pausado activado.':'Modo normal activado.',[['Aceptar',closeModal,'primary']])}
function start(){progress();add('Esta experiencia ofrece acompañamiento reflexivo y educativo. No reemplaza atención profesional.','sys');ai('🌿 **Bienvenido a Mi Yo Interior**\n\nHas llegado desde el capítulo **“Las palabras que te construyen”**.\n\nLas palabras que repites sobre ti pueden convertirse en una manera de mirarte. Algunas te ayudan a avanzar. Otras te hacen creer que una dificultad define todo lo que eres.\n\nEn esta breve experiencia escucharás una de esas frases y descubrirás una forma más justa de hablarte.',['✨ Comenzar','⏳ Volver más tarde'])}
$('send').onclick=()=>{let t=txt.value.trim();if(t){txt.value='';handle(t)}};txt.addEventListener('keydown',e=>{if(e.key==='Enter')$('send').click()});$('reset').onclick=resetAll;$('save').onclick=()=>save(true);$('clear').onclick=()=>{localStorage.removeItem('miYoInteriorCap2V5GuionCorregido');modal('Datos borrados','Se eliminó el progreso guardado en este dispositivo.',[['Aceptar',closeModal,'primary']])};$('amb').onclick=ambient;$('voice').onclick=voice;$('theme').onclick=theme;$('speed').onclick=speed;
window.onload=()=>{setTimeout(()=>{let s=load();if(s&&s.history&&s.history.length>2){modal('Encontré un progreso previo','Hay una experiencia guardada de este capítulo. Puedes continuar o iniciar nuevamente.',[['Iniciar de nuevo',()=>{closeModal();resetAll()},'secondary'],['Continuar',()=>{closeModal();st=s;msgs.innerHTML='';st.history.forEach(m=>add(m.text,m.who,m.extra||''));ai('Continuamos desde tu experiencia guardada. Puedes guardar tu frase, descargar tu tarjeta visual o transformar otra frase.',['💾 Guardar mi nueva frase','🖼️ Descargar tarjeta visual PNG','🔄 Transformar otra frase'])},'primary']])}else start()},300)};
</script>
