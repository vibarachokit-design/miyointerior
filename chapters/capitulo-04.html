<style>

*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;width:100%}body{font-family:'Segoe UI',Tahoma,Verdana,sans-serif;min-height:100dvh;background:linear-gradient(145deg,var(--bg1),var(--bg2) 52%,var(--bg3));display:flex;align-items:center;justify-content:center;color:var(--ink);overflow:hidden;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}.wrap{width:100%;max-width:min(96vw,980px);height:min(96dvh,940px);display:flex}.app{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;background:rgba(255,250,243,.985);border-radius:30px;box-shadow:var(--shadow);border:1px solid rgba(201,223,199,.38)}.head{padding:15px 18px 12px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);background:rgba(255,250,243,.92);flex-shrink:0}.avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:radial-gradient(circle at 35% 25%,#f7ffe9,#c9dfc7 50%,#4f7b67);box-shadow:0 0 18px rgba(201,223,199,.65)}.info{flex:1;min-width:0}.info h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info p{font-size:11.5px;color:var(--muted)}.tools{display:flex;gap:6px}.tool{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#eef4ed;cursor:pointer;font-size:14px}.barwrap{height:4px;background:#dcebd9;flex-shrink:0}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .3s ease}.msgs{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:clamp(12px,2vw,22px) clamp(14px,2.4vw,30px) clamp(90px,11vh,140px);display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}.m{max-width:min(98%,860px);padding:clamp(11px,1.8vw,16px) clamp(14px,2vw,20px);border-radius:18px;font-size:clamp(14px,1.7vw,17px);line-height:1.85;overflow-wrap:anywhere}.ai{background:var(--paper2);align-self:flex-start;border-bottom-left-radius:5px}.user{background:var(--gold);align-self:flex-end;border-bottom-right-radius:5px}.sys{background:#f4ffe8;border:1px solid var(--line);align-self:center;text-align:center;font-size:12.5px;color:#4d6349}.panel{background:#f7fff2;border:1px solid var(--line);align-self:stretch;max-width:100%}.typing{background:var(--paper2);color:#6f8179;align-self:flex-start;font-size:20px;letter-spacing:2px;min-width:58px;text-align:center}.opts{padding:8px 18px 10px;flex-shrink:0}.grid{display:none;flex-wrap:wrap;gap:7px;justify-content:center}.grid.show{display:flex}.opt{border:1.4px solid var(--line);border-radius:999px;padding:8px 13px;background:#eef4ed;color:#1f2b27;font-weight:650;cursor:pointer}.input{padding:0 18px 12px;flex-shrink:0}.row{display:none;gap:8px;background:#eef4ed;border-radius:25px;padding:4px;border:1px solid transparent}.row.show{display:flex}.row:focus-within{border-color:var(--gold)}input{flex:1;background:transparent;border:0;outline:0;padding:11px 12px;font-size:14px}.send{border:0;border-radius:21px;background:var(--gold);font-weight:750;padding:10px 16px;cursor:pointer}.safe{font-size:11.3px;color:#6f8179;text-align:center;padding:0 18px 9px;flex-shrink:0}.foot{padding:0 18px 12px;display:flex;gap:8px;justify-content:center;flex-shrink:0}.mini{border:0;background:transparent;color:#6f8179;font-size:12px;cursor:pointer}.modal{position:fixed;inset:0;background:rgba(0,0,0,.52);display:none;align-items:center;justify-content:center;z-index:9;padding:18px}.modal.show{display:flex}.card{background:var(--paper);border-radius:24px;padding:22px;width:min(540px,100%);box-shadow:var(--shadow)}.card h2{font-size:20px;margin-bottom:10px}.card p{font-size:14px;line-height:1.65;color:#34433d}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}.primary,.secondary{border:0;border-radius:14px;padding:10px 14px;cursor:pointer}.primary{background:var(--gold);font-weight:750}.secondary{background:#eef4ed}@media(max-width:540px){body{padding:0}.wrap{height:100dvh;max-width:100%}.app{border-radius:0}.head{padding:calc(12px + env(safe-area-inset-top)) 14px 10px}.msgs{padding:12px 14px calc(100px + env(safe-area-inset-bottom))}.m{font-size:14.6px}.tool{width:31px;height:31px}.opt{font-size:12px;padding:7px 11px}.foot{padding-bottom:calc(10px + env(safe-area-inset-bottom))}}

<body>
<div class="wrap"><main class="app"><header class="head"><div class="avatar">😊</div><div class="info"><h1>Mi Yo Interior</h1><p>Capítulo 4 · Confiar sin dejar de actuar</p></div><div class="tools"><button class="tool" id="voice">🔈</button><button class="tool" id="amb">🎵</button><button class="tool" id="theme">🌙</button><button class="tool" id="speed">🐢</button></div></header><div class="barwrap"><div class="bar" id="bar"></div></div><section class="msgs" id="msgs"></section><section class="opts"><div class="grid" id="grid"></div></section><section class="input"><div class="row" id="row"><input id="txt"><button class="send" id="send">Enviar</button></div></section><p class="safe">Experiencia reflexiva y educativa. No reemplaza atención psicológica, médica, legal o financiera profesional.</p><footer class="foot"><button class="mini" id="reset">↺ Reiniciar</button><button class="mini" id="save">💾 Guardar</button><button class="mini" id="clear">🧹 Borrar</button></footer></main></div><div class="modal" id="modal"><div class="card"><h2 id="mt"></h2><p id="mb"></p><div class="actions" id="ma"></div></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id); const msgs=$('msgs'),grid=$('grid'),row=$('row'),txt=$('txt'),bar=$('bar');
let st={step:'welcome',name:'',situacion:'',parte:'',accion:'',momento:'',tiempo:'',revision:'',comprobacion:'',frase:'',history:[],voice:false,ambient:false,dark:false,slow:true};
const STEPS=['welcome','name','situacion','parte','pausaIntro','pausa','paso','tiempo','comprobacion','revision','espejo','frase','fraseChange','fraseCustom','final'];
const COMPROBAR=['Sí, es lo que me corresponde hacer ahora','Necesito dividirlo en algo más pequeño','Necesito información antes de actuar','Necesito pedir apoyo','Ya hice mi parte y necesito establecer una fecha de revisión','✍️ Escribir mi propia respuesta'];
const CONFIRMAR=['Sí, quiero conservarla','Quiero cambiar una parte','Prefiero escribirla con mis palabras'];
const RISK=['suicidio','suicidarme','matarme','hacerme daño','no quiero vivir','autolesión','autolesion','abuso','violencia','emergencia','amenaza','peligro inmediato','presión grave','insegura','amenazado'];
function clean(t){return String(t||'').replace(/<strong[^>]*data-lexical-text="true"[^>]*>/g,'<strong>').replace(/<em[^>]*data-lexical-text="true"[^>]*>/g,'<em>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/\n/g,'<br>')}
function progress(){let i=STEPS.indexOf(st.step);bar.style.width=Math.max(0,Math.round((i/(STEPS.length-1))*100))+'%'}
function scrollEnd(){requestAnimationFrame(()=>setTimeout(()=>msgs.scrollTo({top:msgs.scrollHeight,behavior:'smooth'}),80))}
function add(text,who='ai',extra=''){let d=document.createElement('div');d.className='m '+who+(extra?' '+extra:'');d.innerHTML=clean(text);msgs.appendChild(d);if(who!=='typing')st.history.push({who,text,extra});scrollEnd();return d}
function typing(){let d=document.createElement('div');d.className='m typing';d.textContent='...';msgs.appendChild(d);scrollEnd();return d}
function opts(arr=[]){grid.innerHTML='';if(!arr.length){grid.classList.remove('show');return}grid.classList.add('show');arr.forEach(o=>{let b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>handle(o);grid.appendChild(b)})}
function inputShow(show,ph='Escribe aquí...'){row.classList.toggle('show',!!show);txt.placeholder=ph;if(show)setTimeout(()=>txt.focus(),60)}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function readPause(text){let w=String(text||'').split(/\s+/).filter(Boolean).length;return st.slow?Math.min(10000,Math.max(2200,w*170)):Math.min(5000,Math.max(900,w*80))}
function splitText(text){return String(text||'').split(/\n\n+/).map(x=>x.trim()).filter(Boolean)}
function emptyBubble(extra=''){let d=document.createElement('div');d.className='m ai'+(extra?' '+extra:'');msgs.appendChild(d);scrollEnd();return d}
async function typeInto(el,text){let out='';for(let i=0;i<text.length;i++){let ch=text.charAt(i);out+=ch;el.innerHTML=clean(out);if(i%3===0)scrollEnd();let ms=st.slow?(ch==='.'?340:(ch==='?'?460:(ch==='!'?420:(ch===','?150:(ch===';'?170:(ch===':'?170:28)))))):(ch==='.'?180:(ch==='?'?260:(ch==='!'?240:(ch===','?85:12))));await wait(ms)}el.innerHTML=clean(text);scrollEnd()}
async function ai(text,buttons=[],input=false,ph='Escribe aquí...',extra=''){opts([]);inputShow(false);progress();let parts=splitText(text);for(let part of parts){let t=typing();await wait(st.slow?900:450);t.remove();let b=emptyBubble(extra);await typeInto(b,part);st.history.push({who:'ai',text:part,extra});speak(part);await wait(readPause(part))}opts(buttons);inputShow(input,ph);save(false)}
function speak(text){if(!st.voice||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text.replace(/[\*#•]/g,''));u.lang='es-CL';u.rate=.86;speechSynthesis.speak(u)}
function risk(text){let x=String(text).toLowerCase();if(RISK.some(r=>x.includes(r))){st.step='risk';ai('Lo que describes puede requerir apoyo humano confiable. Esta experiencia no debe impulsarte a actuar ni a esperar si eso aumenta un riesgo. Si la situación es insegura o existe presión grave, detén el ejercicio y busca apoyo de una persona adulta de confianza o de un profesional adecuado.',['🌿 Volver al inicio']);return true}return false}
function handle(text){if(text.includes('Volver al inicio')||text.includes('Reiniciar'))return resetAll();add(text,'user');if(risk(text))return;process(String(text).trim())}
function dividirPaso(text){let raw=String(text||'').trim();let m=raw.match(/(.+?)\s+(?:y lo har[eé]|y lo hare|lo har[eé]|lo hare)\s+(.+)/i);if(m){st.accion=m[1].trim();st.momento=m[2].trim()}else{let p=raw.split('/');st.accion=(p[0]||raw).trim();st.momento=(p[1]||'en el momento que definí').trim()}if(!st.accion)st.accion=raw;if(!st.momento)st.momento='en el momento que definí'}
function construirFrase(){return 'Haré '+st.accion+' en '+st.momento+' y permitiré que '+st.tiempo+' siga el tiempo que no depende solamente de mí.'}
function process(text){switch(st.step){
case 'welcome':st.step='name';ai('😊 Hola. Soy **Mi Yo Interior**, el acompañante digital de este libro.\n\nNo puedo predecir lo que ocurrirá. Te ayudaré a reconocer qué puedes hacer y qué necesita seguir su propio proceso.\n\n¿Cómo te gustaría que te llame?',[],true,'Escribe tu nombre o un apodo.');break;
case 'name':st.name=text;st.step='situacion';ai('Gracias, **'+st.name+'**.\n\nPensemos en una situación en la que ya estás haciendo algo, pero todavía no conoces el resultado.\n\n🌿 ¿Qué situación te cuesta dejar avanzar sin vigilarla o pensarla constantemente?',[],true,'Me cuesta dejar avanzar...');break;
case 'situacion':st.situacion=text;st.step='parte';ai('Has reconocido que **'+st.situacion+'** mantiene tu atención puesta en el resultado.\n\nAntes de buscar una respuesta, vamos a separar las partes del proceso.\n\n📝 ¿Qué acción depende realmente de ti en esta situación?',[],true,'Lo que depende de mí es...');break;
case 'parte':st.parte=text;if(text.toLowerCase().includes('no sé')||text.toLowerCase().includes('no se')||text.toLowerCase().includes('no puedo hacer nada')){ai('No necesitas resolverlo completo.\n\nPiensa en una acción pequeña que permita avanzar, obtener información, pedir apoyo o comunicar algo con claridad.',[],true,'Lo que depende de mí es...');st.step='parte';}else{st.step='pausaIntro';ai('Tu parte concreta es **'+st.parte+'**.\n\nNo representa todo el resultado, pero sí el movimiento que reconociste como propio.',['👀 Recorrer la mirada'])}break;
case 'pausaIntro':st.step='pausa';ai('👀 Elige tres puntos seguros que puedas mirar sin moverte: uno a tu izquierda, uno frente a ti y uno a tu derecha.\n\nMira el punto de la izquierda y piensa:\n\n**“Aquí está la acción que me corresponde.”**\n\nMira el punto del centro y piensa:\n\n**“Aquí está el tiempo que el proceso necesita.”**\n\nMira el punto de la derecha y piensa:\n\n**“Aquí está el resultado que no puedo dirigir por completo.”**\n\nVuelve la mirada al centro. Las tres partes existen, pero no todas exigen lo mismo de ti.\n\n**Puedo actuar sin perseguir el resultado a cada momento.**',['✅ He recorrido las tres partes']);break;
case 'pausa':st.step='paso';ai('🚶 ¿Cuál será tu siguiente paso concreto y cuándo puedes realizarlo?',[],true,'Mi siguiente paso será... y lo haré...');break;
case 'paso':dividirPaso(text);st.step='tiempo';ai('Has definido una acción y un momento:\n\n**'+st.accion+'** — **'+st.momento+'**.\n\nEsto convierte tu intención en una responsabilidad visible, no en una espera pasiva.\n\n⏳ Después de hacer tu parte, ¿qué tendrá que seguir su propio tiempo o dependerá también de algo externo?',[],true,'Después de actuar, necesitaré permitir que...');break;
case 'tiempo':st.tiempo=text;st.step='comprobacion';ai('Has reconocido que, después de **'+st.accion+'**, necesitarás permitir que **'+st.tiempo+'**.\n\nConfiar aquí no significa asegurar el final; significa no confundir espera con abandono.\n\n🔍 ¿Tu próximo paso es suficiente y responsable por ahora?',COMPROBAR);break;
case 'comprobacion':st.comprobacion=text;if(text.includes('fecha de revisión')){st.step='revision';ai('Una fecha de revisión puede ayudarte a esperar sin vigilar constantemente.\n\n¿Cuándo volverás a revisar el proceso?',[],true,'Volveré a revisar...')}else if(text.includes('más pequeño')){st.step='revision';ai('Dividirlo puede volverlo más claro y realizable.\n\nEscribe una versión más pequeña del paso y cuándo la realizarás.',[],true,'Mi paso más pequeño será... y lo haré...')}else if(text.includes('información')){st.revision='cuando obtenga la información necesaria';st.step='espejo';ai('Buscar información también puede ser tu acción responsable.\n\nLa confianza no exige decidir sin datos suficientes.',['🪞 Continuar a devolución espejo'])}else if(text.includes('apoyo')){st.revision='cuando cuente con el apoyo que necesito';st.step='espejo';ai('Pedir apoyo también puede ser una acción concreta.\n\nNo convierte la espera en pasividad; la vuelve más responsable.',['🪞 Continuar a devolución espejo'])}else if(text.includes('Escribir')){st.step='revision';ai('✍️ Escribe con tus palabras qué necesitas ajustar o confirmar.',[],true,'Necesito...')}else{st.revision='si corresponde, en el momento definido por mí';st.step='espejo';ai('Has confirmado que este paso es lo que te corresponde hacer ahora.\n\nNo necesitas convertir cada parte del resultado en una tarea personal.',['🪞 Continuar a devolución espejo'])}break;
case 'revision':if(st.comprobacion.includes('más pequeño'))dividirPaso(text);else st.revision=text;st.step='espejo';ai('Queda registrado para no vigilar el proceso a cada instante.\n\nAhora reuniremos lo que tú mismo reconociste.',['🪞 Continuar a devolución espejo']);break;
case 'espejo':st.step='frase';ai('🪞 Quiero devolverte lo que tú mismo reconociste, **'+st.name+'**.\n\nLa situación que te cuesta dejar avanzar es **'+st.situacion+'**.\n\nDescubriste que tu parte consiste en **'+st.parte+'** y decidiste realizar **'+st.accion+'** en **'+st.momento+'**.\n\nTambién reconociste que, después de actuar, **'+st.tiempo+'** no quedará completamente bajo tu control.\n\nTu respuesta no fue esperar sin hacer nada ni intentar dominar todo el proceso. Fue actuar con claridad y permitir que el resto siga su curso.',['❤️ Crear mi frase personal']);break;
case 'frase':st.frase=construirFrase();st.step='confirmar';ai('❤️ Con tus propias respuestas, tu frase podría ser:\n\n**“'+st.frase+'”**\n\n¿Esta frase representa lo que descubriste?',CONFIRMAR,false,'','panel');break;
case 'confirmar':if(text.includes('conservar'))closing();else if(text.includes('cambiar')){st.step='fraseChange';ai('📝 ¿Qué parte quieres cambiar?',[],true,'Quiero cambiar...')}else{st.step='fraseCustom';ai('📝 Escribe tu frase con tus palabras. Puedo mejorar la claridad, pero no debo prometer un resultado, atribuir el desenlace al destino ni borrar tu responsabilidad.',[],true,'Mi frase personal es...')}break;
case 'fraseChange':st.frase=reform(text);closing();break;
case 'fraseCustom':st.frase=reform(text);closing();break;
case 'final':if(text.includes('Guardar'))downloadText();else if(text.includes('tarjeta'))downloadPNG();else if(text.includes('Volver al libro'))thanksNext();else if(text.includes('pausa')){st.step='pausaIntro';process('x')}else if(text.includes('paso')){st.step='paso';ai('Revisemos tu próximo paso.\n\n¿Cuál será tu siguiente paso concreto y cuándo puedes realizarlo?',[],true,'Mi siguiente paso será... y lo haré...')}else ai('Puedes elegir una de las opciones finales.',['📖 Volver al libro','💾 Guardar mi reflexión','🖼️ Descargar tarjeta visual PNG','👀 Repetir la pausa','🚶 Revisar mi próximo paso']);break;
case 'thanks':resetAll();break;default:resetAll();}}
function reform(text){let x=String(text||'').trim();return x?(/[.!?]$/.test(x)?x:x+'.'):st.frase}
function closing(){st.step='final';ai('🙏 Has terminado esta experiencia, **'+st.name+'**.\n\nHoy distinguiste tu acción del tiempo y del resultado.\n\nTu próximo paso será **'+st.accion+'** y lo realizarás **'+st.momento+'**.\n\nDespués permitirás que **'+st.tiempo+'** continúe sin vigilarla a cada instante.\n\nConfiar no reemplaza tu acción. Comienza después de haber reconocido con honestidad qué te corresponde hacer.\n\nTu frase es:\n\n**“'+st.frase+'”**',['📖 Volver al libro','💾 Guardar mi reflexión','🖼️ Descargar tarjeta visual PNG','👀 Repetir la pausa','🚶 Revisar mi próximo paso'])}
function thanksNext(){st.step='thanks';ai('🙏 Gracias por completar la experiencia del **Capítulo 4: Confiar sin dejar de actuar**.\n\nHoy reconociste tu parte, definiste un próximo paso y separaste el tiempo del proceso del resultado que no controlas por completo.\n\nCuando regreses al libro, completa el cierre del capítulo con calma.\n\n📚 **Próximo capítulo:** Capítulo 5, **El valor de elegir**. Ahí podrás observar una decisión pendiente sin exigir una opción perfecta.',['🏠 Ir al inicio'])}
function record(){return 'MI ACCIÓN Y MI CONFIANZA\n\nLa situación que me cuesta dejar avanzar:\n'+st.situacion+'\n\nLo que sí depende de mí:\n'+st.parte+'\n\nMi próximo paso:\n'+st.accion+'\n\nCuándo lo realizaré:\n'+st.momento+'\n\nLo que necesita tiempo o depende también de algo externo:\n'+st.tiempo+'\n\nCuándo volveré a revisar el proceso, si corresponde:\n'+(st.revision||'No definido')+'\n\nMi frase personal:\n'+st.frase}
function downloadText(){let blob=new Blob([record()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Mi_Accion_y_Mi_Confianza_Capitulo_4.txt';a.click();URL.revokeObjectURL(url);ai('✅ Tu reflexión se descargó como archivo de texto. También puedes descargar la tarjeta visual PNG.',['🖼️ Descargar tarjeta visual PNG','📖 Volver al libro','👀 Repetir la pausa'])}
function downloadPNG(){let c=document.createElement('canvas'),scale=2,w=1000,h=1320;c.width=w*scale;c.height=h*scale;let ctx=c.getContext('2d');ctx.scale(scale,scale);ctx.fillStyle='#fffaf3';round(ctx,0,0,w,h,34);ctx.fill();ctx.fillStyle='#eef4ed';round(ctx,36,36,w-72,h-72,28);ctx.fill();ctx.strokeStyle='#c9dfc7';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#1f2b27';ctx.font='700 40px Segoe UI';ctx.fillText('Mi acción y mi confianza',70,105);ctx.font='17px Segoe UI';ctx.fillStyle='#6f8179';ctx.fillText('Mi Yo Interior - Capitulo 4: Confiar sin dejar de actuar',70,138);let y=190;box(ctx,'La situación que me cuesta dejar avanzar',st.situacion,70,y,w-140);y+=155;box(ctx,'Lo que sí depende de mí',st.parte,70,y,w-140);y+=155;box(ctx,'Mi próximo paso',st.accion,70,y,w-140,true);y+=155;box(ctx,'Cuándo lo realizaré',st.momento,70,y,w-140);y+=145;box(ctx,'Lo que necesita tiempo o depende de algo externo',st.tiempo,70,y,w-140);y+=175;box(ctx,'Cuándo volveré a revisar',st.revision||'No definido',70,y,w-140);y+=145;box(ctx,'Mi frase personal',st.frase,70,y,w-140,true);ctx.fillStyle='#3f725b';ctx.font='18px Segoe UI';wrap(ctx,'Confiar sin dejar de actuar es hacer lo que corresponde, respetar el tiempo del proceso y renunciar a convertir todo el resultado en una obligación personal.',70,h-92,w-140,26);let a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='Mi_Accion_y_Mi_Confianza_Capitulo_4.png';a.click();ai('✅ Tu tarjeta visual PNG se descargó correctamente.',['📖 Volver al libro','👀 Repetir la pausa'])}
function box(ctx,title,text,x,y,w,featured){ctx.fillStyle=featured?'#dcebd9':'#fffaf3';round(ctx,x,y,w,118,20);ctx.fill();ctx.strokeStyle='#c9dfc7';ctx.stroke();ctx.fillStyle='#3f725b';ctx.font='700 19px Segoe UI';ctx.fillText(title,x+22,y+32);ctx.fillStyle='#1f2b27';ctx.font=featured?'700 21px Segoe UI':'17px Segoe UI';wrap(ctx,String(text||'No especificado'),x+22,y+62,w-44,25)}
function wrap(ctx,text,x,y,max,line){let words=String(text).replace(/\n/g,' \n ').split(' '),l='';for(let wd of words){if(wd==='\n'){ctx.fillText(l,x,y);l='';y+=line;continue}let test=l+wd+' ';if(ctx.measureText(test).width>max&&l){ctx.fillText(l,x,y);l=wd+' ';y+=line}else l=test}if(l)ctx.fillText(l,x,y)}
function round(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function save(show){localStorage.setItem('miYoInteriorCap4V5ConfiarSinDejarDeActuar',JSON.stringify(st));if(show)modal('Progreso guardado','Tu avance quedó guardado en este dispositivo.',[['Aceptar',closeModal,'primary']])}
function load(){try{return JSON.parse(localStorage.getItem('miYoInteriorCap4V5ConfiarSinDejarDeActuar')||'null')}catch(e){return null}}
function resetAll(){let v=st.voice,a=st.ambient,d=st.dark,s=st.slow;st={step:'welcome',name:'',situacion:'',parte:'',accion:'',momento:'',tiempo:'',revision:'',comprobacion:'',frase:'',history:[],voice:v,ambient:a,dark:d,slow:s};msgs.innerHTML='';opts([]);inputShow(false);start()}
function modal(t,b,acts){$('mt').textContent=t;$('mb').textContent=b;let ma=$('ma');ma.innerHTML='';acts.forEach(act=>{let bt=document.createElement('button');bt.textContent=act[0];bt.className=act[2]==='primary'?'primary':'secondary';bt.onclick=act[1];ma.appendChild(bt)});$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
let audioCtx=null;function ambient(){if(st.ambient){st.ambient=false;$('amb').textContent='🎵';if(audioCtx){audioCtx.close();audioCtx=null}return}st.ambient=true;$('amb').textContent='🎶';audioCtx=new (window.AudioContext||window.webkitAudioContext)();let osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.frequency.value=174;osc.type='sine';gain.gain.value=.018;osc.connect(gain);gain.connect(audioCtx.destination);osc.start()}
function voice(){st.voice=!st.voice;$('voice').textContent=st.voice?'🔊':'🔈';if(!st.voice&&'speechSynthesis'in window)speechSynthesis.cancel();save(false)}
function theme(){st.dark=!st.dark;document.body.style.filter=st.dark?'brightness(.82) contrast(1.05)':'none';save(false)}
function speed(){st.slow=!st.slow;$('speed').textContent=st.slow?'🐢':'🙂';save(false);modal('Velocidad de lectura',st.slow?'Modo pausado activado.':'Modo normal activado.',[['Aceptar',closeModal,'primary']])}
function start(){progress();add('Esta experiencia ofrece acompañamiento reflexivo y educativo. No reemplaza atención profesional.','sys');ai('🌿 **Bienvenido a Mi Yo Interior**\n\nHas llegado desde el capítulo **“Confiar sin dejar de actuar”**.\n\nConfiar no significa quedarse inmóvil ni asegurar que todo resultará como esperas.\n\nSignifica hacer tu parte sin intentar controlar cada etapa del camino.',['✨ Comenzar','⏳ Volver más tarde'])}
$('send').onclick=()=>{let t=txt.value.trim();if(t){txt.value='';handle(t)}};txt.addEventListener('keydown',e=>{if(e.key==='Enter')$('send').click()});$('reset').onclick=resetAll;$('save').onclick=()=>save(true);$('clear').onclick=()=>{localStorage.removeItem('miYoInteriorCap4V5ConfiarSinDejarDeActuar');modal('Datos borrados','Se eliminó el progreso guardado en este dispositivo.',[['Aceptar',closeModal,'primary']])};$('amb').onclick=ambient;$('voice').onclick=voice;$('theme').onclick=theme;$('speed').onclick=speed;
window.onload=()=>{setTimeout(()=>{let s=load();if(s&&s.history&&s.history.length>2){modal('Encontré un progreso previo','Hay una experiencia guardada de este capítulo. Puedes continuar o iniciar nuevamente.',[['Iniciar de nuevo',()=>{closeModal();resetAll()},'secondary'],['Continuar',()=>{closeModal();st=s;msgs.innerHTML='';st.history.forEach(m=>add(m.text,m.who,m.extra||''));ai('Continuamos desde tu experiencia guardada. Puedes guardar tu reflexión, descargar tu tarjeta visual o repetir la pausa.',['💾 Guardar mi reflexión','🖼️ Descargar tarjeta visual PNG','👀 Repetir la pausa'])},'primary']])}else start()},300)};
