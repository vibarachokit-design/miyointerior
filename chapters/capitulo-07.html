<style>

*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;width:100%}body{font-family:'Segoe UI',Tahoma,Verdana,sans-serif;min-height:100dvh;background:linear-gradient(145deg,var(--bg1),var(--bg2) 52%,var(--bg3));display:flex;align-items:center;justify-content:center;color:var(--ink);overflow:hidden;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}.wrap{width:100%;max-width:min(96vw,980px);height:min(96dvh,940px);display:flex}.app{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;background:rgba(255,250,243,.985);border-radius:30px;box-shadow:var(--shadow);border:1px solid rgba(221,200,154,.38)}.head{padding:15px 18px 12px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);background:rgba(255,250,243,.92);flex-shrink:0}.avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:radial-gradient(circle at 35% 25%,#fff6d6,#ddc89a 50%,#8d6b35);box-shadow:0 0 18px rgba(221,200,154,.65)}.info{flex:1;min-width:0}.info h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info p{font-size:11.5px;color:var(--muted)}.tools{display:flex;gap:6px}.tool{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#f4eee3;cursor:pointer;font-size:14px}.barwrap{height:4px;background:#eadfc9;flex-shrink:0}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .3s ease}.msgs{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:clamp(12px,2vw,22px) clamp(14px,2.4vw,30px) clamp(90px,11vh,140px);display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}.m{max-width:min(98%,860px);padding:clamp(11px,1.8vw,16px) clamp(14px,2vw,20px);border-radius:18px;font-size:clamp(14px,1.7vw,17px);line-height:1.85;overflow-wrap:anywhere}.ai{background:var(--paper2);align-self:flex-start;border-bottom-left-radius:5px}.user{background:var(--gold);align-self:flex-end;border-bottom-right-radius:5px}.sys{background:#fff3d4;border:1px solid var(--line);align-self:center;text-align:center;font-size:12.5px;color:#745c31}.panel{background:#fff8e9;border:1px solid var(--line);align-self:stretch;max-width:100%}.typing{background:var(--paper2);color:#7b7062;align-self:flex-start;font-size:20px;letter-spacing:2px;min-width:58px;text-align:center}.opts{padding:8px 18px 10px;flex-shrink:0}.grid{display:none;flex-wrap:wrap;gap:7px;justify-content:center}.grid.show{display:flex}.opt{border:1.4px solid var(--line);border-radius:999px;padding:8px 13px;background:#f4eee3;color:#2a241d;font-weight:650;cursor:pointer}.input{padding:0 18px 12px;flex-shrink:0}.row{display:none;gap:8px;background:#f4eee3;border-radius:25px;padding:4px;border:1px solid transparent}.row.show{display:flex}.row:focus-within{border-color:var(--gold)}input{flex:1;background:transparent;border:0;outline:0;padding:11px 12px;font-size:14px}.send{border:0;border-radius:21px;background:var(--gold);font-weight:750;padding:10px 16px;cursor:pointer}.safe{font-size:11.3px;color:#7b7062;text-align:center;padding:0 18px 9px;flex-shrink:0}.foot{padding:0 18px 12px;display:flex;gap:8px;justify-content:center;flex-shrink:0}.mini{border:0;background:transparent;color:#7b7062;font-size:12px;cursor:pointer}.modal{position:fixed;inset:0;background:rgba(0,0,0,.52);display:none;align-items:center;justify-content:center;z-index:9;padding:18px}.modal.show{display:flex}.card{background:var(--paper);border-radius:24px;padding:22px;width:min(540px,100%);box-shadow:var(--shadow)}.card h2{font-size:20px;margin-bottom:10px}.card p{font-size:14px;line-height:1.65;color:#4a3d2e}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}.primary,.secondary{border:0;border-radius:14px;padding:10px 14px;cursor:pointer}.primary{background:var(--gold);font-weight:750}.secondary{background:#f4eee3}@media(max-width:540px){body{padding:0}.wrap{height:100dvh;max-width:100%}.app{border-radius:0}.head{padding:calc(12px + env(safe-area-inset-top)) 14px 10px}.msgs{padding:12px 14px calc(100px + env(safe-area-inset-bottom))}.m{font-size:14.6px}.tool{width:31px;height:31px}.opt{font-size:12px;padding:7px 11px}.foot{padding-bottom:calc(10px + env(safe-area-inset-bottom))}}

<body>
<div class="wrap"><main class="app"><header class="head"><div class="avatar">😊</div><div class="info"><h1>Mi Yo Interior</h1><p>Capítulo 7 · Recibir sin culpa</p></div><div class="tools"><button class="tool" id="voice">🔈</button><button class="tool" id="amb">🎵</button><button class="tool" id="theme">🌙</button><button class="tool" id="speed">🐢</button></div></header><div class="barwrap"><div class="bar" id="bar"></div></div><section class="msgs" id="msgs"></section><section class="opts"><div class="grid" id="grid"></div></section><section class="input"><div class="row" id="row"><input id="txt"><button class="send" id="send">Enviar</button></div></section><p class="safe">Experiencia reflexiva y educativa. No reemplaza atención psicológica, médica, legal o financiera profesional.</p><footer class="foot"><button class="mini" id="reset">↺ Reiniciar</button><button class="mini" id="save">💾 Guardar</button><button class="mini" id="clear">🧹 Borrar</button></footer></main></div><div class="modal" id="modal"><div class="card"><h2 id="mt"></h2><p id="mb"></p><div class="actions" id="ma"></div></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id); const msgs=$('msgs'),grid=$('grid'),row=$('row'),txt=$('txt'),bar=$('bar');
let st={step:'welcome',name:'',ofrecido:'',condicion:'',significado:'',respuesta:'',honesta:'',frase:'',history:[],voice:false,ambient:false,dark:false,slow:true};
const STEPS=['welcome','name','ofrecido','condicion','pausaIntro','pausa','significado','significadoCustom','respuesta','respuestaCustom','honesta','espejo','frase','fraseChange','fraseCustom','final'];
const SIGNIFICADOS=['Apoyo','Alivio','Reconocimiento','Aprendizaje','Compañía','Una oportunidad','Escribir otro significado'];
const RESPUESTAS=['Aceptarlo y agradecer','Aceptar solo una parte','Pedir claridad sobre las condiciones','Tomarme un tiempo para decidir','Rechazarlo con respeto','Responder de otra manera'];
const CONFIRMAR=['Sí, quiero conservarla','Quiero cambiar una parte','Prefiero escribirla con mis palabras'];
const RISK=['suicidio','suicidarme','matarme','hacerme daño','no quiero vivir','autolesión','autolesion','abuso','violencia','emergencia','amenaza','peligro inmediato','presión grave','insegura','manipulación','manipulacion','obligado','obligada'];
function clean(t){return String(t||'').replace(/<strong[^>]*data-lexical-text="true"[^>]*>/g,'<strong>').replace(/<em[^>]*data-lexical-text="true"[^>]*>/g,'<em>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/\n/g,'<br>')}
function progress(){let i=STEPS.indexOf(st.step);bar.style.width=Math.max(0,Math.round((i/(STEPS.length-1))*100))+'%'}
function scrollEnd(){requestAnimationFrame(()=>setTimeout(()=>msgs.scrollTo({top:msgs.scrollHeight,behavior:'smooth'}),80))}
function add(text,who='ai',extra=''){let d=document.createElement('div');d.className='m '+who+(extra?' '+extra:'');d.innerHTML=clean(text);msgs.appendChild(d);if(who!=='typing')st.history.push({who,text,extra});scrollEnd();return d}
function typing(){let d=document.createElement('div');d.className='m typing';d.textContent='...';msgs.appendChild(d);scrollEnd();return d}
function opts(arr=[]){grid.innerHTML='';if(!arr.length){grid.classList.remove('show');return}grid.classList.add('show');arr.forEach(o=>{let b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>handle(o);grid.appendChild(b)})}
function inputShow(show,ph='Escribe aquí...'){row.classList.toggle('show',!!show);txt.placeholder=ph;if(show)setTimeout(()=>txt.focus(),60)}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function readPause(text){let w=String(text||'').split(/\s+/).filter(Boolean).length;return st.slow?Math.min(10000,Math.max(2200,w*170)):Math.min(5000,Math.max(900,w*80))}
function splitText(text){return String(text||'').split(/\n\n+/).map(x=>x.trim()).filter(Boolean)}
function emptyBubble(extra=''){let d=document.createElement('div');d.className='m ai'+(extra?' '+extra:'');msgs.appendChild(d);scrollEnd();return d}
async function typeInto(el,text){let out='';for(let i=0;i<text.length;i++){let ch=text.charAt(i);out+=ch;el.innerHTML=clean(out);if(i%3===0)scrollEnd();let ms=st.slow?(ch==='.'?340:(ch==='?'?460:(ch==='!'?420:(ch===','?150:(ch===';'?170:(ch===':'?170:28)))))):(ch==='.'?180:(ch==='?'?260:(ch==='!'?240:(ch===','?85:12))));await wait(ms)}el.innerHTML=clean(text);scrollEnd()}
async function ai(text,buttons=[],input=false,ph='Escribe aquí...',extra=''){opts([]);inputShow(false);progress();let parts=splitText(text);for(let part of parts){let t=typing();await wait(st.slow?900:450);t.remove();let b=emptyBubble(extra);await typeInto(b,part);st.history.push({who:'ai',text:part,extra});speak(part);await wait(readPause(part))}opts(buttons);inputShow(input,ph);save(false)}
function speak(text){if(!st.voice||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text.replace(/[\*#•]/g,''));u.lang='es-CL';u.rate=.86;speechSynthesis.speak(u)}
function risk(text){let x=String(text).toLowerCase();if(RISK.some(r=>x.includes(r))){st.step='risk';ai('Lo que describes puede requerir apoyo humano adecuado. Esta experiencia no debe empujarte a aceptar algo bajo presión, manipulación o inseguridad. Si hay presión grave o condiciones confusas que te ponen en riesgo, detén el ejercicio y busca apoyo de una persona adulta de confianza o de un profesional adecuado.',['🌿 Volver al inicio']);return true}return false}
function handle(text){if(text.includes('Volver al inicio')||text.includes('Reiniciar'))return resetAll();add(text,'user');if(risk(text))return;process(String(text).trim())}
function construirFrase(){return 'Puedo recibir '+st.ofrecido+' como '+st.significado+', responder '+st.honesta+' y conservar mi libertad para decidir lo que puedo dar.'}
function process(text){switch(st.step){
case 'welcome':st.step='name';ai('😊 Hola. Soy **Mi Yo Interior**, el acompañante digital de este libro.\n\nNo decidiré qué debes aceptar. Te ayudaré a reconocer si deseas recibirlo y qué condiciones necesitas para hacerlo sin culpa ni obligación.\n\n¿Cómo te gustaría que te llame?',[],true,'Escribe tu nombre o un apodo.');break;
case 'name':st.name=text;st.step='ofrecido';ai('Gracias, **'+st.name+'**.\n\nComparte solo lo necesario para observar esta experiencia.\n\n🤲 ¿Qué apoyo, reconocimiento, afecto u oportunidad te cuesta recibir en este momento?',[],true,'Me cuesta recibir...');break;
case 'ofrecido':st.ofrecido=text;st.step='condicion';ai('Has reconocido que te cuesta recibir **'+st.ofrecido+'**.\n\nAntes de decidir qué hacer, observemos qué pensamiento aparece cuando eso llega a ti.\n\n💭 Cuando imaginas aceptarlo, ¿qué sientes que tendrías que hacer, demostrar o devolver?',[],true,'Si lo acepto, siento que tendría que...');break;
case 'condicion':st.condicion=text;st.step='pausaIntro';ai('Al pensar en recibir **'+st.ofrecido+'**, aparece la idea de que tendrías que **'+st.condicion+'**.\n\nEsa condición puede explicar por qué recibir se siente más como una deuda que como una elección.',['🌿 Hacer espacio']);break;
case 'pausaIntro':st.step='pausa';ai('🌿 Mira la superficie que tienes frente a ti. Despeja lentamente un espacio pequeño: mueve un objeto a un lado o marca ese lugar con tus manos.\n\nObserva el espacio vacío. No tienes que llenarlo ni pagar por él en este momento.\n\nImagina que allí puede descansar lo que te ofrecen mientras decides cómo deseas recibirlo. No lo rechaces ni te apresures a compensarlo.\n\nRepite mentalmente:\n\n**“Puedo hacer espacio para recibir y conservar mi libertad de elegir.”**\n\nHacer espacio no significa aceptar automáticamente. Significa detener la reacción de rechazar, justificar o devolver antes de comprender lo que deseas.',['✅ He hecho espacio']);break;
case 'pausa':st.step='significado';ai('✨ Si pudieras recibirlo sin sentirte en deuda, ¿qué significado tendría para ti?',[],true,'Para mí significaría...');break;
case 'significado':if(text.toLowerCase().includes('no sé')||text.toLowerCase().includes('no se')){st.step='significadoCustom';ai('Puede significar apoyo, alivio, reconocimiento, aprendizaje, compañía u otra cosa.\n\nElige una opción o escribe tu propio significado.',SIGNIFICADOS)}else{st.significado=text;st.step='respuesta';ai('Tú mismo reconociste que recibirlo podría significar **'+st.significado+'**.\n\nEsta respuesta permite mirar lo ofrecido desde tu necesidad o valoración, y no solo desde la obligación que apareció.\n\n📝 Después de observarlo, ¿cómo deseas responder a lo que te ofrecen?',RESPUESTAS)}break;
case 'significadoCustom':if(text.includes('Escribir')){ai('✍️ Escribe con tus palabras qué significaría para ti recibirlo sin sentirte en deuda.',[],true,'Para mí significaría...');st.step='significado'}else{st.significado=text;st.step='respuesta';ai('Tú mismo reconociste que recibirlo podría significar **'+st.significado+'**.\n\nEsta respuesta permite mirar lo ofrecido desde tu necesidad o valoración, y no solo desde la obligación que apareció.\n\n📝 Después de observarlo, ¿cómo deseas responder a lo que te ofrecen?',RESPUESTAS)}break;
case 'respuesta':if(text.includes('otra manera')){st.step='respuestaCustom';ai('✍️ Escribe de qué manera deseas responder, manteniendo tu libertad y tus límites.',[],true,'Elijo...')}else{st.respuesta=text;st.step='honesta';ai('Has elegido **'+st.respuesta+'**.\n\nConfirmemos que esta respuesta nace de lo que deseas y de las condiciones reales, no de una presión para agradar o corresponder.\n\n💬 ¿Qué podrías decir o hacer para responder con honestidad, sin prometer más de lo que deseas o puedes dar?',[],true,'Mi respuesta será...')}break;
case 'respuestaCustom':st.respuesta=text;st.step='honesta';ai('Has elegido **'+st.respuesta+'**.\n\nConfirmemos que esta respuesta nace de lo que deseas y de las condiciones reales, no de una presión para agradar o corresponder.\n\n💬 ¿Qué podrías decir o hacer para responder con honestidad, sin prometer más de lo que deseas o puedes dar?',[],true,'Mi respuesta será...');break;
case 'honesta':st.honesta=text;st.step='espejo';ai('Tu respuesta será **'+st.honesta+'**.\n\nHas encontrado una forma de reconocer lo recibido sin entregar automáticamente tu tiempo, tus decisiones o tus límites.',['🪞 Continuar a devolución espejo']);break;
case 'espejo':st.step='frase';ai('🪞 Quiero devolverte lo que tú mismo reconociste, **'+st.name+'**.\n\nTe costaba recibir **'+st.ofrecido+'** porque sentías que tendrías que **'+st.condicion+'**.\n\nAl hacer espacio, descubriste que para ti podría significar **'+st.significado+'**.\n\nPor eso elegiste **'+st.respuesta+'** y expresarás **'+st.honesta+'**.\n\nLa respuesta no apareció fuera de ti: surgió cuando separaste gratitud, obligación y libertad.',['❤️ Crear mi frase personal']);break;
case 'frase':st.frase=construirFrase();st.step='confirmar';ai('❤️ Con tus propias respuestas, tu frase podría ser:\n\n**“'+st.frase+'”**\n\n¿Esta frase representa lo que descubriste?',CONFIRMAR,false,'','panel');break;
case 'confirmar':if(text.includes('conservar'))closing();else if(text.includes('cambiar')){st.step='fraseChange';ai('📝 ¿Qué parte quieres cambiar?',[],true,'Quiero cambiar...')}else{st.step='fraseCustom';ai('📝 Escribe tu frase con tus palabras. Puedo mejorar la claridad, pero no debo obligarte a aceptar, eliminar condiciones relevantes ni afirmar algo que no evaluaste.',[],true,'Mi frase personal es...')}break;
case 'fraseChange':st.frase=reform(text);closing();break;
case 'fraseCustom':st.frase=reform(text);closing();break;
case 'final':if(text.includes('Guardar'))downloadText();else if(text.includes('tarjeta'))downloadPNG();else if(text.includes('Volver al libro'))thanksNext();else if(text.includes('pausa')){st.step='pausaIntro';process('x')}else ai('Puedes elegir una de las opciones finales.',['📖 Volver al libro','💾 Guardar mi reflexión','🖼️ Descargar tarjeta visual PNG','🌿 Repetir la pausa']);break;
case 'thanks':resetAll();break;default:resetAll();}}
function reform(text){let x=String(text||'').trim();return x?(/[.!?]$/.test(x)?x:x+'.'):st.frase}
function closing(){st.step='final';ai('🙏 Has terminado esta experiencia, **'+st.name+'**.\n\nHoy reconociste que recibir **'+st.ofrecido+'** activaba la idea de **'+st.condicion+'**. También descubriste que para ti puede significar **'+st.significado+'**.\n\nElegiste **'+st.respuesta+'** y lo comunicarás así: **'+st.honesta+'**.\n\nTu frase personal es:\n\n**“'+st.frase+'”**\n\nCuando la culpa aparezca, recuerda el espacio que despejaste. Puedes agradecer lo que llega sin llenarlo inmediatamente con explicaciones, promesas o deudas que no elegiste.\n\n📚 **Próximo capítulo:** Capítulo 8, **Perdonarte y comenzar nuevamente**. Ahí podrás transformar el error en responsabilidad, aprendizaje y una nueva manera de actuar.',['📖 Volver al libro','💾 Guardar mi reflexión','🖼️ Descargar tarjeta visual PNG','🌿 Repetir la pausa'])}
function thanksNext(){st.step='thanks';ai('🙏 Gracias por completar la experiencia del **Capítulo 7: Recibir sin culpa**.\n\nHoy observaste qué te cuesta recibir, qué condición aparece y cómo responder con libertad, gratitud y límites.\n\nCuando regreses al libro, completa el cierre del capítulo con calma.\n\n📚 **Próximo capítulo:** Capítulo 8, **Perdonarte y comenzar nuevamente**. Ahí podrás transformar el error en responsabilidad, aprendizaje y una nueva manera de actuar.',['🏠 Ir al inicio'])}
function record(){return 'MI MANERA DE RECIBIR\n\nLo que me cuesta recibir:\n'+st.ofrecido+'\n\nLo que siento que tendría que hacer o devolver:\n'+st.condicion+'\n\nLo que recibirlo significa para mí:\n'+st.significado+'\n\nCómo elijo responder:\n'+st.respuesta+'\n\nLo que diré o haré con honestidad:\n'+st.honesta+'\n\nMi frase personal:\n'+st.frase}
function downloadText(){let blob=new Blob([record()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Mi_Manera_De_Recibir_Capitulo_7.txt';a.click();URL.revokeObjectURL(url);ai('✅ Tu reflexión se descargó como archivo de texto. También puedes descargar la tarjeta visual PNG.',['🖼️ Descargar tarjeta visual PNG','📖 Volver al libro','🌿 Repetir la pausa'])}

// ---- NUEVA FUNCIÓN downloadPNG CON ALTURA DINÁMICA ----
function downloadPNG(){
    var c=document.createElement('canvas');
    var scale=2;
    var w=1000;

    function countLines(text,maxWidth,fontSize){
        var ctx=document.createElement('canvas').getContext('2d');
        ctx.font=fontSize+'px Segoe UI';
        var words=String(text).replace(/\n/g,' \n ').split(' ');
        var lines=0,current='';
        for(var i=0;i<words.length;i++){
            var wd=words[i];
            if(wd==='\n'){lines++;current='';continue;}
            var test=current+wd+' ';
            if(ctx.measureText(test).width>maxWidth&&current){lines++;current=wd+' ';}
            else current=test;
        }
        if(current)lines++;
        return Math.max(lines,1);
    }

    var lineHeight=25;
    var maxWidth=w-140-44;
    var fields=[
        {title:'Lo que me cuesta recibir',text:st.ofrecido},
        {title:'Lo que siento que tendría que hacer o devolver',text:st.condicion},
        {title:'Lo que recibirlo significa para mí',text:st.significado,featured:true},
        {title:'Cómo elijo responder',text:st.respuesta},
        {title:'Lo que diré o haré con honestidad',text:st.honesta},
        {title:'Mi frase personal',text:st.frase,featured:true}
    ];

    var h=190;
    fields.forEach(function(f){
        var isFeatured=f.featured||false;
        var fontSize=isFeatured?21:17;
        var lines=countLines(f.text,maxWidth,fontSize);
        h+=32+30+(lines*lineHeight)+10+12;
    });
    h+=120;
    h=Math.max(1320,h);

    c.width=w*scale;
    c.height=h*scale;
    var ctx=c.getContext('2d');
    ctx.scale(scale,scale);

    ctx.fillStyle='#fffaf3';
    round(ctx,0,0,w,h,34);
    ctx.fill();

    ctx.fillStyle='#f4eee3';
    round(ctx,36,36,w-72,h-72,28);
    ctx.fill();
    ctx.strokeStyle='#ddc89a';
    ctx.lineWidth=2;
    ctx.stroke();

    ctx.fillStyle='#2a241d';
    ctx.font='700 40px Segoe UI';
    ctx.fillText('Mi manera de recibir',70,105);
    ctx.font='17px Segoe UI';
    ctx.fillStyle='#7b7062';
    ctx.fillText('Mi Yo Interior - Capítulo 7: Recibir sin culpa',70,138);

    var y=190;
    var x=70;
    var fieldWidth=w-140;

    fields.forEach(function(f){
        var isFeatured=f.featured||false;
        var fontSize=isFeatured?21:17;
        var lines=countLines(f.text,maxWidth,fontSize);
        var boxHeight=32+30+(lines*lineHeight)+10;

        ctx.fillStyle=isFeatured?'#ead7ae':'#fffaf3';
        round(ctx,x,y,fieldWidth,boxHeight,20);
        ctx.fill();
        ctx.strokeStyle='#ddc89a';
        ctx.lineWidth=1.5;
        ctx.stroke();

        ctx.fillStyle='#6f552b';
        ctx.font='700 19px Segoe UI';
        ctx.fillText(f.title,x+22,y+32);

        ctx.fillStyle='#2a241d';
        ctx.font=(isFeatured?'700 ':'')+fontSize+'px Segoe UI';
        wrap(ctx,String(f.text||'No especificado'),x+22,y+62,maxWidth,lineHeight);

        y+=boxHeight+12;
    });

    ctx.fillStyle='#6f552b';
    ctx.font='18px Segoe UI';
    wrap(ctx,'Recibir sin culpa significa reconocer lo que llega, comprender sus condiciones y responder desde la libertad, la gratitud y los propios límites.',70,h-82,w-140,26);

    var a=document.createElement('a');
    a.href=c.toDataURL('image/png');

    a.click();
    ai('✅ Tu tarjeta visual PNG se descargó correctamente.',['📖 Volver al libro','🌿 Repetir la pausa']);
}

// ---- FUNCIÓN wrap (se mantiene igual) ----
function wrap(ctx,text,x,y,max,line){
    var words=String(text).replace(/\n/g,' \n ').split(' ');
    var current='';
    for(var i=0;i<words.length;i++){
        var wd=words[i];
        if(wd==='\n'){ctx.fillText(current,x,y);current='';y+=line;continue;}
        var test=current+wd+' ';
        if(ctx.measureText(test).width>max&&current){ctx.fillText(current,x,y);current=wd+' ';y+=line;}
        else current=test;
    }
    if(current)ctx.fillText(current,x,y);
}

function round(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function start(){progress();add('Esta experiencia ofrece acompañamiento reflexivo y educativo. No reemplaza atención profesional.','sys');ai('🌿 **Bienvenido a Mi Yo Interior**\n\nHas llegado desde el capítulo **“Recibir sin culpa”**.\n\nA veces deseamos apoyo, reconocimiento o una oportunidad, pero cuando llegan sentimos que debemos justificarlos, devolverlos enseguida o demostrar que los merecemos.\n\nEn esta experiencia observarás qué te impide recibir con libertad.',['✨ Comenzar','⏳ Volver más tarde'])}
$('send').onclick=()=>{let t=txt.value.trim();if(t){txt.value='';handle(t)}};txt.addEventListener('keydown',e=>{if(e.key==='Enter')$('send').click()});$('reset').onclick=resetAll;$('save').onclick=()=>save(true);$('clear').onclick=()=>{localStorage.removeItem('miYoInteriorCap7V6RecibirSinCulpa');modal('Datos borrados','Se eliminó el progreso guardado en este dispositivo.',[['Aceptar',closeModal,'primary']])};$('amb').onclick=ambient;$('voice').onclick=voice;$('theme').onclick=theme;$('speed').onclick=speed;
window.onload=()=>{setTimeout(()=>{let s=load();if(s&&s.history&&s.history.length>2){modal('Encontré un progreso previo','Hay una experiencia guardada de este capítulo. Puedes continuar o iniciar nuevamente.',[['Iniciar de nuevo',()=>{closeModal();resetAll()},'secondary'],['Continuar',()=>{closeModal();st=s;msgs.innerHTML='';st.history.forEach(m=>add(m.text,m.who,m.extra||''));ai('Continuamos desde tu experiencia guardada. Puedes guardar tu reflexión, descargar tu tarjeta visual o repetir la pausa.',['💾 Guardar mi reflexión','🖼️ Descargar tarjeta visual PNG','🌿 Repetir la pausa'])},'primary']])}else start()},300)};
