<title>Mi Yo Interior - Capítulo 5 V6</title>
<style>
:root{--bg1:#1b1007;--bg2:#3a220d;--bg3:#604018;--paper:#fffaf3;--paper2:#f7eddc;--ink:#2e1d0e;--muted:#8a6b46;--gold:#e6c06a;--gold2:#b87325;--line:#ead09a;--shadow:0 40px 90px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;width:100%}body{font-family:'Segoe UI',Tahoma,Verdana,sans-serif;min-height:100dvh;background:linear-gradient(145deg,var(--bg1),var(--bg2) 52%,var(--bg3));display:flex;align-items:center;justify-content:center;color:var(--ink);overflow:hidden;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}.wrap{width:100%;max-width:min(96vw,980px);height:min(96dvh,940px);display:flex}.app{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;background:rgba(255,250,243,.985);border-radius:30px;box-shadow:var(--shadow);border:1px solid rgba(230,192,106,.38)}.head{padding:15px 18px 12px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);background:rgba(255,250,243,.92);flex-shrink:0}.avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:radial-gradient(circle at 35% 25%,#fff5c8,#e6c06a 50%,#9b5b1c);box-shadow:0 0 18px rgba(230,192,106,.65)}.info{flex:1;min-width:0}.info h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info p{font-size:11.5px;color:var(--muted)}.tools{display:flex;gap:6px}.tool{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#f7eddc;cursor:pointer;font-size:14px}.barwrap{height:4px;background:#f4dfad;flex-shrink:0}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .3s ease}.msgs{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:clamp(12px,2vw,22px) clamp(14px,2.4vw,30px) clamp(90px,11vh,140px);display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}.m{max-width:min(98%,860px);padding:clamp(11px,1.8vw,16px) clamp(14px,2vw,20px);border-radius:18px;font-size:clamp(14px,1.7vw,17px);line-height:1.85;overflow-wrap:anywhere}.ai{background:var(--paper2);align-self:flex-start;border-bottom-left-radius:5px}.user{background:var(--gold);align-self:flex-end;border-bottom-right-radius:5px}.sys{background:#fff3ce;border:1px solid var(--line);align-self:center;text-align:center;font-size:12.5px;color:#6c4a1c}.panel{background:#fff6dd;border:1px solid var(--line);align-self:stretch;max-width:100%}.typing{background:var(--paper2);color:#8a6b46;align-self:flex-start;font-size:20px;letter-spacing:2px;min-width:58px;text-align:center}.opts{padding:8px 18px 10px;flex-shrink:0}.grid{display:none;flex-wrap:wrap;gap:7px;justify-content:center}.grid.show{display:flex}.opt{border:1.4px solid var(--line);border-radius:999px;padding:8px 13px;background:#f7eddc;color:#2e1d0e;font-weight:650;cursor:pointer}.input{padding:0 18px 12px;flex-shrink:0}.row{display:none;gap:8px;background:#f7eddc;border-radius:25px;padding:4px;border:1px solid transparent}.row.show{display:flex}.row:focus-within{border-color:var(--gold)}input{flex:1;background:transparent;border:0;outline:0;padding:11px 12px;font-size:14px}.send{border:0;border-radius:21px;background:var(--gold);font-weight:750;padding:10px 16px;cursor:pointer}.safe{font-size:11.3px;color:#8a6b46;text-align:center;padding:0 18px 9px;flex-shrink:0}.foot{padding:0 18px 12px;display:flex;gap:8px;justify-content:center;flex-shrink:0}.mini{border:0;background:transparent;color:#8a6b46;font-size:12px;cursor:pointer}.modal{position:fixed;inset:0;background:rgba(0,0,0,.52);display:none;align-items:center;justify-content:center;z-index:9;padding:18px}.modal.show{display:flex}.card{background:var(--paper);border-radius:24px;padding:22px;width:min(540px,100%);box-shadow:var(--shadow)}.card h2{font-size:20px;margin-bottom:10px}.card p{font-size:14px;line-height:1.65;color:#4d3920}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}.primary,.secondary{border:0;border-radius:14px;padding:10px 14px;cursor:pointer}.primary{background:var(--gold);font-weight:750}.secondary{background:#f7eddc}@media(max-width:540px){body{padding:0}.wrap{height:100dvh;max-width:100%}.app{border-radius:0}.head{padding:calc(12px + env(safe-area-inset-top)) 14px 10px}.msgs{padding:12px 14px calc(100px + env(safe-area-inset-bottom))}.m{font-size:14.6px}.tool{width:31px;height:31px}.opt{font-size:12px;padding:7px 11px}.foot{padding-bottom:calc(10px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<div class="wrap"><main class="app"><header class="head"><div class="avatar">😊</div><div class="info"><h1>Mi Yo Interior</h1><p>Capítulo 5 · El valor de elegir</p></div><div class="tools"><button class="tool" id="voice">🔈</button><button class="tool" id="amb">🎵</button><button class="tool" id="theme">🌙</button><button class="tool" id="speed">🐢</button></div></header><div class="barwrap"><div class="bar" id="bar"></div></div><section class="msgs" id="msgs"></section><section class="opts"><div class="grid" id="grid"></div></section><section class="input"><div class="row" id="row"><input id="txt"><button class="send" id="send">Enviar</button></div></section><p class="safe">Experiencia reflexiva y educativa. No reemplaza atención psicológica, médica, legal o financiera profesional.</p><footer class="foot"><button class="mini" id="reset">↺ Reiniciar</button><button class="mini" id="save">💾 Guardar</button><button class="mini" id="clear">🧹 Borrar</button></footer></main></div><div class="modal" id="modal"><div class="card"><h2 id="mt"></h2><p id="mb"></p><div class="actions" id="ma"></div></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id); const msgs=$('msgs'),grid=$('grid'),row=$('row'),txt=$('txt'),bar=$('bar');
let st={step:'welcome',name:'',decision:'',opciones:'',opcion:'',criterio:'',consecuencia:'',influencia:'',resultado:'',momento:'',aclarar:'',frase:'',history:[],voice:false,ambient:false,dark:false,slow:true};
const STEPS=['welcome','name','decision','pausaIntro','pausa','opciones','criterio','consecuencia','influencia','definir','campoDefinir','espejo','frase','fraseChange','fraseCustom','final'];
const INFLUENCIAS=['Lo que considero importante','Una necesidad o responsabilidad concreta','Información suficiente','El miedo a decepcionar','La presión de otra persona','El deseo de terminar rápido con la incertidumbre','Una mezcla de varios motivos','✍️ Escribir mi propia respuesta'];
const DEFINIR=['Estoy preparado para elegir','Necesito una información concreta','Necesito conversar con alguien','Necesito pedir más tiempo','Haré una prueba pequeña y reversible','Necesito revisar si esta decisión es realmente mía','✍️ Escribir mi propia respuesta'];
const CONFIRMAR=['Sí, quiero conservarla','Quiero cambiar una parte','Prefiero escribirla con mis palabras'];
const RISK=['suicidio','suicidarme','matarme','hacerme daño','no quiero vivir','autolesión','autolesion','abuso','violencia','emergencia','amenaza','peligro inmediato','presión grave','insegura','amenazado'];
function clean(t){return String(t||'').replace(/<strong[^>]*data-lexical-text="true"[^>]*>/g,'<strong>').replace(/<em[^>]*data-lexical-text="true"[^>]*>/g,'<em>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/\n/g,'<br>')}
function progress(){let i=STEPS.indexOf(st.step);bar.style.width=Math.max(0,Math.round((i/(STEPS.length-1))*100))+'%'}
function scrollEnd(){requestAnimationFrame(()=>setTimeout(()=>msgs.scrollTo({top:msgs.scrollHeight,behavior:'smooth'}),80))}
function add(text,who='ai',extra=''){let d=document.createElement('div');d.className='m '+who+(extra?' '+extra:'');d.innerHTML=clean(text);msgs.appendChild(d);if(who!=='typing')st.history.push({who,text,extra});scrollEnd();return d}
function typing(){let d=document.createElement('div');d.className='m typing';d.textContent='...';msgs.appendChild(d);scrollEnd();return d}
function opts(arr=[]){grid.innerHTML='';if(!arr.length){grid.classList.remove('show');return}grid.classList.add('show');arr.forEach(o=>{let b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>handle(o);grid.appendChild(b)})}
function inputShow(show,ph='Escribe aquí...'){row.classList.toggle('show',!!show);txt.placeholder=ph;if(show)setTimeout(()=>txt.focus(),60)}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function readPause(text){let w=String(text||'').split(/\s+/).filter(Boolean).length;return st.slow?Math.min(10000,Math.max(2200,w*170)):Math.min(5000,Math.max(900,w*80))}
function splitText(text){return String(text||'').split(/\n\n+/).map(x=>x.trim()).filter(Boolean)}
function emptyBubble(extra=''){let d=document.createElement('div');d.className='m ai'+(extra?' '+extra:'');msgs.appendChild(d);scrollEnd();return d}
async function typeInto(el,text){let out='';for(let i=0;i<text.length;i++){let ch=text.charAt(i);out+=ch;el.innerHTML=clean(out);if(i%3===0)scrollEnd();let ms=st.slow?(ch==='.'?340:(ch==='?'?460:(ch==='!'?420:(ch===','?150:(ch===';'?170:(ch===':'?170:28)))))):(ch==='.'?180:(ch==='?'?260:(ch==='!'?240:(ch===','?85:12))));await wait(ms)}el.innerHTML=clean(text);scrollEnd()}
async function ai(text,buttons=[],input=false,ph='Escribe aquí...',extra=''){opts([]);inputShow(false);progress();let parts=splitText(text);for(let part of parts){let t=typing();await wait(st.slow?900:450);t.remove();let b=emptyBubble(extra);await typeInto(b,part);st.history.push({who:'ai',text:part,extra});speak(part);await wait(readPause(part))}opts(buttons);inputShow(input,ph);save(false)}
function speak(text){if(!st.voice||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text.replace(/[\*#•]/g,''));u.lang='es-CL';u.rate=.86;speechSynthesis.speak(u)}
function risk(text){let x=String(text).toLowerCase();if(RISK.some(r=>x.includes(r))){st.step='risk';ai('Lo que describes puede requerir apoyo humano confiable. Esta experiencia no debe impulsarte a elegir, actuar o esperar si eso aumenta un riesgo. Si la situación es insegura o existe presión grave, detén el ejercicio y busca apoyo de una persona adulta de confianza o de un profesional adecuado.',['🌿 Volver al inicio']);return true}return false}
function handle(text){if(text.includes('Volver al inicio')||text.includes('Reiniciar'))return resetAll();add(text,'user');if(risk(text))return;process(String(text).trim())}
function extraerOpcionCriterio(text){let parts=String(text).split(/porque/i);st.opcion=(parts[0]||text).replace('La opción más coherente parece ser','').trim();st.criterio=(parts[1]||'lo considero importante').trim();if(!st.opcion)st.opcion=text;if(!st.criterio)st.criterio='lo considero importante'}
function construirFrase(){let base=st.resultado||st.opcion;return 'Puedo elegir '+base+' porque para mí es importante '+st.criterio+', aceptando que '+st.consecuencia+'.'}
function process(text){switch(st.step){
case 'welcome':st.step='name';ai('😊 Hola. Soy **Mi Yo Interior**, el acompañante digital de este libro.\n\nNo decidiré por ti. Te ayudaré a ordenar tus opciones para que reconozcas el criterio que ya estás formando.\n\n¿Cómo te gustaría que te llame?',[],true,'Escribe tu nombre o un apodo.');break;
case 'name':st.name=text;st.step='decision';ai('Gracias, **'+st.name+'**. No necesitas contar todos los detalles.\n\nComparte solamente lo necesario para observar la decisión con claridad.\n\n🗝️ ¿Qué decisión estás postergando o te cuesta tomar?',[],true,'La decisión que necesito observar es...');break;
case 'decision':st.decision=text;st.step='pausaIntro';ai('Has identificado que necesitas decidir sobre **'+st.decision+'**.\n\nAntes de comparar las opciones, tomemos distancia de la urgencia.',['🌿 Un paso atrás']);break;
case 'pausaIntro':st.step='pausa';ai('🌿 Este ejercicio puede hacerse sentado o de pie. Si estás de pie y el lugar es seguro, da un pequeño paso hacia atrás. Si estás sentado, apoya suavemente la espalda en el respaldo.\n\nMira un punto fijo frente a ti y afloja las manos. Durante unos segundos, no intentes resolver nada.\n\nObserva la decisión como si estuviera escrita frente a ti. Repite mentalmente:\n\n**“Puedo tomar distancia sin abandonar la decisión.”**\n\nAhora recuerda:\n\n**“No necesito elegir desde la urgencia. Necesito claridad suficiente para reconocer qué estoy dispuesto a asumir.”**\n\nDar un paso atrás no posterga la decisión: crea espacio para verla mejor.',['✅ Estoy preparado para mirar mis opciones']);break;
case 'pausa':st.step='opciones';ai('⚖️ ¿Cuáles son las opciones que realmente podrías tomar en este momento?\n\nIncluye Opción A, Opción B y, si existe, otra opción posible. Si seguir postergando es una posibilidad real, también conviene nombrarla.',[],true,'Opción A... / Opción B... / Otra opción posible...');break;
case 'opciones':st.opciones=text;st.step='criterio';ai('Estas son las posibilidades que tú mismo reconociste:\n\n**'+st.opciones+'**\n\nNo necesitamos agregar una opción ideal. Trabajaremos con los caminos que hoy existen para ti.\n\n🔍 ¿Cuál opción se acerca más a lo que necesitas, valoras o consideras responsable? ¿Por qué?',[],true,'La opción más coherente parece ser... porque...');break;
case 'criterio':extraerOpcionCriterio(text);st.step='consecuencia';ai('Has señalado **'+st.opcion+'** porque **'+st.criterio+'**.\n\nNo voy a convertirlo en una recomendación ni afirmar que es la opción correcta. Solo estamos ordenando tu criterio.\n\n⚖️ Si eligieras esa opción, ¿qué consecuencia, renuncia o dificultad tendrías que aceptar?',[],true,'Tendría que aceptar...');break;
case 'consecuencia':st.consecuencia=text;st.step='influencia';ai('Elegir **'+st.opcion+'** también implica aceptar **'+st.consecuencia+'**.\n\nReconocerlo no invalida tu elección; evita imaginar que existe un camino sin costos ni renuncias.\n\n🔎 ¿Qué influye más en esta elección?',INFLUENCIAS);break;
case 'influencia':st.influencia=text;if(text.includes('Escribir')){ai('✍️ Escribe con tus palabras qué influye más en esta elección.',[],true,'Influye más...');st.step='influenciaCustom'}else{influenciaRespuesta(text)}break;
case 'influenciaCustom':st.influencia=text;influenciaRespuesta(text);break;
case 'definir':st.step='campoDefinir';ai('📝 Después de observar tus opciones, ¿qué puedes definir hoy?',DEFINIR);break;
case 'campoDefinir':if(text.includes('Estoy preparado')){st.resultado='elegir '+st.opcion;st.momento='ahora o en el momento que defina';st.aclarar='No aplica';st.step='espejo';ai('Has definido que estás preparado para elegir.\n\nAhora reuniremos lo que tú mismo reconociste.',['🪞 Continuar a devolución espejo'])}else if(text.includes('información')){st.resultado='buscar una información concreta';st.step='campoDetalle';ai('Buscar un dato concreto también puede ser tu decisión de hoy.\n\n¿Qué información necesitas y cuándo volverás a revisar la decisión?',[],true,'Antes de elegir necesito... y volveré a revisarlo...')}else if(text.includes('conversar')){st.resultado='conversar con alguien';st.step='campoDetalle';ai('Conversar puede ayudarte a comparar sin entregar tu decisión por completo.\n\n¿Con quién necesitas conversar y cuándo volverás a revisar la decisión?',[],true,'Antes de elegir necesito... y volveré a revisarlo...')}else if(text.includes('pedir más tiempo')){st.resultado='pedir más tiempo';st.step='campoDetalle';ai('Pedir más tiempo puede ser responsable si evita decidir desde la urgencia.\n\n¿Qué necesitas aclarar y cuándo volverás a decidir?',[],true,'Antes de elegir necesito... y volveré a revisarlo...')}else if(text.includes('prueba')){st.resultado='hacer una prueba pequeña y reversible';st.step='campoDetalle';ai('Una prueba pequeña puede darte información sin obligarte a una decisión definitiva.\n\n¿Qué prueba realizarás y cuándo revisarás lo que aprendiste?',[],true,'Haré... y volveré a revisarlo...')}else if(text.includes('realmente mía')){st.resultado='revisar si esta decisión es realmente mía';st.step='campoDetalle';ai('Revisar si la decisión es realmente tuya puede ayudarte a distinguir criterio propio de presión externa.\n\n¿Qué necesitas revisar y cuándo volverás a decidir?',[],true,'Antes de elegir necesito... y volveré a revisarlo...')}else if(text.includes('Escribir')){st.step='campoDetalle';ai('✍️ Escribe con tus palabras qué puedes definir hoy y cuándo lo revisarás o realizarás.',[],true,'Hoy puedo definir... y lo haré...')}else{st.resultado=text;st.momento='en el momento que defina';st.aclarar='No especificado';st.step='espejo';ai('Queda registrado como tu próximo paso.\n\nAhora reuniremos lo que tú mismo reconociste.',['🪞 Continuar a devolución espejo'])}break;
case 'campoDetalle':st.aclarar=text;let parts=String(text).split(/y volver[eé]|y lo har[eé]|y lo hare|lo har[eé]|lo hare/i);st.momento=(parts[1]||'en el momento que definí').trim();st.step='espejo';ai('Queda registrado como tu próximo paso.\n\nNo necesitas una certeza perfecta para avanzar de forma responsable.',['🪞 Continuar a devolución espejo']);break;
case 'espejo':st.step='frase';ai('🪞 Quiero devolverte lo que tú mismo reconociste, **'+st.name+'**.\n\nLa decisión que observaste fue **'+st.decision+'**.\n\nEntre tus opciones, reconociste **'+st.opcion+'** como la más coherente porque **'+st.criterio+'**.\n\nTambién viste que elegirla implicaría aceptar **'+st.consecuencia+'**.\n\nPor eso definiste **'+st.resultado+'**. La respuesta no vino de mí: apareció al comparar lo que valoras con aquello que estás dispuesto a asumir.',['❤️ Crear mi frase personal']);break;
case 'frase':st.frase=construirFrase();st.step='confirmar';ai('❤️ Con tus propias respuestas, tu frase podría ser:\n\n**“'+st.frase+'”**\n\n¿Esta frase representa lo que descubriste?',CONFIRMAR,false,'','panel');break;
case 'confirmar':if(text.includes('conservar'))closing();else if(text.includes('cambiar')){st.step='fraseChange';ai('📝 ¿Qué parte quieres cambiar?',[],true,'Quiero cambiar...')}else{st.step='fraseCustom';ai('📝 Escribe tu frase con tus palabras. Puedo mejorar la claridad, pero no debo prometer un resultado perfecto, decidir por ti ni borrar las consecuencias reconocidas.',[],true,'Mi frase personal es...')}break;
case 'fraseChange':st.frase=reform(text);closing();break;
case 'fraseCustom':st.frase=reform(text);closing();break;
case 'final':if(text.includes('Guardar'))downloadText();else if(text.includes('tarjeta'))downloadPNG();else if(text.includes('Volver al libro'))thanksNext();else if(text.includes('pausa')){st.step='pausaIntro';process('x')}else if(text.includes('opciones')){st.step='opciones';ai('Volvamos a revisar tus opciones reales.\n\n¿Cuáles son las opciones que realmente podrías tomar en este momento?',[],true,'Opción A... / Opción B... / Otra opción posible...')}else ai('Puedes elegir una de las opciones finales.',['📖 Volver al libro','💾 Guardar mi elección','🖼️ Descargar tarjeta visual PNG','🌿 Repetir la pausa','🔄 Volver a revisar mis opciones']);break;
case 'thanks':resetAll();break;default:resetAll();}}
function influenciaRespuesta(text){if(text.includes('miedo')||text.includes('presión')||text.includes('incertidumbre')){ai('Es importante reconocer esa influencia sin descartar automáticamente la opción.\n\nRevisemos la elección con calma para que no quede tomada solo por presión, miedo o urgencia.',['➡️ Continuar'])}else if(text.includes('Información')){ai('Si falta información suficiente, buscar un dato concreto puede ser el resultado responsable de hoy.\n\nNo necesitas elegir sin datos que consideras necesarios.',['➡️ Continuar'])}else{ai('Has identificado un motivo que puede sostener tu criterio.\n\nAhora veremos qué puedes definir hoy sin exigir una certeza perfecta.',['➡️ Continuar'])}st.step='definir'}
function reform(text){let x=String(text||'').trim();return x?(/[.!?]$/.test(x)?x:x+'.'):st.frase}
function closing(){st.step='final';ai('🙏 Has terminado esta experiencia, **'+st.name+'**.\n\nHoy tomaste distancia de la urgencia y observaste tus opciones reales.\n\nReconociste que **'+st.opcion+'** se acerca más a **'+st.criterio+'**, y que elegirla exige aceptar **'+st.consecuencia+'**.\n\nTu decisión o próximo paso será **'+st.resultado+'** y lo revisarás o realizarás **'+(st.momento||'en el momento que definiste')+'**.\n\nElegir no significa conocer todo lo que ocurrirá. Significa responder conscientemente por el camino que decides explorar o asumir.\n\nTu frase es:\n\n**“'+st.frase+'”**\n\n📚 **Próximo capítulo:** Capítulo 6, **Soltar la necesidad de controlar**. Ahí podrás conservar tu capacidad de actuar sin intentar dirigirlo todo.',['📖 Volver al libro','💾 Guardar mi elección','🖼️ Descargar tarjeta visual PNG','🌿 Repetir la pausa','🔄 Volver a revisar mis opciones'])}
function thanksNext(){st.step='thanks';ai('🙏 Gracias por completar la experiencia del **Capítulo 5: El valor de elegir**.\n\nHoy observaste una decisión pendiente, comparaste tus opciones reales y reconociste qué consecuencia estás dispuesto a asumir.\n\nCuando regreses al libro, completa el cierre del capítulo con calma.\n\n📚 **Próximo capítulo:** Capítulo 6, **Soltar la necesidad de controlar**. Ahí podrás conservar tu capacidad de actuar sin intentar dirigirlo todo.',['🏠 Ir al inicio'])}
function record(){return 'MI ELECCIÓN CONSCIENTE\n\nLa decisión que necesito tomar:\n'+st.decision+'\n\nMis opciones reales:\n'+st.opciones+'\n\nLa opción más coherente conmigo:\n'+st.opcion+'\n\nLa consecuencia que necesito aceptar:\n'+st.consecuencia+'\n\nLo que todavía necesito aclarar:\n'+(st.aclarar||'No aplica')+'\n\nMi decisión o próximo paso y cuándo lo realizaré:\n'+st.resultado+' / '+(st.momento||'No definido')+'\n\nMi frase personal:\n'+st.frase}

// ---- NUEVA FUNCIÓN downloadPNG CON ALTURA DINÁMICA ----
function downloadPNG(){
    var c=document.createElement('canvas');
    var scale=2;
    var w=1000;

    function countLines(text,maxWidth,fontSize){
        var ctx=document.createElement('canvas').getContext('2d');
        ctx.font=fontSize+'px Segoe UI';
        var words=String(text).replace(/\n/g,' \n ').split(' ');
        var lines=0,current='';
        for(var i=0;i<words.length;i++){
            var wd=words[i];
            if(wd==='\n'){lines++;current='';continue;}
            var test=current+wd+' ';
            if(ctx.measureText(test).width>maxWidth&&current){lines++;current=wd+' ';}
            else current=test;
        }
        if(current)lines++;
        return Math.max(lines,1);
    }

    var lineHeight=25;
    var maxWidth=w-140-44;
    var fields=[
        {title:'La decisión que necesito tomar',text:st.decision},
        {title:'Mis opciones reales',text:st.opciones},
        {title:'La opción más coherente conmigo',text:st.opcion,featured:true},
        {title:'La consecuencia que necesito aceptar',text:st.consecuencia},
        {title:'Lo que todavía necesito aclarar',text:st.aclarar||'No aplica'},
        {title:'Mi decisión o próximo paso',text:st.resultado+' / '+(st.momento||'No definido')},
        {title:'Mi frase personal',text:st.frase,featured:true}
    ];

    var h=190;
    fields.forEach(function(f){
        var isFeatured=f.featured||false;
        var fontSize=isFeatured?21:17;
        var lines=countLines(f.text,maxWidth,fontSize);
        h+=32+30+(lines*lineHeight)+10+12;
    });
    h+=120;
    h=Math.max(1320,h);

    c.width=w*scale;
    c.height=h*scale;
    var ctx=c.getContext('2d');
    ctx.scale(scale,scale);

    ctx.fillStyle='#fffaf3';
    round(ctx,0,0,w,h,34);
    ctx.fill();

    ctx.fillStyle='#f7eddc';
    round(ctx,36,36,w-72,h-72,28);
    ctx.fill();
    ctx.strokeStyle='#e6c06a';
    ctx.lineWidth=2;
    ctx.stroke();

    ctx.fillStyle='#2e1d0e';
    ctx.font='700 40px Segoe UI';
    ctx.fillText('Mi elección consciente',70,105);
    ctx.font='17px Segoe UI';
    ctx.fillStyle='#8a6b46';
    ctx.fillText('Mi Yo Interior - Capítulo 5: El valor de elegir',70,138);

    var y=190;
    var x=70;
    var fieldWidth=w-140;

    fields.forEach(function(f){
        var isFeatured=f.featured||false;
        var fontSize=isFeatured?21:17;
        var lines=countLines(f.text,maxWidth,fontSize);
        var boxHeight=32+30+(lines*lineHeight)+10;

        ctx.fillStyle=isFeatured?'#ffe6a8':'#fffaf3';
        round(ctx,x,y,fieldWidth,boxHeight,20);
        ctx.fill();
        ctx.strokeStyle='#e6c06a';
        ctx.lineWidth=1.5;
        ctx.stroke();

        ctx.fillStyle='#8c561c';
        ctx.font='700 19px Segoe UI';
        ctx.fillText(f.title,x+22,y+32);

        ctx.fillStyle='#2e1d0e';
        ctx.font=(isFeatured?'700 ':'')+fontSize+'px Segoe UI';
        wrap(ctx,String(f.text||'No especificado'),x+22,y+62,maxWidth,lineHeight);

        y+=boxHeight+12;
    });

    ctx.fillStyle='#8c561c';
    ctx.font='18px Segoe UI';
    wrap(ctx,'Elegir conscientemente no es encontrar un camino sin dudas: es reconocer qué criterio deseas respetar y qué consecuencia estás dispuesto a asumir.',70,h-82,w-140,26);

    var a=document.createElement('a');
    a.href=c.toDataURL('image/png');
    a.download='Mi_Eleccion_Consciente_Capitulo_5.png';
    a.click();
    ai('✅ Tu tarjeta visual PNG se descargó correctamente.',['📖 Volver al libro','🔄 Volver a revisar mis opciones']);
}

// ---- FUNCIÓN wrap (se mantiene igual) ----
function wrap(ctx,text,x,y,max,line){
    var words=String(text).replace(/\n/g,' \n ').split(' ');
    var current='';
    for(var i=0;i<words.length;i++){
        var wd=words[i];
        if(wd==='\n'){ctx.fillText(current,x,y);current='';y+=line;continue;}
        var test=current+wd+' ';
        if(ctx.measureText(test).width>max&&current){ctx.fillText(current,x,y);current=wd+' ';y+=line;}
        else current=test;
    }
    if(current)ctx.fillText(current,x,y);
}

function round(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

window.onload=()=>{setTimeout(()=>{let s=load();if(s&&s.history&&s.history.length>2){modal('Encontré un progreso previo','Hay una experiencia guardada de este capítulo. Puedes continuar o iniciar nuevamente.',[['Iniciar de nuevo',()=>{closeModal();resetAll()},'secondary'],['Continuar',()=>{closeModal();st=s;msgs.innerHTML='';st.history.forEach(m=>add(m.text,m.who,m.extra||''));ai('Continuamos desde tu experiencia guardada. Puedes guardar tu elección, descargar tu tarjeta visual o revisar tus opciones.',['💾 Guardar mi elección','🖼️ Descargar tarjeta visual PNG','🔄 Volver a revisar mis opciones'])},'primary']])}else start()},300)};
